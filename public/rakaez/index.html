function parseSMS(text){let m=text.match(/(?:SAR|ر\.س|ريال(?:اً)?|مبلغ|بقيمة|amount)\s*[:：]?\s*([0-9٠-٩۰-۹,.،]+)/i)||text.match(/([0-9٠-٩۰-۹][0-9٠-٩۰-۹,.،]*)\s*(?:SAR|ر\.س|ريال)/i);let normalize=s=>s.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/،/g,'');let num=m?Number(normalize(m[1]).replace(/,/g,'')):NaN;let date=text.match(/20\d{2}[-/]\d{1,2}[-/]\d{1,2}/)?.[0]?.replace(/\//g,'-')||iso(today);let inflow=/إيداع|حوالة واردة|راتب|استلام|إضافة رصيد|credited/i.test(text);return {date,description:text.trim().slice(0,130),type:inflow?'income':'expense',category:'other',amount:Number.isFinite(num)?Math.round(num*100):0}}
function csvSplit(line){let out=[],s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){out.push(s);s=''}else s+=c}out.push(s);return out}function normalizeCSV(text){let lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()),head=csvSplit(lines.shift()||'').map(s=>s.trim().toLowerCase());function col(names){return head.findIndex(h=>names.includes(h))}let di=col(['date','التاريخ','تاريخ العملية']),de=col(['description','الوصف','البيان','details','merchant']),am=col(['amount_sar','amount','المبلغ','قيمة العملية']),ty=col(['type','النوع']),ca=col(['category','البند']);if(di<0||am<0)throw Error('يجب أن يحتوي الملف على عمودي date و amount أو التاريخ والمبلغ');return lines.map(line=>{let cells=csvSplit(line),s=(cells[am]||'').replace(/[ر$\s]/g,'').replace(/,/g,''),num=Number(s);let type=ty>=0?cells[ty]:(num<0?'expense':'expense');return {id:rid(),date:(cells[di]||'').replace(/\//g,'-'),description:cells[de]||'عملية مستوردة',type:/income|دخل/i.test(type)?'income':'expense',category:ca>=0&&db.categories.find(c=>c.id===cells[ca])?cells[ca]:'other',amount:Math.round(Math.abs(num)*100)}}).filter(x=>/^\d{4}-\d{1,2}-\d{1,2}$/.test(x.date)&&Number.isFinite(x.amount)&&x.amount>0)}function duplicate(t){return db.transactions.some(x=>x.date===t.date&&x.amount===t.amount&&x.description===t.description&&x.type===t.type)}function importView(){return `${sTitle('استيراد معاملات من الكشوف والرسائل','الاستيراد يتطلب مراجعتك قبل الحفظ')}<div class="split"><section class="card"><div class="cardtitle">استيراد كشف CSV</div><p class="tiny muted">الحقول المدعومة: date, description, amount, type, category. يدعم العناوين الإنجليزية والعربية المحددة. ملف Excel: احفظه بصيغة CSV أولاً.</p><input type="file" accept=".csv,text/csv" id="csvFile" onchange="readCsv(this)" style="width:100%"><p class="notice">الاستيراد لا يتصل ببنكك ولا يرفع الملف إلى خادم. راجع كل عملية وتأكد من اتجاه المصروفات والدخل.</p></section><section class="card"><div class="cardtitle">تحليل رسالة بنكية نصية</div><textarea id="sms" style="width:100%;min-height:105px" placeholder="الصق نص رسالة مصرفية هنا بعد إزالة أي بيانات حساسة..."></textarea><div class="actions"><button class="btn primary" onclick="readSMS()">تحليل ومعاينة الرسالة</button></div><p class="tiny muted">لا يمكن للصفحة قراءة الرسائل من الهاتف تلقائياً. استخدم اللصق اليدوي.</p></section></div>${sTitle('معاينة قبل الاعتماد')}<section class="card" id="importPreview">${importRows.length?previewRows():'<div class="empty">اختر كشف CSV أو الصق رسالة ليظهر جدول المراجعة</div>'}</section>`}function readCsv(input){let file=input.files?.[0];if(!file)return;if(file.size>3000000)return alert('الملف كبير جداً. الحد 3 ميجابايت');let fr=new FileReader();fr.onload=()=>{try{importRows=normalizeCSV(fr.result);render();toast('يرجى مراجعة السجلات قبل الاعتماد')}catch(e){alert(e.message)}};fr.readAsText(file,'utf-8')}function readSMS(){let s=document.getElementById('sms').value.trim();if(!s)return alert('أدخل نص الرسالة');let t=parseSMS(s);if(!t.amount)return alert('تعذر التعرف على المبلغ. أدخل العملية يدوياً بدلاً من ذلك.');importRows=[t];render()}function previewRows(){let valid=importRows.filter(t=>!duplicate(t));return `<p class="tiny muted">${importRows.length} صف، منها ${importRows.length-valid.length} مكرر. راجع التاريخ والاتجاه والبند قبل الاعتماد.</p><div class="tablewrap"><table><tr><th>التاريخ</th><th>الوصف</th><th>الاتجاه</th><th>المبلغ</th><th>الحالة</th></tr>${importRows.slice(0,100).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description)}</td><td>${t.type==='expense'?'مصروف':'دخل'}</td><td>${money(t.amount)}</td><td><span class="tag ${duplicate(t)?'neg':''}">${duplicate(t)?'مكرر':'جاهز'}</span></td></tr>`).join('')}</table></div>${importRows.length>100?'<p class="tiny muted">تُعرض أول 100 عملية فقط</p>':''}<div class="actions"><button class="btn" onclick="importRows=[];render()">إلغاء</button><button class="btn primary" onclick="approveImport()">اعتماد ${valid.length} عملية</button></div>`}function approveImport(){let rows=importRows.filter(t=>!duplicate(t));db.transactions.push(...rows);audit('استيراد معاملات',String(rows.length));save();importRows=[];navigate('transactions');toast('اعتُمِدت '+rows.length+' عملية')}

function v4Numbers(){
 const saving=db.savings.reduce((a,b)=>a+Math.max(0,Number(b.balance)||0),0);
 const investments=db.holdings.reduce((a,h)=>a+(h.kind==='محفظة استثمارية'?Math.max(0,Number(h.marketValue)||0):Math.max(0,Number(h.quantity)||0)*Math.max(0,Number(h.price)||0)),0);
 const debt=db.debts.reduce((a,d)=>a+Math.max(0,(Number(d.principal)||0)-(Number(d.paid)||0)),0);
 const internal=db.fundings.reduce((a,f)=>a+Math.max(0,(Number(f.principal)||0)-(Number(f.paid)||0)),0);
 const annualFees=db.fees.reduce((a,f)=>a+(f.period==='once'?0:Math.round((Number(f.amount)||0)*countPeriods(f))),0);
 const operatingBudget=income()*db.ratios.hilal/100;
 const spending=spent();
 return {saving,investments,debt,internal,annualFees,operatingBudget,spending,operatingHeadroom:operatingBudget-spending,partialNet:saving+investments-debt};
}

function positionView(){let b=v4Numbers();let bankDetail=[['بنك الهلال','مخصص تشغيل الشهر',b.operatingBudget,'مصروفات الشهر',b.spending,'فرق المخصص والمصروف',b.operatingHeadroom],['بنك ملاءة','رصيد الادخار المسجل',b.saving,'الاحتياطي المستهدف',db.reserves.malaa||0,'فرق الرصيد عن المستهدف',b.saving-(db.reserves.malaa||0)],['بنك الأصول','القيمة السوقية المدخلة',b.investments,'المستهدف الاحتياطي',db.reserves.assets||0,'فرق القيمة عن المستهدف',b.investments-(db.reserves.assets||0)]];
return `<div class="notice"><strong>مهم:</strong> هذه لوحة مركز مالي جزئي حسب البيانات المسجلة، وليست ميزانية عمومية مكتملة: لا نملك رصيد الحساب النقدي الحقيقي لدى الهلال أو النقد غير المستثمر لدى الأصول. المخصصات الشهرية لا تُعامل كنقد مؤكد، والاستثمارات لا تُضاف مرتين.</div><div class="grid stats">${stat('أرصدة ملاءة المسجلة',b.saving,'شرائح الادخار','var(--blue)','shield')}${stat('قيمة الاستثمارات المسجلة',b.investments,'آخر تقييم مدخل','var(--gold)','trend')}${stat('الديون الخارجية المتبقية',b.debt,'لا يشمل التمويل الداخلي','var(--red)','fund')}${stat('صافي المركز الجزئي',b.partialNet,'الادخار + الاستثمار − الديون الخارجية','var(--teal)','bank')}</div>${sTitle('بنوك المنصة التفصيلية','مبالغ متفاوتة الطبيعة لا تجمع تلقائياً في رصيد نقدي واحد')}<div class="grid banks">${bankDetail.map(r=>`<section class="card"><h3>${r[0]}</h3>${[1,3,5].map((i)=>`<div class="metricline"><span>${r[i]}</span><b class="money">${money(r[i+1])}</b></div>`).join('')}<div class="actions"><button class="btn" onclick="navigate('${r[0].includes('الهلال')?'hilal':r[0].includes('ملاءة')?'malaa':'assets'}')">عرض البنك</button></div></section>`).join('')}</div>${sTitle('التزامات غير نقدية ومؤشرات تخطيطية')}<section class="card"><div class="metricline"><span>أصل التمويل الداخلي الإداري (لا يُطرح ثانيةً من الموحد)</span><b>${money(b.internal)}</b></div><div class="metricline"><span>الرسوم الدورية المتوقعة سنوياً (ليست مدفوعة)</span><b>${money(b.annualFees)}</b></div><div class="metricline"><span>مجموع الاحتياطيات المستهدفة (أهداف لا أرصدة)</span><b>${money(Object.values(db.reserves).reduce((a,n)=>a+(Number(n)||0),0))}</b></div><div class="metricline"><span>الأهداف المالية المستقبلية (لا تخصم من الثروة الحالية)</span><b>${money(db.goals.reduce((a,g)=>a+(Number(g.target)||0),0))}</b></div></section><div class="actions"><button class="btn primary" onclick="navigate('interbank')">خطط التمويل بين المراكز</button><button class="btn" onclick="navigate('insights')">عرض التحليلات</button></div>`}
function interbankView(){return `<div class="notice"><strong>محاكاة تمويل داخلي:</strong> هذا سجل عقود مقترحة بين مراكزك المالية الافتراضية، ولا ينفذ سحباً أو إيداعاً أو يخلق أرباحاً إجمالية. يتطلب التنفيذ الفعلي مستقبلاً قيوداً مزدوجة ومطابقة حسابات.</div>${sTitle('طلبات التمويل بين المراكز','طلب جديد لا يؤثر على الأرصدة المسجلة')}<section class="card"><div class="actions"><button class="btn primary" onclick="interbankForm()">＋ طلب تمويل داخلي</button></div><div class="tablewrap"><table><thead><tr><th>الجهة المقرضة</th><th>الجهة المستفيدة</th><th>الأصل</th><th>المعدل السنوي</th><th>المدة</th><th>التكلفة التقديرية</th><th>الحالة</th><th>إدارة</th></tr></thead><tbody>${db.interbankPlans.map(f=>`<tr><td>${bankName(f.from)}</td><td>${bankName(f.to)}</td><td>${money(f.principal)}</td><td>${f.rate}%</td><td>${f.months} شهر</td><td>${money(Math.round(f.principal*f.rate/100*f.months/12))}</td><td><span class="tag gold">للدراسة فقط</span></td><td><div class="crudactions"><button class="btn" onclick="interbankDetails('${f.id}')">تفاصيل</button><button class="btn" onclick="interbankForm('${f.id}')">تعديل</button><button class="btn warn" onclick="interbankDelete('${f.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا توجد طلبات تمويل بين البنوك</td></tr>'}</tbody></table></div></section>`}
function interbankForm(id=''){let f=db.interbankPlans.find(x=>x.id===id)||{from:'malaa',to:'hilal',principal:0,rate:0,months:3,notes:''};let choices=v4Banks;let fields=v3Select('iFrom','من البنك المقرض',f.from,choices)+v3Select('iTo','إلى البنك المستفيد',f.to,choices)+v3Field('iPrincipal','أصل التمويل (ر.س)',f.principal/100,'number','min="0.01" step="0.01" required')+v3Field('iRate','معدل سنوي افتراضي (%)',f.rate,'number','min="0" max="100" step="0.01"')+v3Field('iMonths','مدة التمويل بالأشهر',f.months,'number','min="1" max="120" step="1"')+v3Field('iNotes','سبب الطلب',f.notes);document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="v3header"><h2>${id?'تعديل':'إضافة'} طلب تمويل بين البنوك</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="event.preventDefault();interbankSave('${id}')"><div class="formgrid v3form">${fields}</div><p class="tiny muted">الفائدة أو الربح الداخلي لا يزيد صافي الثروة المجمعة؛ الحساب تخطيطي ولا يقتطع من أي حساب.</p><div class="v3footer"><button type="submit" class="btn primary">حفظ</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form></div></div>`}
function interbankSave(id){let from=getVal('iFrom'),to=getVal('iTo'),principal=cents('iPrincipal'),rate=Number(getVal('iRate')),months=Number(getVal('iMonths'));if(from===to)return alert('يجب اختيار بنكين مختلفين');if(!Number.isFinite(principal)||principal<=0||!Number.isFinite(rate)||rate<0||rate>100||!Number.isInteger(months)||months<1||months>120)return alert('راجع قيمة التمويل والمعدل والمدة');let f={id:id||rid(),from,to,principal,rate,months,notes:getVal('iNotes')};if(id){let i=db.interbankPlans.findIndex(x=>x.id===id);if(i<0)return alert('السجل غير موجود');db.interbankPlans[i]=f}else db.interbankPlans.push(f);audit(id?'تعديل طلب تمويل':'إضافة طلب تمويل',bankName(from)+' → '+bankName(to));save();closeModal();render();toast('حفظ الطلب التخطيطي')}
function interbankDelete(id){if(!confirm('حذف طلب التمويل؟'))return;db.interbankPlans=db.interbankPlans.filter(x=>x.id!==id);audit('حذف تمويل تخطيطي',id);save();render()}
function interbankDetails(id){let f=db.interbankPlans.find(x=>x.id===id);if(!f)return;document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="v3header"><h2>تفاصيل طلب التمويل</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="metricline"><span>من</span><b>${bankName(f.from)}</b></div><div class="metricline"><span>إلى</span><b>${bankName(f.to)}</b></div><div class="metricline"><span>المبلغ</span><b>${money(f.principal)}</b></div><div class="metricline"><span>تكلفة بسيطة افتراضية للفترة</span><b>${money(Math.round(f.principal*f.rate*f.months/1200))}</b></div><div class="metricline"><span>الملاحظة</span><b>${esc(f.notes||'—')}</b></div><p class="notice">حالة العقد: للدراسة، لم يتم ترحيل مبالغ فعلية.</p><div class="v3footer"><button class="btn primary" onclick="interbankForm('${id}')">تعديل</button><button class="btn" onclick="closeModal()">إغلاق</button></div></div></div>`}
function insightsView(){let b=v4Numbers(),notes=[];let totalLimits=db.categories.reduce((a,c)=>a+Number(c.limit||0)*100,0),monthlyFees=Math.round(b.annualFees/12),monthlyDebt=db.debts.reduce((a,d)=>a+(Number(d.installment)||0),0);
if(totalLimits>b.operatingBudget&&income())notes.push(['تحذير','الميزانية التشغيلية أكبر من مخصص الهلال','مجموع الحدود '+money(totalLimits)+' مقابل مخصص '+money(b.operatingBudget),'hilal']);
for(let c of db.categories){let used=spent(c.id),limit=Number(c.limit||0)*100;if(limit>0&&used>=limit*.8)notes.push([used>=limit?'تحذير':'متابعة','بند '+c.name+' وصل إلى '+Math.round(used/limit*100)+'%','المصروف '+money(used)+' من حد '+money(limit),'hilal'])}
if(monthlyDebt+monthlyFees>db.salary*.2)notes.push(['متابعة','التزامات الأقساط والرسوم المخططة مرتفعة','المكافئ الشهري '+money(monthlyDebt+monthlyFees)+' ('+(100*(monthlyDebt+monthlyFees)/db.salary).toFixed(1)+'% من الراتب)','debts']);
let instant=db.savings.find(x=>x.days===0)?.balance||0;if(instant<(db.reserves.malaa||0))notes.push(['متابعة','السيولة الفورية دون احتياطي ملاءة المستهدف','الفرق '+money((db.reserves.malaa||0)-instant),'malaa']);
if(db.holdings.some(h=>h.kind==='محفظة استثمارية'&&!h.marketValue))notes.push(['بيانات','تحتاج بعض المحافظ إلى قيمة سوقية مدخلة','لا يمكن تحديد الربح الفعلي من العائد المتوقع وحده','assets']);
if(!notes.length)notes.push(['معلومة','لا توجد تجاوزات في قواعد التنبيه الأساسية','هذه نتيجة لما سُجل فقط، ولا تعني خلو الوضع من المخاطر','position']);
return `${sTitle('تنبيهات قابلة للتفسير','قواعد تعتمد على بياناتك المحلية، وليست توصيات تداول أو أسعاراً مباشرة')}<div class="grid banks">${notes.map(n=>`<section class="card"><span class="tag ${n[0]==='تحذير'?'neg':'gold'}">${n[0]}</span><h3 style="margin-top:12px">${esc(n[1])}</h3><p>${esc(n[2])}</p><button class="btn" onclick="navigate('${n[3]}')">مراجعة البيانات</button></section>`).join('')}</div>${sTitle('اختبارات سلامة المركز المالي')}<section class="card"><div class="metricline"><span>راتب الإعدادات</span><b>${money(db.salary)}</b></div><div class="metricline"><span>أقساط الديون الخارجية شهرياً</span><b>${money(monthlyDebt)}</b></div><div class="metricline"><span>مكافئ الرسوم الدورية شهرياً</span><b>${money(monthlyFees)}</b></div><div class="metricline"><span>مجموع ميزانيات بنود التشغيل</span><b>${money(totalLimits)}</b></div><div class="metricline"><span>نسبة الالتزامات الشهرية من الراتب (تقريبية)</span><b>${db.salary?(100*(monthlyDebt+monthlyFees)/db.salary).toFixed(2):'0.00'}%</b></div></section><p class="notice">تُحدَّث النتائج عند تعديل البيانات وفتح هذه الشاشة. لا توجد مراقبة في الخلفية ولا إشعارات دفع على الجهاز في النسخة المحلية.</p>`}


// V5: Independent trial double-entry ledger. Earlier V1-V4 data are NOT silently converted.
if(!Array.isArray(db.ledgerEntries))db.ledgerEntries=[];
if(!db.ledgerOpening)db.ledgerOpening={hilal:0,malaa:0,assets:0};
const ledgerAccounts=[['hilal','نقد الهلال'],['malaa','نقد ملاءة'],['assets','نقد الأصول'],['salary','إيراد الراتب'],['expense','مصروفات التشغيل'],['outside','رصيد افتتاحي / مصدر خارجي']];
const ledgerCash=['hilal','malaa','assets'];
function ledgerBalance(key){return db.ledgerEntries.reduce((s,e)=>s+e.lines.filter(l=>l.account===key).reduce((a,l)=>a+l.debit-l.credit,0),0)+(db.ledgerOpening[key]||0)}
function ledgerAdd(date,description,lines,kind){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!description.trim())throw Error('أدخل التاريخ والوصف');if(lines.some(l=>!ledgerAccounts.some(a=>a[0]===l.account)||!Number.isSafeInteger(l.debit)||!Number.isSafeInteger(l.credit)||l.debit<0||l.credit<0))throw Error('قيد غير صالح');let d=lines.reduce((s,l)=>s+l.debit,0),c=lines.reduce((s,l)=>s+l.credit,0);if(d!==c||d<=0)throw Error('يجب أن يتساوى المدين والدائن');db.ledgerEntries.push({id:rid(),date,description:description.trim(),kind,lines,createdAt:new Date().toISOString()});audit('قيد يومية',description);save()}
function ledgerOptions(current='hilal'){return ledgerCash.map(k=>`<option value="${k}" ${current===k?'selected':''}>${esc(ledgerAccounts.find(a=>a[0]===k)[1])}</option>`).join('')}
function ledgerForm(){document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="v3header"><h2>إثبات حركة مالية جديدة</h2><button class="btn" onclick="closeModal()">×</button></div><p class="notice">تُرحّل هذه العملية إلى دفتر الأستاذ V5 فقط؛ لا تُكررها في سجل المعاملات القديم. لا تُعدل القيود بعد الحفظ، ويمكن عكسها.</p><div class="formgrid">${v3Field('lDate','تاريخ العملية',iso(new Date()),'date')}${v3Field('lDesc','الوصف','','text') }<div class="field"><label>نوع الحركة</label><select id="lKind" onchange="ledgerTypeChange()"><option value="income">إيداع / راتب فعلي</option><option value="expense">مصروف فعلي</option><option value="transfer">تحويل بين البنوك</option></select></div><div class="field"><label>البنك الرئيسي</label><select id="lFrom">${ledgerOptions()}</select></div><div class="field" id="lDestination" style="display:none"><label>البنك المستلم</label><select id="lTo">${ledgerOptions('malaa')}</select></div>${v3Field('lAmount','المبلغ (ر.س)','0','number','min="0.01" step="0.01"')}</div><div class="v3footer"><button class="btn primary" onclick="ledgerSubmit()">حفظ وترحيل القيد</button><button class="btn" onclick="closeModal()">إلغاء</button></div></div></div>`}
function ledgerTypeChange(){document.getElementById('lDestination').style.display=getVal('lKind')==='transfer'?'block':'none'}
function ledgerSubmit(){let kind=getVal('lKind'),from=getVal('lFrom'),to=getVal('lTo'),v=cents('lAmount'),date=getVal('lDate'),desc=getVal('lDesc');if(!Number.isSafeInteger(v)||v<=0)return alert('أدخل مبلغاً موجباً صحيحاً');if(kind==='transfer'&&from===to)return alert('البنكان مختلفان');try{let lines=kind==='income'?[{account:from,debit:v,credit:0},{account:'salary',debit:0,credit:v}]:kind==='expense'?[{account:'expense',debit:v,credit:0},{account:from,debit:0,credit:v}]:[{account:to,debit:v,credit:0},{account:from,debit:0,credit:v}];if(kind!=='income'&&ledgerBalance(from)<v)return alert('الرصيد المرحّل في دفتر V5 غير كافٍ؛ أثبت رصيدك الافتتاحي أولاً');ledgerAdd(date,desc,lines,kind);closeModal();render();toast('قيد متوازن تم ترحيله')}catch(e){alert(e.message)}}
function ledgerOpen(){document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="v3header"><h2>إثبات الرصيد الافتتاحي</h2><button class="btn" onclick="closeModal()">×</button></div><p class="notice">أدخل نقداً مؤكداً من كشف الحساب في بداية استخدام V5، ولا تُدخل مخصصات الراتب أو استثماراتك كأنها نقد. تُسجّل العملية بقيد متوازن مع حساب الأرصدة الافتتاحية.</p><div class="formgrid"><div class="field"><label>البنك</label><select id="oBank">${ledgerOptions()}</select></div>${v3Field('oAmount','الرصيد النقدي المؤكد (ر.س)','0','number','min="0.01" step="0.01"')}${v3Field('oDate','تاريخ الرصيد',iso(new Date()),'date')}</div><div class="v3footer"><button class="btn primary" onclick="ledgerSaveOpening()">إثبات الرصيد</button><button class="btn" onclick="closeModal()">إلغاء</button></div></div></div>`}
function ledgerSaveOpening(){let bank=getVal('oBank'),v=cents('oAmount');if(!Number.isSafeInteger(v)||v<=0)return alert('أدخل مبلغاً صحيحاً');try{ledgerAdd(getVal('oDate'),'رصيد افتتاحي مثبت '+ledgerAccounts.find(a=>a[0]===bank)[1],[{account:bank,debit:v,credit:0},{account:'outside',debit:0,credit:v}],'opening');closeModal();render();toast('تم إثبات رصيد افتتاحي')}catch(e){alert(e.message)}}
function ledgerReverse(id){let e=db.ledgerEntries.find(x=>x.id===id);if(!e||db.ledgerEntries.some(x=>x.reversalOf===id))return alert('القيد معكوس بالفعل');if(!confirm('سيُنشأ قيد عكسي مستقل دون حذف الأصل. متابعة؟'))return;let rev={id:rid(),date:iso(new Date()),description:'عكس: '+e.description,kind:'reversal',reversalOf:e.id,lines:e.lines.map(l=>({account:l.account,debit:l.credit,credit:l.debit})),createdAt:new Date().toISOString()};db.ledgerEntries.push(rev);audit('عكس قيد',id);save();render()}
function ledgerView(){let entries=db.ledgerEntries.slice().sort((a,b)=>b.date.localeCompare(a.date)),total=ledgerCash.reduce((s,k)=>s+ledgerBalance(k),0);return `${sTitle('دفتر الأستاذ والمطابقة','قيود مزدوجة محفوظة محلياً — مسار جديد مستقل عن سجلات V1–V4')}<div class="notice">هذا دفتر اختباري: لا تُرحّل معاملات الإصدارات القديمة تلقائياً، ولا تدخل في هذه الأرصدة الاستثمارات أو المحافظ أو الديون أو الرسوم قبل إثبات قيودها هنا. لا يمثل مجموع النقد صافي الثروة.</div><div class="grid stats">${ledgerCash.map(k=>stat(ledgerAccounts.find(a=>a[0]===k)[1],ledgerBalance(k),'رصيد نقدي وفق قيود V5','var(--blue)','bank')).join('')}${stat('إجمالي النقد المرحّل',total,'مجموع أرصدة بنوك المنصة الثلاثة','var(--teal)','wallet')}</div><section class="card"><div class="actions"><button class="btn primary" onclick="ledgerForm()">＋ حركة مالية</button><button class="btn" onclick="ledgerOpen()">إثبات رصيد افتتاحي</button><button class="btn" onclick="ledgerReconcile()">مطابقة كشف حساب</button><button class="btn" onclick="ledgerCsv()">تصدير القيود CSV</button></div></section>${sTitle('قيود اليومية','الحذف ممنوع لضمان أثر المراجعة؛ يمكن إنشاء قيد عكسي')}<section class="card"><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>التوازن</th><th>إجراء</th></tr></thead><tbody>${entries.length?entries.map(e=>{let d=e.lines.reduce((s,l)=>s+l.debit,0),c=e.lines.reduce((s,l)=>s+l.credit,0);return `<tr><td>${esc(e.date)}</td><td><b>${esc(e.description)}</b><br><small>${esc(e.lines.map(l=>ledgerAccounts.find(a=>a[0]===l.account)?.[1]||l.account).join(' / '))}</small></td><td>${money(d)}</td><td>${money(c)}</td><td><span class="tag ${d===c?'':'neg'}">${d===c?'متوازن':'غير متوازن'}</span></td><td><button class="btn warn" ${e.reversalOf||db.ledgerEntries.some(x=>x.reversalOf===e.id)?'disabled':''} onclick="ledgerReverse('${e.id}')">عكس القيد</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">لم يتم إدخال قيود بعد. ابدأ بإثبات أرصدة افتتاحية function toggleRakaezNotifications(){
 const panel=document.getElementById('rakaezNotifications'),button=document.getElementById('rakaezBell');
 if(!panel||!button)return;
 const opening=panel.hidden;
 if(opening){
  const alerts=[];
  try{
   if(Array.isArray(db.categories))for(const c of db.categories){
    const allowance=Number(c.limit||0)*100+(typeof internal==='function'?Number(internal(c.id)||0):0);
    const actual=typeof spent==='function'?Number(spent(c.id)||0):0;
    if(allowance>0&&actual>=allowance*.8)alerts.push({title:String(c.name||'بند ميزانية'),detail:actual>=allowance?'تجاوز المخصص':'اقترب من الحد المعتمد',page:'hilal'});
   }
   const todayMidday=new Date(rkDate()+'T12:00:00');
   const dueSoon=(date)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return false;const days=(new Date(date+'T12:00:00')-todayMidday)/86400000;return Number.isFinite(days)&&days<=7};
   if(Array.isArray(db.scheduledOps))for(const x of db.scheduledOps){
    if(x.status==='planned'&&dueSoon(x.start))alerts.push({title:'عملية مجدولة: '+String(x.name||'عملية'),detail:'بانتظار التحقق من التنفيذ، دون خصم تلقائي',page:'scheduled'});
   }
   if(Array.isArray(db.receivables))for(const x of db.receivables){
    const outstanding=Number(x.principal||0)-(typeof rkReceivableCollected==='function'?rkReceivableCollected(x.id):0);
    if(outstanding>0&&dueSoon(x.due))alerts.push({title:'مستحق للتحصيل: '+String(x.name||'مستحق'),detail:rkAmount(outstanding)+' متبقٍ للتحصيل',page:'receivables'});
   }
  }catch(e){console.warn('تعذر تحديث بعض التنبيهات',e)}
  panel.innerHTML='<h2>الإشعارات والتنبيهات</h2>'+(alerts.length?alerts.map(a=>'<div class="notification-entry"><strong>'+esc(a.title)+'</strong><small>'+esc(a.detail)+'</small><button class="btn" type="button" onclick="navigate(\''+a.page+'\');document.getElementById(\'rakaezNotifications\').hidden=true">عرض</button></div>').join(''):'<div class="notification-entry">لا توجد تنبيهات مالية جديدة حالياً.</div>');
 }
 panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));
}

async function rkSave(){

  const old=db.receivables.find(a=>a.id===x.id),collected=old?rkReceivableCollected(x.id):0;
  x.principal=rkToCents(val);
  if(x.principal<collected)return alert('لا يمكن خفض أصل المستحق دون المبالغ التي تم تحصيلها.');
  db.receivables=old?db.receivables.map(a=>a.id===x.id?x:a):[...db.receivables,x];
 }else if(rkKind==='collection'){
  const rec=db.receivables.find(a=>a.id===x.receivableId);
  const amount=rkToCents(x.amount);
  if(!rec||amount<=0||!x.account?.trim()||!x.date)return alert('حدد المبلغ الفعلي وتاريخه وحساب الاستلام.');
  if(amount>rec.principal-rkReceivableCollected(rec.id))return alert('لا يجوز تجاوز الرصيد المتبقي للمستحق.');
  x.id=rid();x.amount=amount;db.receivableCollections.push(x);
 }else if(rkKind==='scheduled'){
  if(!x.name?.trim()||!x.start)return alert('أكمل اسم العملية وتاريخ الاستحقاق.');
  if(x.method==='percentage'&&(!Number.isFinite(Number(x.rate))||Number(x.rate)<0||Number(x.rate)>100))return alert('النسبة يجب أن تكون بين 0% و100%.');

  x.rate=Number(x.rate)||0;x.amount=rkToCents(x.amount);
  const old=db.scheduledOps.some(a=>a.id===x.id);db.scheduledOps=old?db.scheduledOps.map(a=>a.id===x.id?x:a):[...db.scheduledOps,x];
 }else if(rkKind==='document'){

  x.amount=rkToCents(x.amount);db.docs=old?db.docs.map(a=>a.id===x.id?x:a):[...db.docs,x];

function rkStoreFile(id,file){
 return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));
  const request=indexedDB.open('rakaez-local-attachments',1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files')};
  request.onerror=()=>reject(request.error);
  request.onsuccess=()=>{const conn=request.result,tx=conn.transaction('files','readwrite');tx.objectStore('files').put(file,(v11ExamplesMode?'demo:':'real:')+id);tx.oncomplete=()=>{conn.close();resolve()};tx.onerror=()=>{conn.close();reject(tx.error)}};
 });
}
function rkDocumentDownload(id){

 request.onsuccess=()=>{
  const conn=request.result,tx=conn.transaction('files','readonly'),get=tx.objectStore('files').get((v11ExamplesMode?'demo:':'real:')+id);
  get.onsuccess=()=>{const blob=get.result;if(!blob)return alert('المرفق غير متوفر على هذا الجهاز.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=db.docs.find(x=>x.id===id).fileName||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
  get.onerror=()=>alert('تعذر قراءة الملف.');tx.oncomplete=()=>conn.close();
 };
}


/* Complete missing icon coverage without discarding action labels. */
function rkIconForAction(label){
 if(/حذف|مسح|إزالة/.test(label))return 'delete';
 if(/السابق|رجوع|عودة/.test(label))return 'back';
 if(/التالي/.test(label))return 'forward';
 if(/إغلاق|إلغاء|✕|×/.test(label))return 'close';
 if(/تحديث|تجديد/.test(label))return 'refresh';
 if(/توزيع|أرباح|تقرير|تحليل/.test(label))return 'chart';
 if(/تعديل|إعداد|خصائص/.test(label))return 'edit';
 if(/حفظ|اعتماد|تأكيد/.test(label))return 'check';
 if(/عرض|فتح|تفاصيل|فحص/.test(label))return 'view';
 if(/بحث/.test(label))return 'search';
 if(/تصدير|تنزيل/.test(label))return 'download';
 if(/رفع|استيراد/.test(label))return 'upload';
 if(/إضافة|إنشاء|تسجيل|جديد/.test(label))return 'plus';
 if(/قسط|تمويل|سداد|تحويل|إيداع|سحب|تحصيل/.test(label))return 'wallet';
 return 'settings';
}
function rkEnsureAllButtonIcons(root=document){
 root.querySelectorAll('button').forEach(button=>{
  if(button.querySelector('svg')||button.closest('.rakaez-nav-flat')||button.matches('.rakaez-bell,[data-step]'))return;
  const label=(button.textContent||button.getAttribute('aria-label')||'').trim();
  if(!label)return;

  if(label==='✕'||label==='×')button.textContent='';

 });
