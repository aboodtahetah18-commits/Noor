const tabs=[['salary','الراتب','wallet'],['budgets','الميزانيات','chart'],['data','البيانات','settings']];
const tabsHtml='<div class="settings-tabs">'+tabs.map(t=>`<button class="btn ${settingsTab===t[0]?'active':''}" onclick="setSettingsTab('${t[0]}')">${ico(t[2])} ${t[1]}</button>`).join('')+'</div>';
let body='';
if(settingsTab==='salary')body=`<section class="card settings-panel"><div class="formgrid"><div class="field"><label>الراتب الشهري (ر.س)</label><input id="salary" type="number" min="0" step="0.01" value="${db.salary/100}"></div><div class="field"><label>نسبة مركز الهلال (%)</label><input id="ratioH" type="number" min="0" max="100" value="${db.ratios.hilal}"></div><div class="field"><label>نسبة مركز ملاءة (%)</label><input id="ratioM" type="number" min="0" max="100" value="${db.ratios.malaa}"></div><div class="field"><label>نسبة مركز الأصول (%)</label><input id="ratioA" type="number" min="0" max="100" value="${db.ratios.assets}"></div></div><div class="actions"><button class="btn primary" onclick="saveSettings()">${ico('shield')} حفظ</button><button class="btn dark" onclick="postSalary()" ${db.salaryMonths.includes(month)?'disabled':''}>${ico('wallet')} ${db.salaryMonths.includes(month)?'مُرحّل':'ترحيل'}</button></div></section>`;
if(settingsTab==='budgets')body=`<section class="card settings-panel"><div class="formgrid">${db.categories.map(c=>`<div class="field"><label>${esc(c.name)} (ر.س)</label><input type="number" id="c_${c.id}" step="0.01" value="${c.limit}"></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="saveCats()">${ico('shield')} حفظ</button></div></section>`;

}
function saveSettings(){let h=Number(document.getElementById('ratioH').value),m=Number(document.getElementById('ratioM').value),a=Number(document.getElementById('ratioA').value),sal=amount('salary');if([h,m,a].some(x=>!Number.isFinite(x)||x<0||x>100)||Math.abs(h+m+a-100)>.000001||sal<=0)return alert('راجع الراتب؛ يجب أن تكون النسب موجبة ومجموعها 100%.');db.ratios={hilal:h,malaa:m,assets:a};db.salary=sal;audit('تحديث الإعدادات','توزيع الراتب');save();render();toast('تم حفظ الإعدادات')}function saveCats(){for(let c of db.categories){let v=Number(document.getElementById('c_'+c.id).value);if(!Number.isFinite(v)||v<0)return alert('أدخل قيماً صحيحة');c.limit=v}audit('تعديل الميزانيات','حدود البنود');save();render();toast('حُفظت حدود البنود')}function postSalary(){if(db.salaryMonths.includes(month))return;if(!confirm('هل تم استلام الراتب فعلياً بقيمة '+money(db.salary)+' عن الفترة '+month+'؟ سيُسجل الدخل بعد التأكيد، ولن ينفذ النظام أي تحويل بنكي أو يزيد رصيد ملاءة تلقائياً.'))return;db.salaryMonths.push(month);audit('تأكيد استلام راتب',month+': '+money(db.salary));save();render();toast('تم إثبات استلام الراتب في سجل الدورة، دون إنشاء تحويلات أو زيادة أرصدة المراكز تلقائياً.')}function resetData(){if(confirm('سيتم حذف جميع البيانات المحلية نهائياً. هل أنت متأكد؟')){db=seed();save();render()}}function download(name,text,type){let b=new Blob(['\ufeff',text],{type}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJson(){download('rakaez-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCsv(){let rows=[['date','description','type','category','amount_SAR'],...db.transactions.map(t=>[t.date,t.description,t.type,t.category,t.amount/100])];download('rakaez-transactions.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}function navigate(p){page=p;document.querySelector('#layout').classList.remove('showmenu');render()}const NAV_GROUPS=[['main','الرئيسية',['insights']],['banks','البنوك',['hilal','malaa','assets']],['operations','العمليات',['transactions','ledger','funding','interbank','import']],['management','الإدارة',['goals','debts','fees','reserves','position']],['follow','المتابعة',['research','reports']],['system','النظام',['settings']]];

function render(){drawNav();let n=N.find(n=>n[0]===page)||N[0];document.getElementById('pageTitle').textContent=n[1];document.getElementById('pageSub').textContent=page==='overview'?'لوحة تحكم مالية شاملة — الهلال، ملاءة، والأصول':'إدارة حساباتك وبياناتك المالية الشخصية';let months=[];for(let i=-12;i<=3;i++){let d=new Date(today.getFullYear(),today.getMonth()+i,2);months.push(iso(d).slice(0,7))}document.getElementById('monthPicker').innerHTML=months.reverse().map(m=>`<option value="${m}" ${m===month?'selected':''}>${m}</option>`).join('');document.getElementById('view').innerHTML=({overview:dashboard,hilal,malaa,assets,goals:goalsView,debts:debtsView,fees:feesView,reserves:reservesView,position:positionView,interbank:interbankView,insights:dashboard,receivables:rkReceivablesView,scheduled:rkScheduledView,documents:rkDocumentsView,transactions,ledger:ledgerView,funding:fundings,import:importView,reports,settings}[page]||dashboard)()}
function field(id,label,type='text',value='',opts=''){return `<div class="field"><label for="${id}">${label}</label>${type==='select'?`<select id="${id}">${opts}</select>`:type==='textarea'?`<textarea id="${id}" rows="5" placeholder="${esc(value)}"></textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01" min="0"':''} required>`}</div>`}function catOptions(){return db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function options(a){return a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function openModal(type,id=''){let title='',body='',act='حفظ';const sums=db.savings;switch(type){case 'transaction':title='تسجيل معاملة مالية';body=field('fDate','تاريخ العملية','date',iso(today))+field('fDesc','الوصف / الجهة','text','')+field('fType','نوع العملية','select','',options([['expense','مصروف'],['income','دخل آخر']]))+field('fCat','البند التشغيلي','select','',catOptions())+field('fAmount','المبلغ (ر.س)','number','');break;case 'funding':title='تمويل طارئ لبند';body=field('fCat','البند المستفيد','select','',catOptions())+field('fAmount','أصل التمويل (ر.س)','number')+field('fRate','معدل الربح السنوي البسيط (%)','number','0')+field('fMonths','المدة بالأشهر','number','6')+`<div class="field full"><div class="notice">تمويل إداري داخلي يزيد سقف البند ولا يزيد رصيدك النقدي أو صافي ثروتك. يَظهر في قائمة الالتزامات الداخلية.</div></div>`;break;case 'deposit':title='نقل مبلغ إلى شريحة ادخارية';body=field('fBucket','الوجهة','select','',options(sums.map(s=>[s.id,s.name])))+field('fAmount','المبلغ (ر.س)','number')+`<div class="field full"><div class="notice">النقل هنا من السيولة الفورية إلى شريحة أخرى، ولا يمثل إيداعاً بنكياً جديداً.</div></div>`;break;case 'withdraw':title='طلب سحب من الادخار';body=field('fBucket','الشريحة','select','',options(sums.map(s=>[s.id,s.name])))+field('fAmount','المبلغ (ر.س)','number')+`<div class="field full"><div class="notice">يُحجز مبلغ السحب من الشريحة عند الطلب. تاريخ إتاحته تقديري بناءً على أيام العمل السعودية (الأحد إلى الخميس) دون العطل الرسمية.</div></div>`;break;case 'asset':title='إضافة أصل أو محفظة استثمارية';body=field('fName','اسم الأصل / المحفظة','text')+field('fKind','نوع الأصل','select','',options([['محفظة استثمارية','محفظة استثمارية'],['سهم','سهم'],['صندوق','صندوق'],['صك','صك'],['حصة شركة','حصة شركة'],['أصل آخر','أصل آخر']]))+field('fRisk','درجة المخاطرة','select','',options([['متوسطة','متوسطة'],['منخفضة','منخفضة'],['عالية','عالية']]))+`<div class="field full" id="portfolioFields">${field('fMonthly','الاشتراك الشهري (ر.س)','number','1000')}${field('fMonths','مدة الخطة (بالأشهر)','number','12')}${field('fContributed','الأموال المدفوعة فعلياً حتى اليوم (ر.س)','number','0')}${field('fMarketValue','القيمة السوقية الفعلية حسب آخر كشف (ر.س)','number','0')}${field('fReturn','العائد السنوي المتوقع (%)','number','0')}${field('fLoss','أقصى خسارة تاريخية (%)','number','0')}${field('fRedeem','مدة استرداد المبلغ (أيام عمل)','number','12')}<div class="portfolio-block"><h3>توزيع أصول المحفظة — المجموع 100%</h3><div class="formgrid">${['أسهم','صكوك','نقد','صناديق','بدائل'].map((x,i)=>field('al'+i,x+' (%)','number',[50,20,15,10,5][i])).join('')}</div></div><div class="calculations" id="calcPreview">يُحسب الإجمالي المتوقع من الاشتراك والمدة، والقيمة السوقية من آخر كشف تدخلها بنفسك.</div></div><div class="field full" id="stockFields" style="display:none">${field('fQty','الكمية / الوحدات','number','1')}${field('fCost','تكلفة الوحدة (ر.س)','number','0')}${field('fPrice','سعر السوق (ر.س)','number','0')}</div>`;break;case 'portfolioUpdate':title='تحديث محفظة استثمارية';let ph=db.holdings.find(h=>h.id===id);body=field('fContributed','إجمالي المبالغ المدفوعة فعلياً (ر.س)','number',((ph?.contributed||0)/100).toFixed(2))+field('fMarketValue','القيمة السوقية حسب آخر كشف (ر.س)','number',((ph?.marketValue||0)/100).toFixed(2))+field('fDate','تاريخ تحديث القيمة','date',iso(today))+`<div class="field full"><div class="notice">لا تعتمد القيمة السوقية على العائد المتوقع؛ أدخلها من تقرير مدير المحفظة.</div></div>`;break;case 'dividend':title='تسجيل توزيع مستلم';body=field('fHolding','الأصل المستفيد','select','',options(db.holdings.map(h=>[h.id,esc(h.name)])))+field('fDate','تاريخ الاستلام','date',iso(today))+field('fAmount','المبلغ الصافي المستلم (ر.س)','number')+field('fReinvest','الإجراء','select','',options([['no','احتفاظ بالنقد'],['yes','إعادة استثمار — سجل الشراء بشكل مستقل']]))+`<div class="field full"><div class="notice">تسجيل التوزيع لا يغيّر عدد الوحدات تلقائياً. سجّل عملية شراء منفصلة إذا أعيد استثمار المبلغ حتى لا يُحتسب مرتين.</div></div>`;break;case 'price':title='تحديث سعر الأصل';body=field('fPrice','سعر الوحدة الجديد (ر.س)','number',((db.holdings.find(h=>h.id===id)?.price||0)/100).toFixed(2));break;case 'repay':title='سداد جزء من أصل التمويل';body=field('fAmount','سداد من أصل التمويل (ر.س)','number');break}let html=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" type="button" onclick="closeModal()">✕</button></div><div class="modalbody"><form onsubmit="event.preventDefault();submitModal('${type}','${id}')"><div class="formgrid">${body}</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button type="submit" class="btn primary">${act}</button></div></form></div></div></div>`;document.getElementById('modalRoot').innerHTML=html;if(type==='asset'){document.getElementById('fKind').onchange=updateAssetForm;document.querySelectorAll('#portfolioFields input').forEach(x=>x.addEventListener('input',updateAssetCalc));updateAssetForm()}if(type==='dividend'&&id)document.getElementById('fHolding').value=id;if(id&&['deposit','withdraw'].includes(type))document.getElementById('fBucket').value=id}
function updateAssetForm(){let portfolio=val('fKind')==='محفظة استثمارية';document.getElementById('portfolioFields').style.display=portfolio?'grid':'none';document.getElementById('stockFields').style.display=portfolio?'none':'grid';updateAssetCalc()}function updateAssetCalc(){if(val('fKind')!=='محفظة استثمارية')return;let monthly=Number(val('fMonthly'))||0,months=Number(val('fMonths'))||0,contributed=Number(val('fContributed'))||0,market=Number(val('fMarketValue'))||0,annual=Number(val('fReturn'))||0;document.getElementById('calcPreview').innerHTML=`<div><span>إجمالي الاشتراكات المخططة</span><b>${money(Math.round(monthly*months*100))}</b></div><div><span>الأموال المدفوعة فعلياً</span><b>${money(Math.round(contributed*100))}</b></div><div><span>القيمة السوقية المدخلة</span><b>${money(Math.round(market*100))}</b></div><div><span>الربح/الخسارة الحالية</span><b>${money(Math.round((market-contributed)*100))}</b></div><div><span>عائد سنوي افتراضي على الأموال المدفوعة</span><b>${money(Math.round(contributed*annual/100))}</b></div><small>التقدير السنوي مبسط ولا يحسب توقيت كل اشتراك. يُمنع استنتاج قيمة سوقية حقيقية من معدل العائد المتوقع.</small>`}function val(id){return document.getElementById(id)?.value||''}function submitModal(type,id){let a=amount('fAmount'),success='تم حفظ العملية';if(['transaction','funding','deposit','withdraw','repay'].includes(type)&&a<=0)return alert('أدخل مبلغاً أكبر من صفر');switch(type){case 'transaction':if(!val('fDate')||!val('fDesc').trim())return alert('التاريخ والوصف مطلوبان');db.transactions.push({id:rid(),date:val('fDate'),description:val('fDesc').trim(),type:val('fType'),category:val('fCat'),amount:a});break;case 'funding':let r=Number(val('fRate')),mos=Number(val('fMonths'));if(!Number.isFinite(r)||r<0||r>100||!Number.isInteger(mos)||mos<1||mos>360)return alert('معدل الربح أو المدة غير صحيح');db.fundings.push({id:rid(),date:iso(today),category:val('fCat'),principal:a,paid:0,rate:r,months:mos});break;case 'deposit':let dest=db.savings.find(s=>s.id===val('fBucket'));if(!dest||dest.id==='instant')return alert('اختر شريحة 3 أو 12 يوماً');if(db.savings[0].balance<a)return alert('رصيد الشريحة الفورية غير كافٍ');db.savings[0].balance-=a;dest.balance+=a;break;case 'withdraw':let bucket=db.savings.find(s=>s.id===val('fBucket'));if(!bucket||bucket.balance<a)return alert('رصيد الشريحة لا يكفي');bucket.balance-=a;db.withdrawals.unshift({id:rid(),bucket:bucket.id,amount:a,date:iso(today),available:addBusinessDays(iso(today),bucket.days)});success='سُجل طلب السحب. تحقق من تاريخ الإتاحة المتوقع';break;case 'asset':{let portfolio=val('fKind')==='محفظة استثمارية';if(!val('fName').trim())return alert('أدخل اسم الأصل');if(portfolio){let monthly=amount('fMonthly'),months=Number(val('fMonths')),contributed=amount('fContributed'),marketValue=amount('fMarketValue'),expectedReturn=Number(val('fReturn')),maxDrawdown=Number(val('fLoss')),redemptionDays=Number(val('fRedeem')),alloc=Object.fromEntries(['أسهم','صكوك','نقد','صناديق','بدائل'].map((k,i)=>[k,Number(val('al'+i))]));if(monthly<0||!Number.isInteger(months)||months<1||months>600||contributed<0||marketValue<0||expectedReturn < -100||expectedReturn>1000||maxDrawdown<0||maxDrawdown>100||!Number.isInteger(redemptionDays)||redemptionDays<0||Object.values(alloc).some(v=>!Number.isFinite(v)||v<0||v>100)||Math.abs(Object.values(alloc).reduce((a,b)=>a+b,0)-100)>.001)return alert('راجع القيم وتأكد من أن توزيع الأصول يساوي 100%. سجل أقصى خسارة كنسبة موجبة.');db.holdings.push({id:rid(),name:val('fName').trim(),kind:val('fKind'),risk:val('fRisk'),monthly,months,contributed,marketValue,expectedReturn,maxDrawdown,redemptionDays,allocation:alloc,date:iso(today),updatedAt:iso(today)});}else{let q=Number(val('fQty')),c=amount('fCost'),p=amount('fPrice');if(!Number.isFinite(q)||q<=0||c<=0||p<0)return alert('أكمل الكمية والتكلفة والسعر');db.holdings.push({id:rid(),name:val('fName').trim(),kind:val('fKind'),risk:val('fRisk'),quantity:q,cost:c,price:p,date:iso(today)})}break;}case 'portfolioUpdate':{let h=db.holdings.find(x=>x.id===id);if(!h)return alert('المحفظة غير موجودة');let contributed=amount('fContributed'),marketValue=amount('fMarketValue');if(contributed<0||marketValue<0||!val('fDate'))return alert('القيمة غير صحيحة');h.contributed=contributed;h.marketValue=marketValue;h.updatedAt=val('fDate');break;}case 'dividend':{let amountPaid=amount('fAmount');if(amountPaid<=0||!val('fHolding')||!val('fDate'))return alert('أدخل أصل التوزيع والمبلغ والتاريخ');db.dividends.push({id:rid(),holding:val('fHolding'),date:val('fDate'),amount:amountPaid,reinvested:val('fReinvest')==='yes'});break;}case 'price':let h=db.holdings.find(h=>h.id===id),v=amount('fPrice');if(!h||v<=0)return alert('سعر غير صحيح');h.price=v;break;case 'repay':let f=db.fundings.find(f=>f.id===id);if(!f||a>f.principal-f.paid)return alert('يتجاوز المبلغ أصل التمويل المتبقي');f.paid+=a;break}audit('إجراء: '+type,id||'جديد');save();closeModal();render();toast(success)}
function parseSMS(text){let m=text.match(/(?:SAR|ر\.س|ريال(?:اً)?|مبلغ|بقيمة|amount)\s*[:：]?\s*([0-9٠-٩۰-۹,.،]+)/i)||text.match(/([0-9٠-٩۰-۹][0-9٠-٩۰-۹,.،]*)\s*(?:SAR|ر\.س|ريال)/i);let normalize=s=>s.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/،/g,'');let num=m?Number(normalize(m[1]).replace(/,/g,'')):NaN;let date=text.match(/20\d{2}[-/]\d{1,2}[-/]\d{1,2}/)?.[0]?.replace(/\//g,'-')||iso(today);let inflow=/إيداع|حوالة واردة|راتب|استلام|إضافة رصيد|credited/i.test(text);return {date,description:text.trim().slice(0,130),type:inflow?'income':'expense',category:'other',amount:Number.isFinite(num)?Math.round(num*100):0}}
function csvSplit(line){let out=[],s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){out.push(s);s=''}else s+=c}out.push(s);return out}function normalizeCSV(text){let lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()),head=csvSplit(lines.shift()||'').map(s=>s.trim().toLowerCase());function col(names){return head.findIndex(h=>names.includes(h))}let di=col(['date','التاريخ','تاريخ العملية']),de=col(['description','الوصف','البيان','details','merchant']),am=col(['amount_sar','amount','المبلغ','قيمة العملية']),ty=col(['type','النوع']),ca=col(['category','البند']);if(di<0||am<0)throw Error('يجب أن يحتوي الملف على عمودي date و amount أو التاريخ والمبلغ');return lines.map(line=>{let cells=csvSplit(line),s=(cells[am]||'').replace(/[ر$\s]/g,'').replace(/,/g,''),num=Number(s);let type=ty>=0?cells[ty]:(num<0?'expense':'expense');return {id:rid(),date:(cells[di]||'').replace(/\//g,'-'),description:cells[de]||'عملية مستوردة',type:/income|دخل/i.test(type)?'income':'expense',category:ca>=0&&db.categories.find(c=>c.id===cells[ca])?cells[ca]:'other',amount:Math.round(Math.abs(num)*100)}}).filter(x=>/^\d{4}-\d{1,2}-\d{1,2}$/.test(x.date)&&Number.isFinite(x.amount)&&x.amount>0)}function duplicate(t){return db.transactions.some(x=>x.date===t.date&&x.amount===t.amount&&x.description===t.description&&x.type===t.type)}function importView(){return `${sTitle('استيراد معاملات من الكشوف والرسائل','الاستيراد يتطلب مراجعتك قبل الحفظ')}<div class="split"><section class="card"><div class="cardtitle">استيراد كشف CSV</div><p class="tiny muted">الحقول المدعومة: date, description, amount, type, category. يدعم العناوين الإنجليزية والعربية المحددة. ملف Excel: احفظه بصيغة CSV أولاً.</p><input type="file" accept=".csv,text/csv" id="csvFile" onchange="readCsv(this)" style="width:100%"><p class="notice">الاستيراد لا يتصل ببنكك ولا يرفع الملف إلى خادم. راجع كل عملية وتأكد من اتجاه المصروفات والدخل.</p></section><section class="card"><div class="cardtitle">تحليل رسالة بنكية نصية</div><textarea id="sms" style="width:100%;min-height:105px" placeholder="الصق نص رسالة مصرفية هنا بعد إزالة أي بيانات حساسة..."></textarea><div class="actions"><button class="btn primary" onclick="readSMS()">تحليل ومعاينة الرسالة</button></div><p class="tiny muted">لا يمكن للصفحة قراءة الرسائل من الهاتف تلقائياً. استخدم اللصق اليدوي.</p></section></div>${sTitle('معاينة قبل الاعتماد')}<section class="card" id="importPreview">${importRows.length?previewRows():'<div class="empty">اختر كشف CSV أو الصق رسالة ليظهر جدول المراجعة</div>'}</section>`}function readCsv(input){let file=input.files?.[0];if(!file)return;if(file.size>3000000)return alert('الملف كبير جداً. الحد 3 ميجابايت');let fr=new FileReader();fr.onload=()=>{try{importRows=normalizeCSV(fr.result);render();toast('يرجى مراجعة السجلات قبل الاعتماد')}catch(e){alert(e.message)}};fr.readAsText(file,'utf-8')}function readSMS(){let s=document.getElementById('sms').value.trim();if(!s)return alert('أدخل نص الرسالة');let t=parseSMS(s);if(!t.amount)return alert('تعذر التعرف على المبلغ. أدخل العملية يدوياً بدلاً من ذلك.');importRows=[t];render()}function previewRows(){let valid=importRows.filter(t=>!duplicate(t));return `<p class="tiny muted">${importRows.length} صف، منها ${importRows.length-valid.length} مكرر. راجع التاريخ والاتجاه والبند قبل الاعتماد.</p><div class="tablewrap"><table><tr><th>التاريخ</th><th>الوصف</th><th>الاتجاه</th><th>المبلغ</th><th>الحالة</th></tr>${importRows.slice(0,100).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description)}</td><td>${t.type==='expense'?'مصروف':'دخل'}</td><td>${money(t.amount)}</td><td><span class="tag ${duplicate(t)?'neg':''}">${duplicate(t)?'مكرر':'جاهز'}</span></td></tr>`).join('')}</table></div>${importRows.length>100?'<p class="tiny muted">تُعرض أول 100 عملية فقط</p>':''}<div class="actions"><button class="btn" onclick="importRows=[];render()">إلغاء</button><button class="btn primary" onclick="approveImport()">اعتماد ${valid.length} عملية</button></div>`}function approveImport(){let rows=importRows.filter(t=>!duplicate(t));db.transactions.push(...rows);audit('استيراد معاملات',String(rows.length));save();importRows=[];navigate('transactions');toast('اعتُمِدت '+rows.length+' عملية')}

function goalsView(){let target=db.goals.reduce((a,g)=>a+g.target,0),saved=db.goals.reduce((a,g)=>a+g.saved,0);return `<div class="grid stats">${stat('إجمالي قيمة الأهداف',target,'أهداف مستقبلية مُدخلة','var(--blue)','trend')}${stat('مبالغ مسندة للأهداف',saved,'أرقام متابعة ولا تُضاف للأرصدة النقدية','var(--teal)','wallet')}${stat('فجوة التمويل',Math.max(0,target-saved),'القيمة المتبقية','var(--gold)','fund')}</div>${sectionHeaderV3('أهداف مركز الأصول','هدفك المالي وتاريخ الوصول إليه وخطة الادخار أو الاستثمار','goals')}<div class="grid banks">${db.goals.map(g=>{let completion=g.target?Math.min(100,Math.max(0,g.saved/g.target*100)):0;return `<section class="card"><div class="row between"><h3>${esc(g.name)}</h3><span class="tag">${Math.round(completion)}%</span></div><div class="metricline"><span>القيمة المستهدفة</span><b>${money(g.target)}</b></div><div class="metricline"><span>المخصص حالياً</span><b>${money(g.saved)}</b></div><div class="metricline"><span>الموعد المستهدف</span><b>${fmtDate(g.date)}</b></div><div class="metricline"><span>المساهمة الشهرية المخططة</span><b>${money(g.monthly)}</b></div><div class="track"><div class="fill" style="width:${completion}%;background:var(--teal)"></div></div>${operations('goals',g.id)}</section>`}).join('')||'<section class="card empty">لا توجد أهداف مالية. أضف هدفاً للمستقبل.</section>'}</div><p class="notice">تخصيص مبلغ لهدف لا ينشئ رصيداً نقدياً مستقلاً ولا ينفذ استثماراً؛ يتم الربط بالحسابات والتحويلات الفعلية في النسخة الإنتاجية.</p>`}
function debtsView(){let outstanding=db.debts.reduce((s,d)=>s+Math.max(0,d.principal-d.paid),0);return `<div class="grid stats">${stat('أصل الالتزامات المتبقي',outstanding,'ديون خارجية مسجلة فقط','var(--red)','fund')}${stat('الأقساط الشهرية المجدولة',db.debts.reduce((s,d)=>s+d.installment,0),'دون احتساب أقساط التمويل الداخلي','var(--gold)','wallet')}${stat('إجمالي الأقساط السنوية المتوقعة',db.debts.reduce((s,d)=>s+d.installment*12,0),'تقدير إذا استمرت الأقساط 12 شهراً','var(--blue)','bank')}</div>${sectionHeaderV3('ديون والتزامات مركز الهلال','الالتزامات الخارجية منفصلة عن التمويل الإداري الداخلي','debts')}<section class="card"><div class="tablewrap"><table><thead><tr><th>الجهة / الالتزام</th><th>الأصل</th><th>المسدد</th><th>المتبقي</th><th>القسط</th><th>الاستحقاق</th><th>الإجراءات</th></tr></thead><tbody>${db.debts.map(d=>`<tr><td>${esc(d.name)}</td><td>${money(d.principal)}</td><td>${money(d.paid)}</td><td>${money(Math.max(0,d.principal-d.paid))}</td><td>${money(d.installment)}</td><td>${fmtDate(d.date)}</td><td>${operations('debts',d.id)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لم تُسجَّل ديون بعد</td></tr>'}</tbody></table></div></section>`}
function feesView(){let annual=db.fees.reduce((s,f)=>s+Math.round(f.amount*countPeriods(f)),0);return `<div class="grid stats">${stat('الرسوم السنوية المقدرة',annual,'للدوري فقط، لا يشمل مرة واحدة','var(--red)','wallet')}${stat('المكافئ الشهري للرسوم',Math.round(annual/12),'تقدير للموازنة وليس مصروفاً مسدداً','var(--gold)','chart')}</div>${sectionHeaderV3('جدول الرسوم والاشتراكات','رسوم المحافظ والحسابات والأصول حسب دوريتها','fees')}<section class="card"><div class="tablewrap"><table><thead><tr><th>اسم الرسم</th><th>البنك</th><th>الجهة / الحساب</th><th>القيمة</th><th>التكرار</th><th>تاريخ الاستحقاق التالي</th><th>الإجراءات</th></tr></thead><tbody>${db.fees.map(f=>`<tr><td>${esc(f.name)}</td><td>${bankName(f.bank)}</td><td>${esc(f.account||'—')}</td><td>${money(f.amount)}</td><td>${periodLabel(f.period)}</td><td>${fmtDate(f.date)}</td><td>${operations('fees',f.id)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد رسوم مسجلة</td></tr>'}</tbody></table></div><p class="notice">الرسوم هنا توقعات وتذكيرات، ولا تُخصم من الحساب تلقائياً. عند الدفع تُسجَّل معاملة مصروف فعلية لمنع ازدواجية الحساب.</p></section>`}
function reservesView(){let total=Object.values(db.reserves).reduce((a,b)=>a+Number(b||0),0);return `<div class="grid stats">${stat('إجمالي الاحتياطي المستهدف',total,'مجموع الحدود المختارة','var(--blue)','shield')}${stat('الراتب الشهري',db.salary,'مرجع حجم الأهداف','var(--teal)','wallet')}</div>${sTitle('المركز المالي الاحتياطي لكل بنك','حد مستهدف صغير وقابل للضبط، لا يُقتطع تلقائياً من الراتب')}<div class="grid banks">${[['hilal','مركز الهلال', 'مصروفات والتزامات التشغيل'],['malaa','مركز ملاءة','السيولة والطوارئ'],['assets','مركز الأصول','هامش فرص الاستثمار']].map(b=>`<section class="card"><h3>${b[1]}</h3><p class="muted tiny">${b[2]}</p><h2>${money(db.reserves[b[0]]||0)}</h2><p class="tiny muted">المستهدف، وليس الرصيد الفعلي</p><button class="btn primary" onclick="formV3('reserves','${b[0]}')">تعديل المستهدف</button></section>`).join('')}</div><div class="notice">يجب التمييز بين مبلغ الاحتياطي المستهدف والرصيد الممول فعلاً. لا توجد هنا قيود مالية أو اقتطاعات أو تحويلات تلقائية؛ يتم حساب المركز الفعلي بعد الربط المحاسبي.</div>`}
function v3Field(id,label,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}

function formV3(type,id=''){let existing=type==='reserves'?null:(db[type]||[]).find(x=>x.id===id),o=existing||{},label='',content='';if(type==='goals'){label='هدف مالي — مركز الأصول';content=v3Field('vName','اسم الهدف',o.name)+v3Field('vTarget','قيمة الهدف (ر.س)',(o.target||0)/100,'number','min="0" step="0.01"')+v3Field('vSaved','المبلغ المخصص للهدف (ر.س)',(o.saved||0)/100,'number','min="0" step="0.01"')+v3Field('vMonthly','المساهمة الشهرية المخططة (ر.س)',(o.monthly||0)/100,'number','min="0" step="0.01"')+v3Field('vDate','التاريخ المستهدف',o.date||'','date')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='debts'){label='دين أو التزام — مركز الهلال';content=v3Field('vName','الجهة / الالتزام',o.name)+v3Field('vPrincipal','أصل الالتزام (ر.س)',(o.principal||0)/100,'number','min="0" step="0.01"')+v3Field('vPaid','المبلغ المسدد (ر.س)',(o.paid||0)/100,'number','min="0" step="0.01"')+v3Field('vInstallment','القسط الشهري (ر.س)',(o.installment||0)/100,'number','min="0" step="0.01"')+v3Field('vDate','الاستحقاق القادم',o.date||'','date')+v3Field('vRate','معدل الفائدة / الربح السنوي (%)',o.rate||0,'number','min="0" step="0.01"')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='fees'){label='رسم أو اشتراك دوري';content=v3Field('vName','اسم الرسم',o.name)+v3Select('vBank','البنك',o.bank||'assets',[['hilal','الهلال'],['malaa','ملاءة'],['assets','الأصول']])+v3Field('vAccount','المحفظة / الحساب المرتبط',o.account||'')+v3Field('vAmount','قيمة الرسم (ر.س)',(o.amount||0)/100,'number','min="0" step="0.01"')+v3Select('vPeriod','الدورية',o.period||'monthly',[['monthly','شهري'],['quarterly','ربع سنوي'],['semiannual','نصف سنوي'],['annual','سنوي'],['once','مرة واحدة']])+v3Field('vDate','تاريخ الاستحقاق القادم',o.date||'','date')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='reserves'){label='احتياطي '+bankName(id);content=`<p class="notice">حدد مبلغاً صغيراً ومناسباً لقدرتك، ويمكن تعديله لاحقاً. هذا مجرد هدف ولا يغيّر رصيد البنك.</p>`+v3Field('vAmount','الاحتياطي المستهدف (ر.س)',(db.reserves[id]||0)/100,'number','min="0" step="0.01"')}
else return;
document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="v3header"><h2>${id&&type!=='reserves'?'تعديل':'إضافة / إدارة'} ${label}</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="event.preventDefault();saveV3('${type}','${id}')"><div class="formgrid v3form">${content}</div><div class="v3footer"><button type="submit" class="btn primary">حفظ</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form></div></div>`}
function getVal(id){return document.getElementById(id)?.value.trim()||''}
function cents(id){let n=Number(getVal(id));return Number.isFinite(n)&&n>=0?Math.round(n*100):NaN}
function saveV3(type,id){let o={id:id||rid(),name:getVal('vName'),notes:getVal('vNotes'),date:getVal('vDate')};if(type==='reserves'){let n=cents('vAmount');if(!Number.isFinite(n))return alert('المبلغ غير صالح');db.reserves[id]=n;audit('تعديل مركز مالي',bankName(id));}
else{if(!o.name)return alert('اسم البند مطلوب');if(type==='goals'){Object.assign(o,{target:cents('vTarget'),saved:cents('vSaved'),monthly:cents('vMonthly')});if(o.saved>o.target)return alert('المبلغ المخصص لا يتجاوز قيمة الهدف')}

 const debt=db.debts.reduce((a,d)=>a+Math.max(0,(Number(d.principal)||0)-(Number(d.paid)||0)),0);

 const annualFees=db.fees.reduce((a,f)=>a+(f.period==='once'?0:Math.round((Number(f.amount)||0)*countPeriods(f))),0);
 const operatingBudget=income()*db.ratios.hilal/100;

function ledgerSaveOpening(){let bank=getVal('oBank'),v=cents('oAmount');if(!Number.isSafeInteger(v)||v<=0)return alert('أدخل مبلغاً صحيحاً');try{ledgerAdd(getVal('oDate'),'رصيد افتتاحي مثبت '+ledgerAccounts.find(a=>a[0]===bank)[1],[{account:bank,debit:v,credit:0},{account:'outside',debit:0,credit:v}],'opening');closeModal();render();toast('تم إثبات رصيد افتتاحي')}catch(e){alert(e.message)}}
function ledgerReverse(id){let e=db.ledgerEntries.find(x=>x.id===id);if(!e||db.ledgerEntries.some(x=>x.reversalOf===id))return alert('القيد معكوس بالفعل');if(!confirm('سيُنشأ قيد عكسي مستقل دون حذف الأصل. متابعة؟'))return;let rev={id:rid(),date:iso(new Date()),description:'عكس: '+e.description,kind:'reversal',reversalOf:e.id,lines:e.lines.map(l=>({account:l.account,debit:l.credit,credit:l.debit})),createdAt:new Date().toISOString()};db.ledgerEntries.push(rev);audit('عكس قيد',id);save();render()}
function ledgerView(){let entries=db.ledgerEntries.slice().sort((a,b)=>b.date.localeCompare(a.date)),total=ledgerCash.reduce((s,k)=>s+ledgerBalance(k),0);return `${sTitle('دفتر الأستاذ والمطابقة','قيود مزدوجة محفوظة محلياً — مسار جديد مستقل عن سجلات V1–V4')}<div class="notice">هذا دفتر اختباري: لا تُرحّل معاملات الإصدارات القديمة تلقائياً، ولا تدخل في هذه الأرصدة الاستثمارات أو المحافظ أو الديون أو الرسوم قبل إثبات قيودها هنا. لا يمثل مجموع النقد صافي الثروة.</div><div class="grid stats">${ledgerCash.map(k=>stat(ledgerAccounts.find(a=>a[0]===k)[1],ledgerBalance(k),'رصيد نقدي وفق قيود V5','var(--blue)','bank')).join('')}${stat('إجمالي النقد المرحّل',total,'مجموع أرصدة البنوك الثلاثة','var(--teal)','wallet')}</div><section class="card"><div class="actions"><button class="btn primary" onclick="ledgerForm()">＋ حركة مالية</button><button class="btn" onclick="ledgerOpen()">إثبات رصيد افتتاحي</button><button class="btn" onclick="ledgerReconcile()">مطابقة كشف حساب</button><button class="btn" onclick="ledgerCsv()">تصدير القيود CSV</button></div></section>${sTitle('قيود اليومية','الحذف ممنوع لضمان أثر المراجعة؛ يمكن إنشاء قيد عكسي')}<section class="card"><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>التوازن</th><th>إجراء</th></tr></thead><tbody>${entries.length?entries.map(e=>{let d=e.lines.reduce((s,l)=>s+l.debit,0),c=e.lines.reduce((s,l)=>s+l.credit,0);return `<tr><td>${esc(e.date)}</td><td><b>${esc(e.description)}</b><br><small>${esc(e.lines.map(l=>ledgerAccounts.find(a=>a[0]===l.account)?.[1]||l.account).join(' / '))}</small></td><td>${money(d)}</td><td>${money(c)}</td><td><span class="tag ${d===c?'':'neg'}">${d===c?'متوازن':'غير متوازن'}</span></td><td><button class="btn warn" ${e.reversalOf||db.ledgerEntries.some(x=>x.reversalOf===e.id)?'disabled':''} onclick="ledgerReverse('${e.id}')">عكس القيد</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">لم يتم إدخال قيود بعد. ابدأ بإثبات أرصدة افتتاحية مؤكدة من كشوف الحسابات.</td></tr>'}</tbody></table></div></section>`}

// V6 unified smart insights: explainable local rules only, no implied live market access.
function insightData(){
 let b=v4Numbers(), notices=[],ratio=db.salary?100:0;
 const push=(bank,level,title,amount,link)=>notices.push({bank,level,title,amount,link});
 const monthlyFee=Math.round(b.annualFees/12);
 const installments=db.debts.reduce((t,d)=>t+Number(d.installment||0),0);
 let discretionary=db.salary-installments-monthlyFee;
 if(discretionary<db.salary*.65)push('الهلال','تحذير','ضغط الالتزامات',money(installments+monthlyFee),'debts');
 db.categories.forEach(c=>{let used=spent(c.id),lim=Math.round(Number(c.limit||0)*100);if(lim>0&&used>=lim*.8)push('الهلال',used>=lim?'تحذير':'متابعة',c.name,`${Math.round(used/lim*100)}%`,'hilal')});
 let target=Number(db.reserves?.malaa||0),available=db.savings.filter(x=>Number(x.days)===0).reduce((t,x)=>t+Number(x.balance||0),0);
 if(available<target)push('ملاءة','متابعة','الاحتياطي',money(target-available),'malaa');
 db.savings.forEach(x=>{if(Number(x.rate||0)<0)push('ملاءة','تحذير','عائد الحساب',esc(x.name),'malaa')});
 let portfolio=db.holdings.filter(h=>h.kind==='محفظة استثمارية');
 portfolio.filter(h=>!Number(h.marketValue)).forEach(h=>push('الأصول','بيانات','تحديث المحفظة',h.name||'محفظة','assets'));
 let invested=b.investments;
 if(invested>0){let weights=db.holdings.map(h=>({name:h.name||'أصل',value:h.kind==='محفظة استثمارية'?Number(h.marketValue||0):Number(h.quantity||0)*Number(h.price||0)}));weights.filter(h=>h.value/invested>.4).forEach(h=>push('الأصول','متابعة','تركيز مرتفع',`${h.name} · ${(100*h.value/invested).toFixed(1)}%`,'assets'))}
 if(!db.holdings.length)push('الأصول','بيانات','لا توجد أصول','أضف أصلاً','assets');
 if(!notices.length)push('ركائز','معلومة','لا توجد تنبيهات','حسب المدخلات','position');
 return {notices,monthlyFee,installments,discretionary,available,invested,b};
}
function intelligenceView(){let x=insightData();let banks=['الهلال','ملاءة','الأصول'];return `<div class="grid stats">${stat('التزامات شهرية',x.installments+x.monthlyFee,'','var(--red)','wallet')}${stat('سيولة فورية',x.available,'','var(--blue)','bank')}${stat('استثمارات مسجلة',x.invested,'','var(--gold)','trend')}${stat('إشعارات',x.notices.length,'','var(--teal)','bell')}</div><div class="sectiontitle"><h2>التوصيات</h2></div><div class="grid banks">${banks.map(bank=>`<section class="card"><div class="cardtitle">${bank}</div><div class="items">${x.notices.filter(n=>n.bank===bank).map(n=>`<div class="item"><div><span class="tag ${n.level==='تحذير'?'neg':'gold'}">${n.level}</span><strong style="display:block;margin:7px 0">${esc(n.title)}</strong><span class="money">${esc(n.amount)}</span></div><button class="btn" onclick="navigate('${n.link}')">${ico('trend')}<span>عرض</span></button></div>`).join('')||'<span class="tag">مستقر</span>'}</div></section>`).join('')}</div><div class="sectiontitle"><h2>المؤشرات</h2></div><section class="card"><div class="metricline"><span>الراتب</span><b>${money(db.salary)}</b></div><div class="metricline"><span>أقساط شهرية</span><b>${money(x.installments)}</b></div><div class="metricline"><span>رسوم شهرية تقديرية</span><b>${money(x.monthlyFee)}</b></div><div class="metricline"><span>المتبقي قبل المصروفات</span><b>${money(x.discretionary)}</b></div></section>`}
// Keep entry points concise and avoid wrapping of long multiword action labels.
function compactActions(root=document){root.querySelectorAll('button.btn').forEach(btn=>{
 if(btn.dataset.v6compact)return;
 let t=(btn.textContent||'').trim().replace(/\s+/g,' ');
 let labels=[[/إضافة|إنشاء|جديد|إثبات/,'إضافة','plus'],[/تعديل|تحرير/,'تعديل','settings'],[/حذف|إزالة/,'حذف','fund'],[/إلغاء|إغلاق/,'إلغاء','fund'],[/حفظ|اعتماد|تأكيد/,'حفظ','shield'],[/عرض|تفاصيل|مراجعة|فتح/,'عرض','chart'],[/تصدير|تنزيل|تحميل/,'تصدير','upload'],[/مطابقة/,'مطابقة','bank'],[/بحث/,'بحث','chart'],[/تحديث/,'تحديث','trend'],[/تمويل/,'تمويل','wallet'],[/سحب/,'سحب','wallet'],[/توزيع/,'توزيع','chart'],[/استيراد/,'استيراد','upload'],[/عكس/,'عكس','fund'],[/تسجيل/,'تسجيل','plus'],[/مسح|إعادة ضبط/,'مسح','fund']];
 let match=labels.find(([re])=>re.test(t));if(!match)return;
 btn.innerHTML=ico(match[2])+`<span>${match[1]}</span>`;
 btn.dataset.v6compact='1';btn.title=t;
 });}

/* V7: Investment research and structured dialogs */
if(!Array.isArray(db.watchlist))db.watchlist=[];
N.splice(N.findIndex(x=>x[0]==='assets')+1,0,['research','مركز الشركات','trend']);
const v7num=v=>Number.isFinite(Number(v))?Number(v):0;
function researchScores(r){let checks=[r.pe>0&&r.pe<=25,r.debt>=0&&r.debt<=60,r.growth>=8,r.roe>=12,r.fcf>0,r.dividend>=2];let known=[r.pe,r.debt,r.growth,r.roe,r.fcf,r.dividend].filter(x=>x!==''&&x!==null&&x!==undefined).length;return {score:Math.round(checks.filter(Boolean).length/6*100),complete:Math.round(known/6*100)}}
function researchView(){let search=(window.researchFilter||'').toLowerCase();let rows=db.watchlist.filter(x=>(x.name+' '+x.symbol+' '+x.market).toLowerCase().includes(search));return `<div class="grid stats">${stat('الشركات السعودية',db.watchlist.filter(x=>x.market==='SA').length,'','var(--teal)','bank')}${stat('الشركات الأمريكية',db.watchlist.filter(x=>x.market==='US').length,'','var(--blue)','trend')}${stat('الشركات المسجلة',db.watchlist.length,'','var(--gold)','chart')}</div><div class="sectiontitle"><h2>الشركات والمؤشرات</h2><button class="btn primary" onclick="researchForm()">${ico('plus')} إضافة</button></div><section class="card"><div class="v7-toolbar"><input id="v7Search" placeholder="بحث" value="${esc(window.researchFilter||'')}" oninput="window.researchFilter=this.value;const pos=this.selectionStart;document.getElementById('v7List').innerHTML=researchRows();"/><button class="btn" onclick="researchExport()">${ico('upload')} تصدير</button></div><div id="v7List">${researchRows()}</div></section>`}
function researchRows(){let q=(window.researchFilter||'').toLowerCase();let a=db.watchlist.filter(x=>(x.name+' '+x.symbol+' '+x.market).toLowerCase().includes(q));return `<div class="tablewrap"><table><thead><tr><th>الشركة</th><th>السوق</th><th>السعر</th><th>العائد</th><th>اكتمال البيانات</th><th>الإجراءات</th></tr></thead><tbody>${a.map(x=>{let z=researchScores(x);return `<tr><td><b>${esc(x.name)}</b><div class="v7-status">${esc(x.symbol)}</div></td><td>${x.market==='SA'?'السعودية':'أمريكا'}</td><td>${Number(x.price||0).toFixed(2)}</td><td>${Number(x.dividend||0).toFixed(2)}%</td><td>${z.complete}%</td><td><div class="row"><button class="btn" onclick="researchDetail('${x.id}')">${ico('chart')} عرض</button><button class="btn" onclick="researchForm('${x.id}')">${ico('settings')} تعديل</button><button class="btn warn" onclick="researchDelete('${x.id}')">${ico('fund')} حذف</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">لا توجد شركات</td></tr>'}</tbody></table></div>`}
function rfield(id,label,v='',type='text'){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(v)}"></div>`}
function researchForm(id=''){let x=db.watchlist.find(y=>y.id===id)||{};let group=(title,fields)=>`<fieldset class="v7-group"><legend>${title}</legend><div class="formgrid">${fields}</div></fieldset>`;let fields=group('التعريف',rfield('rName','اسم الشركة',x.name)+rfield('rSymbol','الرمز',x.symbol)+`<div class="field"><label>السوق</label><select id="rMarket"><option value="SA" ${x.market!=='US'?'selected':''}>السعودية</option><option value="US" ${x.market==='US'?'selected':''}>أمريكا</option></select></div>`+rfield('rSector','القطاع',x.sector))+group('بيانات السوق',rfield('rPrice','السعر الحالي',x.price??'','number')+rfield('rDate','تاريخ السعر',x.date||iso(today),'date')+rfield('rPe','مكرر الربحية P/E',x.pe??'','number')+rfield('rDividend','عائد التوزيعات %',x.dividend??'','number'))+group('المؤشرات المالية',rfield('rGrowth','نمو الأرباح %',x.growth??'','number')+rfield('rRoe','العائد على حقوق الملكية %',x.roe??'','number')+rfield('rDebt','نسبة الديون %',x.debt??'','number')+rfield('rFcf','التدفق النقدي الحر (مليون)',x.fcf??'','number'))+group('المصدر',rfield('rSource','مصدر البيانات',x.source||'')+rfield('rNotes','ملاحظات',x.notes||''));document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="v7-head"><h2>${id?'تعديل':'إضافة'} شركة</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="event.preventDefault();researchSave('${id}')"><div class="v7-modal-body">${fields}</div><div class="v3footer v7-sticky"><button class="btn primary" type="submit">${ico('shield')} حفظ</button><button class="btn" type="button" onclick="closeModal()">${ico('fund')} إلغاء</button></div></form></div></div>`}
function researchSave(id){let x={id:id||rid(),name:val('rName').trim(),symbol:val('rSymbol').trim().toUpperCase(),market:val('rMarket'),sector:val('rSector'),source:val('rSource'),notes:val('rNotes'),date:val('rDate')};if(!x.name||!x.symbol)return alert('الاسم والرمز مطلوبان');for(let [key,field] of [['price','rPrice'],['pe','rPe'],['dividend','rDividend'],['growth','rGrowth'],['roe','rRoe'],['debt','rDebt'],['fcf','rFcf']]){let t=val(field);if(t!==''&&!Number.isFinite(Number(t)))return alert('قيمة رقمية غير صحيحة');x[key]=t===''?'':Number(t)}if(id){let i=db.watchlist.findIndex(t=>t.id===id);if(i>=0)db.watchlist[i]=x}else db.watchlist.push(x);audit(id?'تعديل شركة':'إضافة شركة',x.name);save();closeModal();render();toast('تم الحفظ')}
function researchDetail(id){let x=db.watchlist.find(y=>y.id===id);if(!x)return;let z=researchScores(x);let line=(a,b)=>`<div class="metricline"><span>${a}</span><b>${esc(b??'—')}</b></div>`;document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="v7-head"><h2>${esc(x.name)}</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="v7-modal-body"><span class="v7-sect">البيانات</span>${line('الرمز',x.symbol)}${line('القطاع',x.sector)}${line('السعر',x.price)}${line('تاريخ السعر',x.date)}<span class="v7-sect">المؤشرات</span>${line('مكرر الربحية',x.pe)}${line('عائد التوزيع %',x.dividend)}${line('نمو الأرباح %',x.growth)}${line('العائد على حقوق الملكية %',x.roe)}${line('الديون %',x.debt)}${line('التدفق النقدي الحر',x.fcf)}${line('اكتمال المؤشرات',z.complete+'%')}${line('المصدر',x.source)}</div><div class="v3footer"><button class="btn primary" onclick="researchForm('${id}')">${ico('settings')} تعديل</button><button class="btn" onclick="closeModal()">${ico('fund')} إلغاء</button></div></div></div>`}
function researchDelete(id){let x=db.watchlist.find(y=>y.id===id);if(!x||!confirm('حذف '+x.name+'؟'))return;db.watchlist=db.watchlist.filter(y=>y.id!==id);save();render();toast('تم الحذف')}
function researchExport(){let cols=['name','symbol','market','sector','price','date','pe','dividend','growth','roe','debt','fcf','source','notes'];let csv='\ufeff'+[cols.join(','),...db.watchlist.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='rakaez-companies.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}

let index=0,total=steps.length+1;const paint=()=>{[...host.children].forEach((e,i)=>e.classList.toggle('active',i===index));header.querySelector('.wiz-name').textContent=index===steps.length?'المعاينة':steps[index].label;header.querySelector('.wiz-pill').textContent=(index+1)+' من '+total;footer.querySelector('[data-prev]').style.display=index?'inline-flex':'none';footer.querySelector('[data-next]').style.display=index===steps.length?'none':'inline-flex';footer.querySelector('[data-save]').style.display='inline-flex';if(index===steps.length){let rows=[...host.querySelectorAll('input,select,textarea')].filter(el=>!el.closest('.wiz-review')&&el.type!=='hidden');review.querySelector('.wiz-review').innerHTML=rows.map(el=>{let label=el.closest('.field')?.querySelector('label')?.textContent||el.id;let value=el.tagName==='SELECT'?el.selectedOptions[0]?.textContent:el.value;return `<div class="wiz-review-row"><span>${esc(label)}</span><b>${esc(value||'—')}</b></div>`}).join('')}};

function v10RepairDialogs(){

 document.body.classList.toggle('rakaez-modal-open',modals.length>0);
 for(const modal of modals){

  if(backdrop && !backdrop.dataset.v10fixed){backdrop.dataset.v10fixed='1';backdrop.addEventListener('click',event=>{if(event.target===backdrop)closeModal()});}
  // Include older inline forms in the same guided wizard behavior.
  if(!modal.dataset.v8wizard){try{v8Sections(modal)}catch(e){console.warn('Wizard initialization',e)}}
  const footers=modal.querySelectorAll('.v3footer,.actions,.wiz-actions');
  footers.forEach(f=>[...f.querySelectorAll('button')].forEach(b=>{
   const label=b.textContent.replace(/\s+/g,'').replace(/[✕×]/g,'');
   if(/^(إلغاء|إغلاق|الغاء)$/.test(label)||b.hasAttribute('data-cancel'))b.remove();
  }));
  // Add the single close action at the top of modals that do not have one.
  let head=modal.querySelector('.v3header,.v7-head,.modalhead');
  if(!head){head=document.createElement('div');head.className='v3header';const heading=modal.querySelector('h2');if(heading)head.append(heading);else head.innerHTML='<h2>التفاصيل</h2>';modal.prepend(head)}

 }
}

function toggleRakaezNotifications(){
 const panel=document.getElementById('rakaezNotifications'),button=document.getElementById('rakaezBell');
 if(!panel||!button)return;
 const opening=panel.hidden;
 if(opening){
  const alerts=[];
  try{
   if(Array.isArray(db.categories))for(const c of db.categories){
    const allowance=Number(c.limit||0)*100+(typeof internal==='function'?Number(internal(c.id)||0):0);
    const actual=typeof spent==='function'?Number(spent(c.id)||0):0;
    if(allowance>0&&actual>=allowance*.8)alerts.push({title:String(c.name||'بند ميزانية'),detail:actual>=allowance?'تجاوز المخصص':'اقترب من الحد المعتمد',page:'hilal'});
   }
   const todayMidday=new Date(rkDate()+'T12:00:00');
   const dueSoon=(date)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return false;const days=(new Date(date+'T12:00:00')-todayMidday)/86400000;return Number.isFinite(days)&&days<=7};
   if(Array.isArray(db.scheduledOps))for(const x of db.scheduledOps){
    if(x.status==='planned'&&dueSoon(x.start))alerts.push({title:'عملية مجدولة: '+String(x.name||'عملية'),detail:'بانتظار التحقق من التنفيذ، دون خصم تلقائي',page:'scheduled'});
   }
   if(Array.isArray(db.receivables))for(const x of db.receivables){
    const outstanding=Number(x.principal||0)-(typeof rkReceivableCollected==='function'?rkReceivableCollected(x.id):0);
    if(outstanding>0&&dueSoon(x.due))alerts.push({title:'مستحق للتحصيل: '+String(x.name||'مستحق'),detail:rkAmount(outstanding)+' متبقٍ للتحصيل',page:'receivables'});
   }
  }catch(e){console.warn('تعذر تحديث بعض التنبيهات',e)}
  panel.innerHTML='<h2>الإشعارات والتنبيهات</h2>'+(alerts.length?alerts.map(a=>'<div class="notification-entry"><strong>'+esc(a.title)+'</strong><small>'+esc(a.detail)+'</small><button class="btn" type="button" onclick="navigate(\''+a.page+'\');document.getElementById(\'rakaezNotifications\').hidden=true">عرض</button></div>').join(''):'<div class="notification-entry">لا توجد تنبيهات مالية جديدة حالياً.</div>');
 }
 panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));
}

function rakaezModalConsistency(){
 const root=document.getElementById('modalRoot');if(!root)return;
 root.querySelectorAll('.modal').forEach(modal=>{
  const title=(modal.querySelector('.v3header h2,.v7-head h2,.modalhead h2,h2')?.textContent||'').trim();
  const head=modal.querySelector('.wiz-head');if(!head)return;
  const labels=({'تسجيل معاملة مالية':['بيانات العملية','المبلغ والتصنيف','المعاينة'],'تمويل طارئ لبند':['مصدر التمويل','المبلغ والشروط','المعاينة'],'هدف مالي':['الهدف','قيمة التمويل','المعاينة'],'إضافة أصل أو محفظة':['نوع الأصل','التكلفة والكمية','المعاينة'],'دورة الراتب':['الفترة','توزيع البنود','المعاينة']});
  const key=Object.keys(labels).find(k=>title.includes(k));if(!key)return;
  const steps=[...modal.querySelectorAll('.wiz-step')];
  if(steps.length>1)steps.slice(0,-1).forEach((section,i)=>{section.dataset.rakaezStepName=labels[key][Math.min(i,labels[key].length-2)]});
  const active=steps.findIndex(section=>section.classList.contains('active'));
  const name=head.querySelector('.wiz-name');
  if(name&&active>=0&&active<steps.length-1){const desired=steps[active].dataset.rakaezStepName||name.textContent;if(name.textContent!==desired)name.textContent=desired;}
 });
}
function rakaezDataCheck(){
 const issues=[];
 if(!db||typeof db!=='object')return ['تعذر قراءة سجلات البيانات'];
 for(const name of ['transactions','categories','savings','holdings','dividends','fundings'])if(!Array.isArray(db[name]))issues.push('قائمة غير صالحة: '+name);
 if(db.ratios&&['hilal','malaa','assets'].every(k=>Number.isFinite(Number(db.ratios[k])))){
  const total=['hilal','malaa','assets'].reduce((sum,k)=>sum+Number(db.ratios[k]),0);
  if(Math.abs(total-100)>.001)issues.push('مجموع نسب المراكز هو '+total+'% وليس 100%');
 }
 for(const name of ['transactions','holdings','dividends','fundings','goals','debts','fees']){
  if(!Array.isArray(db[name]))continue;
  const ids=new Set();for(const entry of db[name]){
   if(!entry||typeof entry!=='object'){issues.push('سجل غير صالح: '+name);continue}
   if(entry.id){if(ids.has(entry.id))issues.push('معرّف مكرر في '+name);ids.add(entry.id)}
   if('amount' in entry&&(!Number.isFinite(Number(entry.amount))||Number(entry.amount)<0))issues.push('مبلغ غير صالح في '+name);
  }
 }
 if(Array.isArray(db.ledgerEntries))for(const entry of db.ledgerEntries){
  if(!Array.isArray(entry.lines))continue;
  const debit=entry.lines.reduce((n,l)=>n+Number(l.debit||0),0),credit=entry.lines.reduce((n,l)=>n+Number(l.credit||0),0);
  if(!Number.isFinite(debit)||!Number.isFinite(credit)||Math.abs(debit-credit)>.01)issues.push('قيد غير متوازن: '+String(entry.description||entry.id||'بدون وصف'));
 }
 return issues;
}

 document.getElementById('modalRoot').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal rk-modal" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="modalhead"><h2>'+title+'</h2><button type="button" class="btn" onclick="closeModal()" aria-label="إغلاق">✕</button></div><div class="rk-progress">'+progress+'</div><div class="rk-step-body formgrid">'+rkBody()+'</div><div class="rk-footer"><button type="button" class="btn" '+(rkStep===0?'disabled':'')+' onclick="rkGo(-1)">السابق</button><button type="button" class="btn primary" onclick="rkSave()">'+(isLast?'حفظ':'معاينة ثم حفظ')+'</button><button type="button" class="btn" '+(isLast?'disabled':'')+' onclick="rkGo(1)">التالي</button></div></div></div>';
 if(typeof v10RepairDialogs==='function')v10RepairDialogs();
}
async function rkSave(){
 if(!rkValidateStep())return;
 rkCollectFields();
 if(rkStep!==rkSteps[rkKind].length-1){rkStep=rkSteps[rkKind].length-1;rkPaint();return;}
 let x={...rkDraft};rkEnsure();
 if(rkKind==='receivable'){
  const val=Number(x.principal);
  if(!x.name?.trim()||!x.party?.trim()||!Number.isFinite(val)||val<=0||!x.due)return alert('أكمل اسم المستحق والجهة والمبلغ وتاريخ الاستحقاق.');
  const old=db.receivables.find(a=>a.id===x.id),collected=old?rkReceivableCollected(x.id):0;
  x.principal=rkToCents(val);
  if(x.principal<collected)return alert('لا يمكن خفض أصل المستحق دون المبالغ التي تم تحصيلها.');
  db.receivables=old?db.receivables.map(a=>a.id===x.id?x:a):[...db.receivables,x];
 }else if(rkKind==='collection'){
  const rec=db.receivables.find(a=>a.id===x.receivableId);
  const amount=rkToCents(x.amount);
  if(!rec||amount<=0||!x.account?.trim()||!x.date)return alert('حدد المبلغ الفعلي وتاريخه وحساب الاستلام.');
  if(amount>rec.principal-rkReceivableCollected(rec.id))return alert('لا يجوز تجاوز الرصيد المتبقي للمستحق.');
  x.id=rid();x.amount=amount;db.receivableCollections.push(x);
 }else if(rkKind==='scheduled'){
  if(!x.name?.trim()||!x.start)return alert('أكمل اسم العملية وتاريخ الاستحقاق.');
  if(x.method==='percentage'&&(!Number.isFinite(Number(x.rate))||Number(x.rate)<0||Number(x.rate)>100))return alert('النسبة يجب أن تكون بين 0% و100%.');
  if(x.method==='fixed'&&(!Number.isFinite(Number(x.amount))||Number(x.amount)<=0))return alert('يجب أن يكون المبلغ الثابت أكبر من صفر.');
  x.rate=Number(x.rate)||0;x.amount=rkToCents(x.amount);
  const old=db.scheduledOps.some(a=>a.id===x.id);db.scheduledOps=old?db.scheduledOps.map(a=>a.id===x.id?x:a):[...db.scheduledOps,x];
 }else if(rkKind==='document'){
  if(!x.name?.trim()||!x.date)return alert('عنوان المستند وتاريخه مطلوبان.');
  const old=db.docs.some(a=>a.id===x.id);
  if(!old&&!rkFile)return alert('اختر ملفاً صالحاً لإتمام حفظ المستند.');
  if(rkFile){try{await rkStoreFile(x.id,rkFile);x.fileName=rkFile.name;x.isDemo=false;}catch(e){alert('فشل حفظ الملف على الجهاز. لم يتم حفظ المستند.');return;}}
  x.amount=rkToCents(x.amount);db.docs=old?db.docs.map(a=>a.id===x.id?x:a):[...db.docs,x];
 }
 try{save()}catch(e){alert('تعذر حفظ البيانات في المتصفح.');return;}
 closeModal();render();toast('تم الحفظ في البيانات المحلية'+(v11ExamplesMode?' التجريبية':''));
}
function rkToggleSchedule(id){
 rkEnsure();const x=db.scheduledOps.find(a=>a.id===id);if(!x)return;
 x.status=x.status==='planned'?'paused':'planned';save();render();
}
function rkStoreFile(id,file){
 return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));
  const request=indexedDB.open('rakaez-local-attachments',1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files')};
  request.onerror=()=>reject(request.error);
  request.onsuccess=()=>{const conn=request.result,tx=conn.transaction('files','readwrite');tx.objectStore('files').put(file,(v11ExamplesMode?'demo:':'real:')+id);tx.oncomplete=()=>{conn.close();resolve()};tx.onerror=()=>{conn.close();reject(tx.error)}};
 });
}
function rkDocumentDownload(id){
 rkEnsure();if(!db.docs.some(x=>x.id===id&&!x.isDemo))return;
 const request=indexedDB.open('rakaez-local-attachments',1);
 request.onerror=()=>alert('تعذر فتح مخزن الملفات.');
 request.onsuccess=()=>{
  const conn=request.result,tx=conn.transaction('files','readonly'),get=tx.objectStore('files').get((v11ExamplesMode?'demo:':'real:')+id);
  get.onsuccess=()=>{const blob=get.result;if(!blob)return alert('المرفق غير متوفر على هذا الجهاز.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=db.docs.find(x=>x.id===id).fileName||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
  get.onerror=()=>alert('تعذر قراءة الملف.');tx.oncomplete=()=>conn.close();
 };
}
