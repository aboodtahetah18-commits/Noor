.rk-portfolio-components-inline h3{font-size:13px;color:#182A42;margin:0 0 10px}
.rk-portfolio-components-modal{padding:14px 23px}
.rk-components-list{display:grid;gap:0}
.rk-component-display{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid #d5e1e5}
.rk-component-display:last-child{border-bottom:0}
.rk-component-rank{display:grid;place-items:center;flex:none;width:27px;height:27px;background:#eaf4f1;border:1px solid #b7d5ca;border-radius:8px;font-weight:700;color:#167D78;font-size:11px}
.rk-component-title{flex:1;min-width:0;display:grid;gap:3px}
.rk-component-title strong{font-size:13px;color:#182A42;overflow-wrap:anywhere}
.rk-component-title small{font-size:11px;color:#627985;line-height:1.6;overflow-wrap:anywhere}
.rk-component-weight{flex:none;min-width:73px;text-align:left;font-weight:750;color:#167D78;font-size:12px}
.rk-components-total{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid #bcd5cb;font-size:11px;color:#576e7c}
.rk-components-total strong{color:#167D78;font-size:13px}
.rk-components-editor{padding:16px 20px;display:grid;gap:12px;max-height:62vh;overflow-y:auto}
.rk-components-editor #rkComponentsRows{display:grid;gap:10px}
.rk-component-line{border:1.5px solid #b9ccd6;border-right:4px solid #167D78;border-radius:12px;padding:12px 13px;background:#fbfdfd;display:grid;gap:10px}
.rk-component-line-head{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#182A42;font-size:12px;font-weight:700}
.rk-component-remove{min-height:31px!important;padding:5px 10px!important;font-size:11px!important;border:1px solid #d1be95!important;background:#faf5e8!important;color:#8a6723!important}
.rk-component-line-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rk-component-line-fields label,.rk-component-note{display:grid;gap:5px;font-size:11px;color:#536b79}
.rk-component-line-fields input,.rk-component-line-fields select,.rk-component-note input{border:1.5px solid #bed0d9;border-radius:9px;padding:8px 10px;width:100%;min-width:0;min-height:41px;background:#fff;color:#182A42}
.rk-component-add{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:43px!important;border:1.5px solid #167D78!important;background:#eaf6f3!important;color:#167D78!important}
.rk-component-total{padding:6px 0;color:#637b86;text-align:center;font-size:12px}
.rk-component-total[data-valid="false"]{color:#946b22}
.rk-study-components{display:grid;gap:14px;padding:7px 0}
.rk-study-components>.btn{min-height:43px!important}
@media(max-width:740px){
 .rk-component-line-fields{grid-template-columns:1fr}
 .rk-components-editor{padding:12px}
 .rk-portfolio-components-modal{padding:12px 17px}
 .rk-component-display{gap:8px}
 .rk-component-weight{min-width:62px;font-size:11px}
}


/* Context-first workspaces: no nested page bars; inherit the approved Rakaez identity. */

#view .rk-work-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 5px}

#view .rk-work-row .btn{flex:0 0 auto;min-height:37px}
#view .rk-work-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}

 rkEnsureAssets();

 list.sort((a,b)=>rkMalaaOrder==='yield'?Number(b.expectedReturn||0)-Number(a.expectedReturn||0):Number(a.redemptionDays)-Number(b.redemptionDays));

function rkEnsureAssets(){
 if(!Array.isArray(db.assetAccounts))db.assetAccounts=[];
 if(!Array.isArray(db.candidatePortfolios))db.candidatePortfolios=[];
}
function rkHoldingCost(h){return h.kind==='محفظة استثمارية'?Number(h.contributed||0):Number(h.quantity||0)*Number(h.cost||0)}
function rkHoldingMarket(h){return h.kind==='محفظة استثمارية'?Number(h.marketValue||0):Number(h.quantity||0)*Number(h.price||0)}
function rkHoldingHasPrice(h){return h.kind==='محفظة استثمارية'?h.marketValue!==undefined&&h.marketValue!==null&&h.marketValue!=='':h.price!==undefined&&h.price!==null&&h.price!==''}
function rkInvestmentCard(h){
 const cost=rkHoldingCost(h),priced=rkHoldingHasPrice(h),value=rkHoldingMarket(h),difference=value-cost;
 const status=!priced?'flat':difference>0?'profit':difference<0?'loss':'flat';
 const account=db.assetAccounts.find(a=>a.id===h.accountId);
 return `<button type="button" class="rk-investment-card rk-tap-record" data-asset="${esc(h.id)}" onclick="rkAssetDetails(this.dataset.asset)">
 <span class="rk-investment-head"><span class="rk-investment-name"><span class="rk-investment-symbol">${ico(h.kind==='محفظة استثمارية'?'bank':'trend')}</span>
 <span><strong class="rk-investment-card-name">${esc(h.name)}</strong><small class="rk-investment-type">${esc(h.kind)}${account?' · '+esc(account.name):''}</small></span></span><span class="rk-risk-tag">${esc(h.risk||'غير محددة')}</span></span>
 <span class="rk-investment-metrics"><span class="rk-metric rk-metric-cost"><span>إجمالي الاستثمار</span><strong>${money(cost)}</strong></span>
 <span class="rk-metric rk-metric-market"><span>القيمة السوقية</span><strong>${priced?money(value):'غير مدخلة'}</strong></span>
 <span class="rk-metric rk-metric-${status}"><span>الربح / الخسارة</span><strong>${priced?money(difference):'—'}</strong></span></span>
 </button>`;
}

function rkLegacyAllocationBars(data){
 const rows=Object.entries(data||{}).filter(([k,v])=>Number.isFinite(Number(v))&&Number(v)>0);
 if(!rows.length)return '<div class="rk-no-allocation">لم يُسجل توزيع أصول المحفظة بعد</div>';
 return '<div class="rk-allocation-list">'+rows.map(([k,v])=>'<div class="rk-allocation-line"><span>'+esc(k)+'</span><div class="rk-allocation-bar"><i style="width:'+Math.min(100,Number(v))+'%"></i></div><b>'+Number(v).toFixed(2)+'%</b></div>').join('')+'</div>';
}
const rkComponentTypes=["صندوق استثماري","صندوق متداول","سهم شركة","محفظة فرعية","عملة رقمية","ذهب","صكوك","سيولة","عقار","شركة خاصة","وديعة","استثمار بديل","أخرى"];
function rkComponentOwner(kind,id){
 rkEnsureAssets();
 if(kind==='account')return db.assetAccounts.find(x=>x.id===id)||null;
 if(kind==='holding')return db.holdings.find(x=>x.id===id&&x.kind==='محفظة استثمارية')||null;
 if(kind==='candidate')return db.candidatePortfolios.find(x=>x.id===id&&x.category==='محفظة')||null;
 return null;
}
function rkComponentItems(owner){return Array.isArray(owner?.components)?owner.components:[]}
function rkComponentSummary(owner){
 const rows=rkComponentItems(owner);
 if(!rows.length)return '<div class="rk-no-allocation">لم تُضف مكونات للمحفظة بعد</div>';
 const ratioCount=rows.filter(x=>x.weight!==null&&x.weight!==undefined&&x.weight!=='').length;
 const weightsComplete=ratioCount===rows.length;
 return '<div class="rk-components-list">'+rows.map((x,i)=>{
  const ratio=x.weight!==null&&x.weight!==undefined&&x.weight!==''?Number(x.weight).toFixed(2)+'%':'غير محددة';
  return '<div class="rk-component-display"><span class="rk-component-rank">'+(i+1)+'</span><span class="rk-component-title"><strong>'+esc(x.name)+'</strong><small>'+esc(x.kind==='أخرى'&&x.customKind?x.customKind:x.kind||'أخرى')+(x.symbol?' · '+esc(x.symbol):'')+'</small>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</span><span class="rk-component-weight">'+ratio+'</span></div>';
 }).join('')+'</div>'+(weightsComplete?'<div class="rk-components-total">مجموع نسب المكونات: <strong>'+rows.reduce((sum,x)=>sum+Number(x.weight),0).toFixed(2)+'%</strong></div>':'');
}
let rkComponentRowId=0;
function rkComponentRow(x={}){
 const uid=++rkComponentRowId,componentId=esc(x.id||'');
 const name=esc(x.name||''),symbol=esc(x.symbol||''),note=esc(x.note||''),customKind=esc(x.customKind||'');
 const weight=x.weight===null||x.weight===undefined||x.weight===''?'':String(x.weight);
 return '<div class="rk-component-line" data-row="'+uid+'" data-component-id="'+componentId+'"><div class="rk-component-line-head"><span>مكوّن استثماري</span><button type="button" class="btn rk-component-remove" onclick="this.closest(\'.rk-component-line\').remove();rkComponentsRefreshTotal()" aria-label="حذف المكوّن">'+ico('delete')+' حذف</button></div>'+
 '<div class="rk-component-line-fields">'+
 '<label>الاسم<input data-name maxlength="100" required placeholder="مثال: صندوق الذكاء الاصطناعي" value="'+name+'"></label>'+
 '<label>النوع<select data-kind>'+rkComponentTypes.map(k=>'<option value="'+k+'" '+(x.kind===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label>'+
 '<label>الرمز (اختياري)<input data-symbol maxlength="40" placeholder="رمز السهم أو الصندوق" value="'+symbol+'"></label>'+
 '<label>النسبة % (اختيارية)<input data-weight inputmode="decimal" type="number" min="0" max="100" step="0.01" placeholder="بدون نسبة" oninput="rkComponentsRefreshTotal()" value="'+weight+'"></label>'+
 '</div><label class="rk-component-note">نوع مخصص (عند اختيار أخرى)<input data-custom-kind maxlength="70" placeholder="مثال: حصة خاصة" value="'+customKind+'"></label><label class="rk-component-note">ملاحظة (اختيارية)<input data-note maxlength="220" value="'+note+'"></label></div>';
}
function rkComponentsRefreshTotal(){
 const output=document.getElementById('rkCompTotal');if(!output)return;
 const rows=[...document.querySelectorAll('#rkComponentsRows .rk-component-line')];
 const entered=rows.map(x=>x.querySelector('[data-weight]')?.value?.trim()||'').filter(Boolean);
 const sum=entered.reduce((n,k)=>n+Number(k),0);
 output.textContent=entered.length?'نسب مسجلة: '+sum.toFixed(2)+'% من '+rows.length+' مكونات':'النسب اختيارية';
 output.dataset.valid=(!entered.length||(entered.length===rows.length&&Math.round(sum*100)===10000))?'true':'false';
}
function rkComponentsAdd(){
 const list=document.getElementById('rkComponentsRows');if(!list)return;
 list.insertAdjacentHTML('beforeend',rkComponentRow());rkComponentsRefreshTotal();
}
function rkComponentsOpen(kind,id){
 const owner=rkComponentOwner(kind,id);if(!owner)return;
 const existing=rkComponentItems(owner);
 document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal rk-candidate-form-modal rk-components-modal" role="dialog" aria-modal="true" data-v8wizard="1">
 <div class="modalhead"><h2>مكونات ${esc(owner.name)}</h2><button type="button" class="btn" onclick="closeModal()" aria-label="إغلاق">${ico('close')}</button></div>
 <div class="rk-components-editor"><div id="rkComponentsRows">${existing.map(rkComponentRow).join('')}</div>
 <button type="button" class="btn rk-component-add" onclick="rkComponentsAdd()">${ico('plus')} إضافة مكوّن</button>
 <div id="rkCompTotal" class="rk-component-total">النسب اختيارية</div>
 </div>
 <div class="rk-compact-footer"><button type="button" class="btn primary" onclick="rkComponentsSave('${kind}','${esc(id)}')">${ico('check')} حفظ المكونات</button><button type="button" class="btn" onclick="rkComponentsBack('${kind}','${esc(id)}')">${ico('back')} رجوع</button></div>
 </div></div>`;
 if(typeof v10RepairDialogs==='function')v10RepairDialogs();rkComponentsRefreshTotal();
}
function rkComponentsRead(){
 const rows=[...document.querySelectorAll('#rkComponentsRows .rk-component-line')];
 const result=[],unique=new Set();
 for(const row of rows){
  const field=k=>row.querySelector('[data-'+k+']')?.value?.trim()||'';
  const name=field('name'),kind=field('kind'),symbol=field('symbol'),note=field('note'),customKind=field('custom-kind'),weightRaw=field('weight');
  if(!name||!rkComponentTypes.includes(kind)||(kind==='أخرى'&&!customKind))return {error:'أدخل اسم ونوع كل مكوّن، واسم النوع المخصص عند اختيار أخرى.'};
  const canonical=name.toLocaleLowerCase('ar')+'|'+kind;
  if(unique.has(canonical))return {error:'المكوّن «'+name+'» مكرر في المحفظة.'};
  unique.add(canonical);
  const weight=weightRaw===''?null:Number(weightRaw);
  if(weight!==null&&(!Number.isFinite(weight)||weight<0||weight>100||Math.abs(weight*100-Math.round(weight*100))>1e-6))return {error:'نسبة المكوّن «'+name+'» غير صحيحة.'};
  result.push({id:row.dataset?.componentId||rid(),name,kind,customKind:kind==='أخرى'?customKind:'',symbol,note,weight});
 }
 const filled=result.filter(x=>x.weight!==null);
 if(filled.length&&filled.length!==result.length)return {error:'حدد نسبة لكل المكونات أو اتركها جميعاً دون نسب.'};
 if(filled.length&&Math.round(filled.reduce((sum,x)=>sum+x.weight,0)*100)!==10000)return {error:'يجب أن يكون مجموع نسب المكونات 100%، أو تُترك النسب جميعها فارغة.'};
 return {components:result};
}
function rkComponentsSave(kind,id){
 const owner=rkComponentOwner(kind,id);if(!owner)return;
 const outcome=rkComponentsRead();if(outcome.error)return alert(outcome.error);
 owner.components=outcome.components;audit('تحديث مكونات محفظة',owner.name);save();render();rkComponentsBack(kind,id);toast('تم حفظ مكونات المحفظة');
}
function rkComponentsBack(kind,id){

 if(kind==='candidate')return rkCandidateReview(id,'components');
 closeModal();
}

 </form></div></div>`;

function rkSavePortfolioAllocation(kind,id){
 const obj=kind==='holding'?db.holdings.find(x=>x.id===id&&x.kind==='محفظة استثمارية'):kind==='account'?db.assetAccounts.find(x=>x.id===id):null;
 if(!obj)return;
 const result=rkReadAllocation('rkOwn');if(result.error)return alert(result.error);

function rkAssetDetails(id){
 rkEnsureAssets();const h=db.holdings.find(x=>x.id===id);if(!h)return;
 const priced=rkHoldingHasPrice(h),cost=rkHoldingCost(h),market=rkHoldingMarket(h);
 const dividends=db.dividends.filter(d=>d.holding===id),received=dividends.reduce((n,d)=>n+Number(d.amount||0),0);
 const account=db.assetAccounts.find(a=>a.id===h.accountId);
 const rows=[['نوع الأصل',h.kind],['المحفظة الشخصية',account?.name||'غير مرتبط'],['إجمالي الاستثمار',money(cost)],['القيمة السوقية',priced?money(market):'غير مدخلة'],['الربح / الخسارة',priced?money(market-cost):'—'],['التوزيعات المسجلة',money(received)]];
 if(h.quantity!==undefined)rows.push(['الكمية',Number(h.quantity||0).toLocaleString('en-US')]);
 document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal rk-budget-detail-dialog rk-record-detail" data-v8wizard="1" role="dialog" aria-modal="true" aria-label="تفاصيل ${esc(h.name)}">

 <dl class="rk-budget-detail-list rk-record-detail-list">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(String(v))}</dd></div>`).join('')}</dl>
 ${h.kind==='محفظة استثمارية'&&rkComponentItems(h).length?`<section class="rk-portfolio-components-inline rk-portfolio-components-modal"><h3>مكونات المحفظة</h3>${rkComponentSummary(h)}</section>`:''}
 ${h.kind==='محفظة استثمارية'?`<section class="rk-owned-allocation"><h3>توزيع أصول المحفظة</h3>${h.allocationDetail?rkAllocationBars(h.allocationDetail):rkLegacyAllocationBars(h.allocation)}</section>`:''}
 <div class="rk-budget-detail-actions rk-record-action-flex"><button class="btn primary" onclick="openModal('${h.kind==='محفظة استثمارية'?'portfolioUpdate':'price'}','${esc(id)}')">${ico('edit')} تحديث</button>
 <button class="btn" onclick="rkQuickDividend('${esc(id)}')">${ico('plus')} توزيع</button><button class="btn" onclick="rkAssignAsset('${esc(id)}')">${ico('bank')} ربط بمحفظة</button>${h.kind==='محفظة استثمارية'?`<button class="btn" onclick="rkPortfolioAllocationOpen('holding','${esc(id)}')">${ico('pie')} توزيع الأصول</button><button class="btn" onclick="rkComponentsOpen('holding','${esc(id)}')">${ico('layers')} مكونات المحفظة</button>`:''}</div>

const rkAllocationClasses=[
 ['saudi','الأسهم السعودية'],
 ['us','الأسهم الأمريكية'],
 ['developed','أسهم الأسواق المتقدمة الأخرى'],
 ['emerging','أسهم الأسواق الناشئة الأخرى'],
 ['gold','الذهب'],
 ['sukuk','الصكوك'],
 ['cash','السيولة وأدوات النقد'],
 ['other','أصول أخرى']
];
function rkAllocationEntries(data){
 return rkAllocationClasses.map(([key,label])=>({key,label,value:Number(data?.[key]||0)})).filter(v=>Number.isFinite(v.value)&&v.value>0);
}
function rkAllocationTotal(data){return rkAllocationEntries(data).reduce((n,x)=>n+x.value,0)}
function rkAllocationBars(data){
 const entries=rkAllocationEntries(data);
 if(!entries.length)return '<div class="rk-no-allocation">لم يُدخل توزيع الأصول بعد</div>';
 return '<div class="rk-allocation-list">'+entries.map(a=>'<div class="rk-allocation-line"><span>'+a.label+'</span><div class="rk-allocation-bar"><i style="width:'+Math.min(100,a.value)+'%"></i></div><b>'+a.value.toFixed(2)+'%</b></div>').join('')+'</div>';
}
function rkAllocationInputs(data,fieldPrefix){
 return '<div class="rk-allocation-form" data-allocation-prefix="'+fieldPrefix+'">'+rkAllocationClasses.map(([key,label])=>
 '<label class="rk-allocation-input"><span>'+label+'</span><input id="'+fieldPrefix+key+'" inputmode="decimal" type="number" min="0" max="100" step="0.01" value="'+(data&&data[key]!=null?Number(data[key]):0)+'" oninput="rkAllocationInputTotal(\''+fieldPrefix+'\')"></label>').join('')+
 '<div class="rk-allocation-total">الإجمالي: <strong id="'+fieldPrefix+'total">0.00%</strong></div></div>';
}
function rkAllocationInputTotal(prefix){
 const output=document.getElementById(prefix+'total');if(!output)return;
 const total=rkAllocationClasses.reduce((n,[key])=>n+Number(document.getElementById(prefix+key)?.value||0),0);
 output.textContent=(Number.isFinite(total)?total.toFixed(2):'—')+'%';
 output.dataset.valid=total===0||Math.abs(total-100)<0.005?'true':'false';
}
function rkReadAllocation(prefix){
 const entries=rkAllocationClasses.map(([key])=>[key,String(document.getElementById(prefix+key)?.value??'')]);
 const values={};let any=false,sum=0;
 for(const [key,raw] of entries){
  const num=raw.trim()===''?0:Number(raw);
  if(!Number.isFinite(num)||num<0||num>100||Math.abs(num*100-Math.round(num*100))>1e-6)return {error:'أدخل نسباً صحيحة بين 0 و100، بمنزلتين عشريتين كحد أقصى.'};
  values[key]=num;if(num>0)any=true;sum+=num;
 }
 if(any&&Math.round(sum*100)!==10000)return {error:'يجب أن يكون مجموع نسب توزيع الأصول 100.00%، والمجموع الحالي '+sum.toFixed(2)+'%.'};
 return {allocation:any?values:null};
}

function rkSaveCandidate(id){
 rkEnsureAssets();
 const read=k=>document.getElementById(k)?.value?.trim()||'';
 const name=read('rkCandidateName'),category=read('rkCandidateCategory'),risk=read('rkCandidateRisk');
 if(!name||!['محفظة','صندوق','صك','أخرى'].includes(category)||!['غير محددة','منخفضة','متوسطة','عالية'].includes(risk))return alert('راجع اسم الفرصة ونوعها والمخاطرة.');
 const number=(key,min,max,integer=false)=>{
  const raw=read(key);if(raw==='')return null;const n=Number(raw);
  return Number.isFinite(n)&&n>=min&&n<=max&&(!integer||Number.isInteger(n))?n:NaN;
 };
 const redemptionDays=number('rkCandidateDays',0,365,true),expectedReturn=number('rkCandidateReturn',-100,1000),fees=number('rkCandidateFees',0,100),minSubscription=number('rkCandidateMin',0,1e12),nav=number('rkCandidateNAV',0,1e12),maxDrawdown=number('rkCandidateDrawdown',0,100);
 if([redemptionDays,expectedReturn,fees,minSubscription,category==='صندوق'?nav:null,category==='محفظة'?maxDrawdown:null].some(n=>n!==null&&!Number.isFinite(n)))return alert('راجع القيم والنسب وفترات الاسترداد.');
 const allocationCheck=rkReadAllocation('rkCa');
 if(allocationCheck.error)return alert(allocationCheck.error);
 const prior=db.candidatePortfolios.find(x=>x.id===id);
 const next={...prior,id:prior?.id||rid(),name,category,risk,redemptionDays,expectedReturn,fees,minSubscription,manager:read('rkCandidateManager'),objective:read('rkCandidateObjective'),notes:read('rkCandidateNotes'),
  fundType:category==='صندوق'?read('rkCandidateFundType'):'',isin:category==='صندوق'?read('rkCandidateISIN'):'',nav:category==='صندوق'?nav:null,benchmark:category==='محفظة'?read('rkCandidateBenchmark'):'',maxDrawdown:category==='محفظة'?maxDrawdown:null};
 if(allocationCheck.allocation)next.allocation=allocationCheck.allocation;else if(!prior?.allocation||rkAllocationEntries(prior.allocation).length)next.allocation=null;
 const index=db.candidatePortfolios.findIndex(x=>x.id===id);
 if(index<0)db.candidatePortfolios.push(next);else db.candidatePortfolios[index]=next;
 audit(id?'تعديل فرصة':'إضافة فرصة',name);save();render();rkCandidateReview(next.id);toast('حُفظت تفاصيل الفرصة');
}

function fundings(){return `${sTitle('عقود تمويل الهلال الداخلية','هذه حسابات افتراضية داخل المنصة وليست قروضاً مصرفية فعلية')}<div class="row spaced"><button class="btn primary" onclick="openModal('funding')">＋ إنشاء عقد تمويل</button></div><section class="card"><div class="tablewrap"><table><thead><tr><th>البند</th><th>أصل التمويل</th><th>معدل سنوي</th><th>مدة (شهر)</th><th>الربح الإجمالي البسيط</th><th>إجمالي السداد</th><th>المتبقي من الأصل</th><th>إجراء</th></tr></thead><tbody>${db.fundings.length?db.fundings.map(f=>{let profit=Math.round(f.principal*f.rate/100*f.months/12);return `<tr><td>${esc(db.categories.find(c=>c.id===f.category)?.name)}</td><td>${money(f.principal)}</td><td>${f.rate}%</td><td>${f.months}</td><td>${money(profit)}</td><td>${money(f.principal+profit)}</td><td>${money(f.principal-f.paid)}</td><td><button class="btn" onclick="openModal('repay','${f.id}')">سداد أصل</button></td></tr>`}).join(''):`<tr><td colspan="8" class="empty">لا يوجد تمويل داخلي مسجل</td></tr>`}</tbody></table></div></section><p class="notice">طريقة الاحتساب في هذه النسخة: ربح بسيط ثابت على أصل التمويل للفترة المحددة، للتخطيط فقط. لا تتضمن جدولة فائدة متناقصة أو احتساب أيام فعلي أو رسوم مصرفية. لا تتم زيادة النقد تلقائياً من التمويل الداخلي؛ يُزاد سقف البند فقط لمنع ازدواج الأرصدة.</p>`}function transactions(){let rows=db.transactions.filter(t=>t.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date));return `${sTitle('سجل المعاملات','تُعرض معاملات الشهر المحدد')}<section class="card"><div class="row between spaced"><span class="muted tiny">${rows.length} معاملة</span><button class="btn primary" onclick="openModal('transaction')">＋ إضافة معاملة</button></div>${txTable(rows)}</section>`}function reports(){let inc=rkRecordedIncome(),sp=spent(),saving=db.savings.reduce((s,x)=>s+x.balance,0),invest=db.holdings.reduce((s,h)=>s+(h.kind==='محفظة استثمارية'?(h.marketValue||0):h.quantity*h.price),0);return `<div class="grid stats">${stat('الدخل المسجل',inc,'الشهر المحدد','var(--blue)','wallet')}${stat('المصروف',sp,'الشهر المحدد','var(--red)','chart')}${stat('الفائض التشغيلي',income()*db.ratios.hilal/100-sp,'المخصص التشغيلي ناقص المصروف','var(--teal)','moon')}${stat('ادخار + استثمار',saving+invest,'أرصدة حالية وليست ربحاً','var(--gold)','trend')}</div>${sTitle('تقرير الانحرافات عن الميزانية')}<section class="card">${db.categories.map(c=>`<div class="metricline"><span>${esc(c.name)}</span><span class="money" style="color:${spent(c.id)>c.limit*100?'var(--red)':'var(--teal)'}">${money(c.limit*100-spent(c.id))}</span></div>`).join('')}</section>${sTitle('تصدير ومشاركة')}<section class="card"><div class="row" style="flex-wrap:wrap"><button class="btn primary" onclick="exportCsv()">تنزيل معاملات CSV</button><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button><button class="btn" onclick="exportJson()">نسخة احتياطية JSON</button></div><p class="tiny muted">مخرجات هذا التقرير مبنية على الإدخالات المحلية. المراجعة والمطابقة البنكية مطلوبة قبل الاعتماد المالي.</p></section>`}function addBusinessDays(day,n){let d=new Date(day+'T12:00:00');while(n>0){d.setDate(d.getDate()+1);if(d.getDay()!==5&&d.getDay()!==6)n--}return iso(d)}let settingsTab='salary';
function setSettingsTab(t){settingsTab=t;render()}
function settings(){
const tabs=[['salary','الراتب','wallet'],['budgets','الميزانيات','chart'],['data','البيانات','settings']];
const tabsHtml='<div class="settings-tabs">'+tabs.map(t=>`<button class="btn ${settingsTab===t[0]?'active':''}" onclick="setSettingsTab('${t[0]}')">${ico(t[2])} ${t[1]}</button>`).join('')+'</div>';
let body='';
if(settingsTab==='salary')body=`<section class="card settings-panel"><div class="formgrid"><div class="field"><label>الراتب الشهري (ر.س)</label><input id="salary" type="number" min="0" step="0.01" value="${db.salary/100}"></div><div class="field"><label>نسبة بنك الهلال (%)</label><input id="ratioH" type="number" min="0" max="100" value="${db.ratios.hilal}"></div><div class="field"><label>نسبة بنك ملاءة (%)</label><input id="ratioM" type="number" min="0" max="100" value="${db.ratios.malaa}"></div><div class="field"><label>نسبة بنك الأصول (%)</label><input id="ratioA" type="number" min="0" max="100" value="${db.ratios.assets}"></div></div><div class="actions"><button class="btn primary" onclick="saveSettings()">${ico('shield')} حفظ</button><button class="btn dark" onclick="postSalary()" ${db.salaryMonths.includes(month)?'disabled':''}>${ico('wallet')} ${db.salaryMonths.includes(month)?'مُرحّل':'ترحيل'}</button></div></section>`;
if(settingsTab==='budgets')body=`<section class="card settings-panel"><div class="formgrid">${db.categories.map(c=>`<div class="field"><label>${esc(c.name)} (ر.س)</label><input type="number" id="c_${c.id}" step="0.01" value="${c.limit}"></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="saveCats()">${ico('shield')} حفظ</button></div></section>`;
if(settingsTab==='data')body=`<section class="card settings-panel"><div class="actions"><button class="btn" onclick="exportJson()">${ico('upload')} تصدير</button><button class="btn warn" onclick="resetData()">${ico('fund')} مسح</button></div></section>`;
return `${tabsHtml}${body}`;
}
function saveSettings(){let h=Number(document.getElementById('ratioH').value),m=Number(document.getElementById('ratioM').value),a=Number(document.getElementById('ratioA').value),sal=amount('salary');if([h,m,a].some(x=>!Number.isFinite(x)||x<0||x>100)||Math.abs(h+m+a-100)>.000001||sal<=0)return alert('راجع الراتب؛ يجب أن تكون النسب موجبة ومجموعها 100%.');db.ratios={hilal:h,malaa:m,assets:a};db.salary=sal;audit('تحديث الإعدادات','توزيع الراتب');save();render();toast('تم حفظ الإعدادات')}function saveCats(){for(let c of db.categories.filter(c=>!c.archived)){let v=Number(document.getElementById('c_'+c.id).value);if(!Number.isFinite(v)||v<0)return alert('أدخل قيماً صحيحة');c.limit=v}audit('تعديل الميزانيات','حدود البنود');save();render();toast('حُفظت حدود البنود')}function postSalary(){if(db.salaryMonths.includes(month))return;if(!confirm('هل تم استلام الراتب فعلياً بقيمة '+money(db.salary)+' عن الفترة '+month+'؟ سيُسجل الدخل بعد التأكيد، ولن ينفذ النظام أي تحويل بنكي أو يزيد رصيد ملاءة تلقائياً.'))return;db.salaryMonths.push(month);audit('تأكيد استلام راتب',month+': '+money(db.salary));save();render();toast('تم إثبات استلام الراتب في سجل الدورة، دون إنشاء تحويلات أو زيادة أرصدة المراكز تلقائياً.')}function resetData(){if(confirm('سيتم حذف جميع البيانات المحلية نهائياً. هل أنت متأكد؟')){db=seed();save();render()}}function download(name,text,type){let b=new Blob(['\ufeff',text],{type}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJson(){download('rakaez-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCsv(){let rows=[['date','description','type','category','amount_SAR'],...db.transactions.map(t=>[t.date,t.description,t.type,t.category,t.amount/100])];download('rakaez-transactions.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}function navigate(p){page=p;document.querySelector('#layout let openNavGroups=new Set(['main','banks']);
function toggleNavGroup(g){if(openNavGroups.has(g))openNavGroups.delete(g);else openNavGroups.add(g);drawNav()}
function drawNav(){
 const nav=document.getElementById('nav');if(!nav)return;
 const sections=[
 ['', ['insights']],
 ['بنوك المنصة',['hilal','malaa','assets']],
 ['البنوك العامة والخارجية',['externalBanks']],
 ['العمليات',['transactions','spending','cycles','scheduled','receivables','documents','ledger','funding','interbank','import']],
 ['الإدارة والمتابعة',['goals','debts','fees','reserves','position','research','intelligence','reports']],
 ['النظام',['settings']]
 ];
 nav.classList.add('rakaez-nav-flat');
 nav.innerHTML=sections.map(([label,ids])=>{
  const links=ids.map(id=>N.find(n=>n[0]===id)).filter(Boolean);
  return (label?`<div class="rk-nav-group-label">${label}</div>`:'')+links.map(n=>`<button type="button" class="rakaez-nav-link ${(page===n[0]||(n[0]==='spending'&&page==='spending-followups'))?'active':''}" aria-current="${(page===n[0]||(n[0]==='spending'&&page==='spending-followups'))?'page':'false'}" onclick="navigate('${n[0]}')"><span class="rakaez-nav-icon" aria-hidden="true">${ico(n[2])}</span><span class="rakaez-nav-name">${n[1]}</span></button>`).join('');
 }).join('');
}

function field(id,label,type='text',value='',opts=''){return `<div class="field"><label for="${id}">${label}</label>${type==='select'?`<select id="${id}">${opts}</select>`:type==='textarea'?`<textarea id="${id}" rows="5" placeholder="${esc(value)}"></textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01" min="0"':''} required>`}</div>`}function catOptions(){return db.categories.filter(c=>!c.archived).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function options(a){return a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function openModal(type,id=''){let title='',body='',act='حفظ';const sums=db.savings;switch(type){case 'transaction':title='تسجيل معاملة مالية';body=field('fDate','تاريخ العملية','date',iso(today))+field('fDesc','الوصف / الجهة','text','')+field('fType','نوع العملية','select','',options([['expense','مصروف'],['income','دخل آخر']]))+field('fCat','البند التشغيلي','select','',catOptions())+field('fAmount','المبلغ (ر.س)','number','');break;case 'funding':title='تمويل طارئ لبند';body=field('fCat','البند المستفيد','select','',catOptions())+field('fAmount','أصل التمويل (ر.س)','number')+field('fRate','معدل الربح السنوي البسيط (%)','number','0')+field('fMonths','المدة بالأشهر','number','6')+`<div class="field full"><div class="notice">تمويل إداري داخلي يزيد سقف البند ولا يزيد رصيدك النقدي أو صافي ثروتك. يَظهر في قائمة الالتزامات الداخلية.</div></div>`;break;case 'deposit':title='نقل مبلغ إلى شريحة ادخارية';body=field('fBucket','الوجهة','select','',options(sums.map(s=>[s.id,s.name])))+field('fAmount','المبلغ (ر.س)','number')+`<div class="field full"><div class="notice">النقل هنا من السيولة الفورية إلى شريحة أخرى، ولا يمثل إيداعاً بنكياً جديداً.</div></div>`;break;case 'withdraw':title='طلب سحب من الادخار';body=field('fBucket','الشريحة','select','',options(sums.map(s=>[s.id,s.name])))+field('fAmount','المبلغ (ر.س)','n function parseSMS(text){let m=text.match(/(?:SAR|ر\.س|ريال(?:اً)?|مبلغ|بقيمة|amount)\s*[:：]?\s*([0-9٠-٩۰-۹,.،]+)/i)||text.match(/([0-9٠-٩۰-۹][0-9٠-٩۰-۹,.،]*)\s*(?:SAR|ر\.س|ريال)/i);let normalize=s=>s.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/،/g,'');let num=m?Number(normalize(m[1]).replace(/,/g,'')):NaN;let date=text.match(/20\d{2}[-/]\d{1,2}[-/]\d{1,2}/)?.[0]?.replace(/\//g,'-')||iso(today);let inflow=/إيداع|حوالة واردة|راتب|استلام|إضافة رصيد|credited/i.test(text);return {date,description:text.trim().slice(0,130),type:inflow?'income':'expense',category:'other',amount:Number.isFinite(num)?Math.round(num*100):0}}
function csvSplit(line){let out=[],s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){out.push(s);s=''}else s+=c}out.push(s);return out}function normalizeCSV(text){let lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()),head=csvSplit(lines.shift()||'').map(s=>s.trim().toLowerCase());function col(names){return head.findIndex(h=>names.includes(h))}let di=col(['date','التاريخ','تاريخ العملية']),de=col(['description','الوصف','البيان','details','merchant']),am=col(['amount_sar','amount','المبلغ','قيمة العملية']),ty=col(['type','النوع']),ca=col(['category','البند']);if(di<0||am<0)throw Error('يجب أن يحتوي الملف على عمودي date و amount أو التاريخ والمبلغ');return lines.map(line=>{let cells=csvSplit(line),s=(cells[am]||'').replace(/[ر$\s]/g,'').replace(/,/g,''),num=Number(s);let type=ty>=0?cells[ty]:(num<0?'expense':'expense');return {id:rid(),date:(cells[di]||'').replace(/\//g,'-'),description:cells[de]||'عملية مستوردة',type:/income|دخل/i.test(type)?'income':'expense',category:ca>=0&&db.categories.find(c=>c.id===cells[ca])?cells[ca]:'other',amount:Math.round(Math.abs(num)*100)}}).filter(x=>/^\d{4}-\d{1,2}-\d{1,2}$/.test(x.date)&&Number.isFinite(x.amount)&&x.amount>0)}function duplicate(t){return db.transactions.some(x=>x.date===t.date&&x.amount===t.amount&&x.description===t.description&&x.type===t.type)}function importView(){return `${sTitle('استيراد معاملات من الكشوف والرسائل','الاستيراد يتطلب مراجعتك قبل الحفظ')}<div class="split"><section class="card"><div class="cardtitle">استيراد كشف CSV</div><p class="tiny muted">الحقول المدعومة: date, description, amount, type, category. يدعم العناوين الإنجليزية والعربية المحددة. ملف Excel: احفظه بصيغة CSV أولاً.</p><input type="file" accept=".csv,text/csv" id="csvFile" onchange="readCsv(this)" style="width:100%"><p class="notice">الاستيراد لا يتصل ببنكك ولا يرفع الملف إلى خادم. راجع كل عملية وتأكد من اتجاه المصروفات والدخل.</p></section><section class="card"><div class="cardtitle">تحليل رسالة بنكية نصية</div><textarea id="sms" style="width:100%;min-height:105px" placeholder="الصق نص رسالة مصرفية هنا بعد إزالة أي بيانات حساسة..."></textarea><div class="actions"><button class="btn primary" onclick="readSMS()">تحليل ومعاينة الرسالة</button></div><p class="tiny muted">لا يمكن للصفحة قراءة الرسائل من الهاتف تلقائياً. استخدم اللصق اليدوي.</p></section></div>${sTitle('معاينة قبل الاعتماد')}<section class="card" id="importPreview">${importRows.length?previewRows():'<div class="empty">اختر كشف CSV أو الصق رسالة ليظهر جدول المراجعة</div>'}</section>`}function readCsv(input){let file=input.files?.[0];if(!file)return;if(file.size>3000000)return alert('الملف كبير جداً. الحد 3 ميجابايت');let fr=new FileReader();fr.onload=()=>{try{importRows=normalizeCSV(fr.result);render();toast('يرجى مراجعة السجلات قبل الاعتماد')}catch(e){alert(e.message)}};fr.readAsText(file,'utf-8')}function readSMS(){let s=document.getElementById('sms').value.trim();if(!s)return alert('أدخل نص الرسالة');let t=parseSMS(s);if(!t.amount)return alert('تعذر التعرف على المبلغ. أدخل العملية يدوياً بدلاً من ذلك.');importRows=[t];render()}function previewRows(){let valid=importRows.filter(t=>!duplicate(t));return `<p class="tiny muted">${importRows.length} صف، منها ${importRows.length-valid.length} مكرر. راجع التاريخ والاتجاه والبند قبل الاعتماد.</p><div class="tablewrap"><table><tr><th>التاريخ</th><th>الوصف</th><th>الاتجاه</th><th>المبلغ</th><th>الحالة</th></tr>${importRows.slice(0,100).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.description)}</td><td>${t.type==='expense'?'مصروف':'دخل'}</td><td>${money(t.amount)}</td><td><span class="tag ${duplicate(t)?'neg':''}">${duplicate(t)?'مكرر':'جاهز'}</span></td></tr>`).join('')}</table></div>${importRows.length>100?'<p class="tiny muted">تُعرض أول 100 عملية فقط</p>':''}<div class="actions"><button class="btn" onclick="importRows=[];render()">إلغاء</button><button class="btn primary" onclick="approveI function v3Field(id,label,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function v3Select(id,label,current,choices){return `<div class="field"><label>${label}</label><select id="${id}">${choices.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(current)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function formV3(type,id=''){let existing=type==='reserves'?null:(db[type]||[]).find(x=>x.id===id),o=existing||{},label='',content='';if(type==='goals'){label='هدف مالي — بنك الأصول';content=v3Field('vName','اسم الهدف',o.name)+v3Field('vTarget','قيمة الهدف (ر.س)',(o.target||0)/100,'number','min="0" step="0.01"')+v3Field('vSaved','المبلغ المخصص للهدف (ر.س)',(o.saved||0)/100,'number','min="0" step="0.01"')+v3Field('vMonthly','المساهمة الشهرية المخططة (ر.س)',(o.monthly||0)/100,'number','min="0" step="0.01"')+v3Field('vDate','التاريخ المستهدف',o.date||'','date')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='debts'){label='دين أو التزام — بنك الهلال';content=v3Field('vName','الجهة / الالتزام',o.name)+v3Field('vPrincipal','أصل الالتزام (ر.س)',(o.principal||0)/100,'number','min="0" step="0.01"')+v3Field('vPaid','المبلغ المسدد (ر.س)',(o.paid||0)/100,'number','min="0" step="0.01"')+v3Field('vInstallment','القسط الشهري (ر.س)',(o.installment||0)/100,'number','min="0" step="0.01"')+v3Field('vDate','الاستحقاق القادم',o.date||'','date')+v3Field('vRate','معدل الفائدة / الربح السنوي (%)',o.rate||0,'number','min="0" step="0.01"')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='fees'){label='رسم أو اشتراك دوري';content=v3Field('vName','اسم الرسم',o.name)+v3Select('vBank','المركز المالي',o.bank||'assets',[['hilal','الهلال'],['malaa','ملاءة'],['assets','الأصول']])+v3Field('vAccount','المحفظة / الحساب المرتبط',o.account||'')+v3Field('vAmount','قيمة الرسم (ر.س)',(o.amount||0)/100,'number','min="0" step="0.01"')+v3Select('vPeriod','الدورية',o.period||'monthly',[['monthly','شهري'],['quarterly','ربع سنوي'],['semiannual','نصف سنوي'],['annual','سنوي'],['once','مرة واحدة']])+v3Field('vDate','تاريخ الاستحقاق القادم',o.date||'','date')+v3Field('vNotes','ملاحظات',o.notes||'')}
else if(type==='reserves'){label='احتياطي '+bankName(id);content=`<p class="notice">حدد مبلغاً صغيراً ومناسباً لقدرتك، ويمكن تعديله لاحقاً. هذا مجرد هدف ولا يغيّر رصيد البنك.</p>`+v3Field('vAmount','الاحتياطي المستهدف (ر.س)',(db.reserves[id]||0)/100,'number','min="0" step="0.01"')}
else return;
document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="v3header"><h2>${id&&type!=='reserves'?'تعديل':'إضافة / إدارة'} ${label}</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="event.preventDefault();saveV3('${type}','${id}')"><div class="formgrid v3form">${content}</div><div class="v3footer"><button type="submit" class="btn primary">حفظ</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form></div></div>`}
function getVal(id){return document.getElementById(id)?.value.trim()||''}
function cents(id){let n=Number(getVal(id));return Number.isFinite(n)&&n>=0?Math.round(n*100):NaN}
function saveV3(type,id){let o={id:id||rid(),name:getVal('vName'),notes:getVal('vNotes'),date:getVal('vDate')};if(type==='reserves'){let n=cents('vAmount');if(!Number.isFinite(n))return alert('المبلغ غير صالح');db.reserves[id]=n;audit('تعديل مركز مالي',bankName(id));}
else{if(!o.name)return alert('اسم البند مطلوب');if(type==='goals'){Object.assign(o,{target:cents('vTarget'),saved:cents('vSaved'),monthly:cents('vMonthly')});if(o.saved>o.target)return alert('المبلغ المخصص لا يتجاوز قيمة الهدف')}
if(type==='debts'){Object.assign(o,{principal:cents('vPrincipal'),paid:cents('vPaid'),installment:cents('vInstallment'),rate:Number(getVal('vRate'))});if(o.paid>o.principal)return alert('المبلغ المسدد أكبر من أصل الالتزام');if(!Number.isFinite(o.rate)||o.rate<0)return alert('معدل غير صالح')}
if(type==='fees')Object.assign(o,{bank:getVal('vBank'),account:getVal('vAccount'),amount:cents('vAmount'),period:getVal('vPeriod')});if(Object.values(o).some(v=>typeof v==='number'&&!Number.isFinite(v)))return alert('أدخل أرقاماً صحيحة');if(id){let i=db[type].findIndex(x=>x.id===id);if(i<0)return alert('تعذر العثور على السجل');db[type][i]=type==='debts'&&db[type][i].repaymentMode==='capacity'?{
 ...db[type][i],...o,repaymentMode:o.date||o.installment>0?'scheduled':'capacity'
}:o}else db[type].push(o);audit(id?'تعديل سجل':'إضافة سجل',o.name)}save();closeModal();render();toast('تم حفظ البيانات')}

function deleteV3(type,id){
 if(!['goals','debts','fees'].includes(type))return;
 const o=(db[type]||[]).find(x=>x.id===id);if(!o)return;
 if(type==='debts'&&Number(o.paid||0)>0)return alert('لا يمكن حذف التزام سبق تسجيل دفعات عليه.');
 if(type==='goals'&&Number(o.saved||0)>0)return alert('لا يمكن حذف هدف له مخصصات قبل تسويتها.');
 if(!confirm('حذف '+o.name+'؟'))return;
 db[type]=db[type].filter(x=>x.id!==id);audit('حذف سجل',o.name);save();closeModal();render();toast('تم الحذف');
}
function detailV3(type,id){
 const record=(db[type]||[]).find(x=>x.id===id);if(!record||!['goals','debts','fees'].includes(type))return;
 const labels={name:'الاسم',target:'المستهدف',saved:'المخصص',monthly:'المساهمة الشهرية',principal:'أصل الالتزام',paid:'المسدد',installment:'القسط',rate:'المعدل السنوي',date:'التاريخ',bank:'بنك المنصة',account:'الحساب',amount:'الرسم',period:'الدورية',notes:'ملاحظات'};
 const cash=['target','saved','monthly','principal','paid','installment','amount'];
 const items=Object.entries(record).filter(([k,v])=>labels[k]&&v!==''&&v!=null).map(([k,v])=>`<div><dt>${labels[k]}</dt><dd>${cash.includes(k)?money(v):k==='bank'?esc(bankName(v)):k==='period'?esc(periodLabel(v)):k==='rate'?esc(v)+'%':esc(v)}</dd></div>`).join('');
 document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal rk-budget-detail-dialog rk-record-detail" data-v8wizard="1" role="dialog" aria-modal="true"><div class="modalhead"><h2>${esc(record.name)}</h2><button class="btn rk-budget-close" onclick="closeModal()" aria-label="إغلاق">${ico('close')}</button></div><dl class="rk-budget-detail-list rk-record-detail-list">${items}</dl><div class="rk-budget-detail-actions"><button class="btn primary" onclick="formV3('${type}','${esc(id)}')">${ico('edit')} تعديل</button><button class="btn rk-budget-delete-action" onclick="deleteV3('${type}','${esc(id)}')">${ico('delete')} حذف</button></div></div></div>`;
 if(typeof v10RepairDialogs==='function')v10RepairDialogs();
}
if(!Array.isArray(db.interbankPlans))db.interbankPlans=[];
const v4Banks=[['hilal','بنك الهلال'],['malaa','بنك ملاءة'],['assets','بنك الأصول']];
function v4Numbers(){
 const saving=db.savings.reduce((a,b)=>a+Math.max(0,Number(b.balance)||0),0);
 const investments=db.holdings.reduce((a,h)=>a+(h.kind==='محفظة استثمارية'?Math.max(0,Number(h.marketValue)||0):Math.max(0,Number(h.quantity)||0)*Math.max(0,Number(h.price)||0)),0);
 const debt=db.debts.reduce((a,d)=>a+Math.max(0,(Number(d.principal)||0)-(Number(d.paid)||0)),0);
 const internal=db.fundings.reduce((a,f)=>a+Math.max(0,(Number(f.principal)||0)-(Number(f.paid)||0)),0);
 const annualFees=db.fees.reduce((a,f)=>a+(f.period==='once'?0:Math.round((Number(f.amount)||0)*countPeriods(f))),0);
 const operatingBudget=income()*db.ratios.hilal/100;
 const spending=spent();
 return {saving,investments,debt,internal,annualFees,operatingBudget,spending,operatingHeadroom:operatingBudget-spending,partialNet:saving+investments-debt};
}

function positionView(){let b=v4Numbers();let bankDetail=[['بنك الهلال','مخصص تشغيل الشهر',b.operatingBudget,'مصروفات الشهر',b.spending,'فرق المخصص والمصروف',b.operatingHeadroom],['بنك ملاءة','رصيد الادخار المسجل',b.saving,'الاحتياطي المستهدف',db.reserves.malaa||0,'فرق الرصيد عن المستهدف',b.saving-(db.reserves.malaa||0)],['بنك الأصول','القيمة السوقية المدخلة',b.investments,'المستهدف الاحتياطي',db.reserves.assets||0,'فرق القيمة عن المستهدف',b.investments-(db.reserves.assets||0)]];
return `<div class="notice"><strong>مهم:</strong> هذه لوحة مركز مالي جزئي حسب البيانات المسجلة، وليست ميزانية عمومية مكتملة: لا نملك رصيد الحساب النقدي الحقيقي لدى الهلال أو النقد غير المستثمر لدى الأصول. المخصصات الشهرية لا تُعامل كنقد مؤكد، والاستثمارات لا تُضاف مرتين.</div><div class="grid stats">${stat('أرصدة ملاءة المسجلة',b.saving,'شرائح الادخار','var(--blue)','shield')}${stat('قيمة الاستثمارات المسجلة',b.investments,'آخر تقييم مدخل','var(--gold)','trend')}${stat('الديون الخارجية المتبقية',b.debt,'لا يشمل التمويل الداخلي','var(--red)','fund')}${stat('صافي المركز الجزئي',b.partialNet,'الادخار + الاستثمار − الديون الخارجية','var(--teal)','bank')}</div>${sTitle('بنوك المنصة التفصيلية','مبالغ متفاوتة الطبيعة لا تجمع تلقائياً في رصيد نقدي واحد')}<div class="grid banks">${bankDetail.map(r=>`<section class="card"><h3>${r[0]}</h3>${[1,3,5].map((i)=>`<div class="metricline"><span>${r[i]}</span><b class="money">${money(r[i+1])}</b></div>`).join('')}<div class="actions"><button class="btn" onclick="navigate('${r[0].includes('الهلال')?'hilal':r[0].includes('ملاءة')?'malaa':'assets'}')">عرض البنك</button></div></section>`).join('')}</div>${sTitle('التزامات غير نقدية ومؤشرات تخطيطية')}<section class="card"><div class="metricline"><span>أصل التمويل الداخلي الإداري (لا يُطرح ثانيةً من الموحد)</span><b>${money(b.internal)}</b></div><div class="metricline"><span>الرسوم الدورية المتوقعة سنوياً (ليست مدفوعة)</span><b>${money(b.annualFees)}</b></div><div class="metricline"><span>مجموع الاحتياطيات المستهدفة (أهداف لا أرصدة)</span><b>${money(Object.values(db.reserves).reduce((a,n)=>a+(Number(n)||0),0))}</b></div><div class="metricline"><span>الأهداف المالية المستقبلية (لا تخصم من الثروة الحالية)</span><b>${money(db.goals.reduce((a,g)=>a+(Number(g.target)||0),0))}</b></div></section><div class="actions"><button class="btn primary" onclick="navigate('interbank')">خطط التمويل بين المراكز</button><button class="btn" onclick="navigate('insights')">عرض التحليلات</button></div>`}
function interbankView(){return `<div class="notice"><strong>محاكاة تمويل داخلي:</strong> هذا سجل عقود مقترحة بين مراكزك المالية الافتراضية، ولا ينفذ سحباً أو إيداعاً أو يخلق أرباحاً إجمالية. يتطلب التنفيذ الفعلي مستقبلاً قيوداً مزدوجة ومطابقة حسابات.</div>${sTitle('طلبات التمويل بين المراكز','طلب جديد لا يؤثر على الأرصدة المسجلة')}<section class="card"><div class="actions"><button class="btn primary" onclick="interbankForm()">＋ طلب تمويل داخلي</button></div><div class="tablewrap"><table><thead><tr><th>الجهة المقرضة</th><th>الجهة المستفيدة</th><th>الأصل</th><th>المعدل السنوي</th><th>المدة</th><th>التكلفة التقديرية</th><th>الحالة</th><th>إدارة</th></tr></thead><tbody>${db.interbankPlans.map(f=>`<tr><td>${bankName(f.from)}</td><td>${bankName(f.to)}</td><td>${money(f.principal)}</td><td>${f.rate}%</td><td>${f.months} شهر</td><td>${money(Math.round(f.principal*f.rate/100*f.months/12))}</td><td><span class="tag gold">للدراسة فقط</span></td><td><div class="crudactions"><button class="btn" onclick="interbankDetails('${f.id}')">تفاصيل</button><button class="btn" onclick="interbankForm('${f.id}')">تعديل</button><button class="btn warn" onclick="interbankDelete('${f.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا توجد طلبات تمويل بين البنوك</td></tr>'}</tbody></table></div></section>`}
function interbankForm(id=''){let f=db.interbankPlans.find(x=>x.id===id)||{from:'malaa',to:'hilal',principal:0,rate:0,months:3,notes:''};let choices=v4Banks;let fields=v3Select('iFrom','من البنك المقرض',f.from,choices)+v3Select('iTo','إلى البنك المستفيد',f.to,choices)+v3Field('iPrincipal','أصل التمويل (ر.س)',f.principal/100,'number','min="0.01" step="0.01" required')+v3Field('iRate','معدل سنوي افتراضي (%)',f.rate,'number','min="0" max="100" step="0.01"')+v3Field('iMonths','مدة التمويل بالأشهر',f.months,'number','min="1" max="120" step="1"')+v3Field('iNotes','سبب الطلب',f.notes);document.getElementById('modalRoot').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="v3header"><h2>${id?'تعديل':'إضافة'} طلب تمويل بين البنوك</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="event.preventDefault();interbankSave('${id}')"><div class="formgrid v3form">${fields}</div><p class="tiny muted">الفائدة أو الربح الداخلي لا يزيد صافي الثروة المجمعة؛ الحساب تخطيطي ولا يقتطع من أي حساب.</p><div class="v3footer"><button type="submit" class="btn primary">حفظ</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form></div></div>`}
function interbankSave(id){let from=getVal('iFrom'),to=getVal('iTo'),principal=cents('iPrincipal'),rate=Number(getVal('iRate')),months=Number(getVal('iMonths'));if(from===to)return alert('يجب اختيار بنكين مختلفين');if(!Number.isFinite(principal)||principal<=0||!Number.isFinite(rate)||rate<0||rate>100||!Number.isInteger(months)||months<1||months>120)return alert('راجع قيمة التمويل والمعدل والمدة');let f={id:id||rid(),from,to,principal,rate,months,notes:getVal('iNotes')};if(id){let i=db.interbankPlans.findIndex(x=>x.id===id);if(i<0)return alert('السجل غير موجود');db.interbankPlans[i]=f}else db.interbankPlans.push(f);audit(id?'تعديل طلب تمويل':'إضافة طلب تمويل',bankName(from)+' → '+bankName(to));save();closeModal();render();toast('حفظ الطلب التخطيطي')}

// V6 unified smart insights: explainable local rules only, no implied live market access.
function insightData(){
 let b=v4Numbers(), notices=[],ratio=db.salary?100:0;
 const push=(bank,level,title,amount,link)=>notices.push({bank,level,title,amount,link});
 const monthlyFee=Math.round(b.annualFees/12);
 const installments=db.debts.reduce((t,d)=>t+Number(d.installment||0),0);
 let discretionary=db.salary-installments-monthlyFee;
 if(discretionary<db.salary*.65)push('الهلال','تحذير','ضغط الالتزامات',money(installments+monthlyFee),'debts');
 db.categories.forEach(c=>{let used=spent(c.id),lim=Math.round(Number(c.limit||0)*100);if(lim>0&&used>=lim*.8)push('الهلال',used>=lim?'تحذير':'متابعة',c.name,`${Math.round(used/lim*100)}%`,'hilal')});
 let target=Number(db.reserves?.malaa||0),available=db.savings.filter(x=>Number(x.days)===0).reduce((t,x)=>t+Number(x.balance||0),0);
 if(available<target)push('ملاءة','متابعة','الاحتياطي',money(target-available),'malaa');
 db.savings.forEach(x=>{if(Number(x.rate||0)<0)push('ملاءة','تحذير','عائد الحساب',esc(x.name),'malaa')});
 let portfolio=db.holdings.filter(h=>h.kind==='محفظة استثمارية');
 portfolio.filter(h=>!Number(h.marketValue)).forEach(h=>push('الأصول','بيانات','تحديث المحفظة',h.name||'محفظة','assets'));
 let invested=b.investments;
 if(invested>0){let weights=db.holdings.map(h=>({name:h.name||'أصل',value:h.kind==='محفظة استثمارية'?Number(h.marketValue||0):Number(h.quantity||0)*Number(h.price||0)}));weights.filter(h=>h.value/invested>.4).forEach(h=>push('الأصول','متابعة','تركيز مرتفع',`${h.name} · ${(100*h.value/invested).toFixed(1)}%`,'assets'))}
 if(!db.holdings.length)push('الأصول','بيانات','لا توجد أصول','أضف أصلاً','assets');
 if(!notices.length)push('ركائز','معلومة','لا توجد تنبيهات','حسب المدخلات','position');
 return {notices,monthlyFee,installments,discretionary,available,invested,b};
}

// Keep entry points concise and avoid wrapping of long multiword action labels.
function compactActions(root=document){root.querySelectorAll('button.btn').forEach(btn=>{
 if(btn.dataset.v6compact)return;
 let t=(btn.textContent||'').trim().replace(/\s+/g,' ');
 let labels=[
 [/إضافة|إنشاء|جديد|إثبات|تسجيل/,'إضافة','plus'],
 [/تعديل|تحرير/,'تعديل','edit'],
 [/حذف|إزالة|مسح/,'حذف','delete'],
 [/إلغاء|إغلاق/,'إلغاء','close'],
 [/حفظ|اعتماد|تأكيد/,'حفظ','check'],
 [/عرض|تفاصيل|مراجعة|فتح/,'عرض','view'],
 [/تصدير|تنزيل|تحميل/,'تصدير','download'],
 [/مطابقة/,'مطابقة','check'],
 [/تصفية|فلترة/,'تصفية','filter'],
 [/بحث/,'بحث','search'],
 [/تحديث|تجديد/,'تحديث','refresh'],
 [/تمويل/,'تمويل','wallet'],
 [/سحب/,'سحب','wallet'],
 [/توزيع/,'توزيع','chart'],
 [/استيراد|رفع/,'استيراد','upload'],
 [/عكس/,'عكس','refresh'],
 [/إعادة ضبط/,'إعادة ضبط','refresh']
 ]
 let match=labels.find(([re])=>re.test(t));if(!match)return;
 btn.innerHTML=ico(match[2])+`<span>${match[1]}</span>`;

function toggleRakaezNotifications(){
 const panel=document.getElementById('rakaezNotifications'),button=document.getElementById('rakaezBell');
 if(!panel||!button)return;
 const opening=panel.hidden;
 if(opening){
  const alerts=[];
  try{
   if(Array.isArray(db.categories))for(const c of db.categories){
    const allowance=Number(c.limit||0)*100+(typeof internal==='function'?Number(internal(c.id)||0):0);
    const actual=typeof spent==='function'?Number(spent(c.id)||0):0;
    if(allowance>0&&actual>=allowance*.8)alerts.push({title:String(c.name||'بند ميزانية'),detail:actual>=allowance?'تجاوز المخصص':'اقترب من الحد المعتمد',page:'hilal'});
   }
   const todayMidday=new Date(rkDate()+'T12:00:00');
   const dueSoon=(date)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return false;const days=(new Date(date+'T12:00:00')-todayMidday)/86400000;return Number.isFinite(days)&&days<=7};
   if(Array.isArray(db.scheduledOps))for(const x of db.scheduledOps){
    if(x.status==='planned'&&dueSoon(x.start))alerts.push({title:'عملية مجدولة: '+String(x.name||'عملية'),detail:'بانتظار التحقق من التنفيذ، دون خصم تلقائي',page:'scheduled'});
   }
   if(Array.isArray(db.receivables))for(const x of db.receivables){
    const outstanding=Number(x.principal||0)-(typeof rkReceivableCollected==='function'?rkReceivableCollected(x.id):0);
    if(outstanding>0&&dueSoon(x.due))alerts.push({title:'مستحق للتحصيل: '+String(x.name||'مستحق'),detail:rkAmount(outstanding)+' متبقٍ للتحصيل',page:'receivables'});
   }
  }catch(e){console.warn('تعذر تحديث بعض التنبيهات',e)}
  panel.innerHTML='<h2>الإشعارات والتنبيهات</h2>'+(alerts.length?alerts.map(a=>'<div class="notification-entry"><strong>'+esc(a.title)+'</strong><small>'+esc(a.detail)+'</small><button class="btn" type="button" onclick="navigate(\''+a.page+'\');document.getElementById(\'rakaezNotifications\').hidden=true">عرض</button></div>').join(''):'<div class="notification-entry">لا توجد تنبيهات مالية جديدة حالياً.</div>');
 }
 panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));
}

function rakaezSemanticPurpose(btn){
 const actual=(btn.textContent||'').replace(/\s+/g,' ').trim();
 const aria=(btn.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim();
 const t=(actual&&!/^[×✕xX+\-＋]$/.test(actual)?actual:aria||actual);
 if(btn.matches('.mobilemenu'))return 'menu';
 if(!t)return null;
 if(/^(?:×|✕|X|x)$/.test(t))return 'close';
 // Order matters: more specific financial actions precede generic words.
 const rules=[
  [/إعادة ضبط|تصفير|استعادة الافتراضي|مسح الفلاتر/,'refresh'],
  [/حذف|إزالة|مسح السجل|إتلاف/,'delete'],
  [/تعديل|تحرير|تغيير البيانات/,'edit'],
  [/إعدادات|تفضيلات|الضبط|ضبط الحساب|تكوين/,'settings'],
  [/تصفية|فلتر|الفلاتر/,'filter'],
  [/بحث|ابحث/,'search'],
  [/^\s*[+＋]\s*\S|إضافة|إنشاء|جديد|إثبات قيد|تسجيل/,'plus'],
  [/^(?:المصروفات|مصروفات|مصروف|الإنفاق|الخسائر)$/,'expense'],
  [/^(?:الإيرادات|إيرادات|إيراد|الدخل|الوارد)$/,'income'],
  [/^(?:الكل|الجميع|جميع العمليات|عرض الكل)$|قائمة كاملة/,'list'],
  [/إثبات رصيد|رصيد افتتاحي|أرصدة/,'bank'],
  [/مطابقة|تسوية حساب|عكس القيد|تسوية قيد/,'reconcile'],
  [/حفظ|تخزين/,'check'],
  [/اعتماد|تصديق/,'shield'],
  [/تأكيد|تحقق/,'confirm'],
  [/إلغاء|إغلاق|اغلاق|تراجع/,'close'],
  [/السابق|رجوع|العودة|للخلف/,'back'],
  [/التالي|المتابعة للخطوة/,'forward'],
  [/استيراد|رفع|إرفاق/,'upload'],
  [/تصدير|تنزيل|تحميل/,'download'],
  [/طباعة/,'print'],
  [/تحويل|نقل مبلغ/,'transfer'],
  [/تمويل|قرض/,'fund'],
  [/سحب/,'withdraw'],
  [/إيداع/,'deposit'],
  [/سداد|دفع|تحصيل/,'payment'],
  [/دورة الراتب|جدولة|المجدولة|التقويم/,'calendar'],
  [/مراقبة|اطلاع|عرض|تفاصيل|معاينة|فتح|مراجعة|رؤية/,'view'],
  [/متابعة الإجراءات|متابعة الحالات|سجل المتابعة/,'list'],
  [/تحليل|تقارير|إحصائيات|رسم بياني|مؤشرات/,'chart'],
  [/تحديث|تجديد/,'refresh'],
  [/حركة مالية/,'plus'],
  [/قائمة|سجل/,'list']
 ];
 return (rules.find(([test])=>test.test(t))||[])[1]||null;
}
function rakaezDecorateButtons(root=document){
 if(!root||typeof root.querySelectorAll!=='function')return;
 root.querySelectorAll('button').forEach(btn=>{
  // Record cards and navigation buttons have their own composite illustrations.
  if(btn.matches('.rakaez-nav-link,.rakaez-bell,[data-step],.v24-record,.v25-record,.v22-tx,.v22-account,.v22-budget-item,.v19-cycle-list-item'))return;
  const purpose=rakaezSemanticPurpose(btn);
  const shell=btn.querySelector(':scope > .rakaez-action-icon');
  const firstSVG=btn.querySelector(':scope > svg')||btn.querySelector(':scope > .rakaez-action-icon svg')||btn.querySelector(':scope > span > svg');
  if(!purpose){
   // Unknown actions should keep their text, never inherit a misleading gear.
   if(shell){shell.remove();btn.classList.remove('rakaez-action-button');}
   else if(firstSVG&&firstSVG.querySelector('path[d^="m19 13"]'))firstSVG.remove();
   btn.dataset.rakaezSemanticIcon='none';
   return;
  }
  if(btn.dataset.rakaezSemanticIcon===purpose)return;
  // Icon-only menu and close controls must not display a second text glyph.
  if(!shell&&!firstSVG&&(purpose==='menu'||/^[×✕xX]$/.test((btn.textContent||'').trim()))){
   btn.textContent='';
   btn.setAttribute('aria-label',purpose==='menu'?'فتح القائمة':'إغلاق');
  }
  btn.dataset.rakaezSemanticIcon=purpose;
  const illustration=ico(purpose);
  if(shell){shell.innerHTML=illustration;}
  else if(firstSVG){firstSVG.outerHTML=illustration;}
  else{
   btn.insertAdjacentHTML('afterbegin','<span class="rakaez-action-icon" aria-hidden="true">'+illustration+'</span>');
  }
  btn.classList.add('rakaez-action-button');
  btn.dataset.rakaezDecorated='1';
  if(purpose==='delete')btn.classList.add('rakaez-danger');
  else btn.classList.remove('rakaez-danger');
 });
}

 });

function rakaezDataCheck(){
 const issues=[];
 if(!db||typeof db!=='object')return ['تعذر قراءة سجلات البيانات'];
 for(const name of ['transactions','categories','savings','holdings','dividends','fundings'])if(!Array.isArray(db[name]))issues.push('قائمة غير صالحة: '+name);
 if(db.ratios&&['hilal','malaa','assets'].every(k=>Number.isFinite(Number(db.ratios[k])))){
  const total=['hilal','malaa','assets'].reduce((sum,k)=>sum+Number(db.ratios[k]),0);
  if(Math.abs(total-100)>.001)issues.push('مجموع نسب المراكز هو '+total+'% وليس 100%');
 }
 for(const name of ['transactions','holdings','dividends','fundings','goals','debts','fees']){
  if(!Array.isArray(db[name]))continue;
  const ids=new Set();for(const entry of db[name]){
   if(!entry||typeof entry!=='object'){issues.push('سجل غير صالح: '+name);continue}
   if(entry.id){if(ids.has(entry.id))issues.push('معرّف مكرر في '+name);ids.add(entry.id)}
   if('amount' in entry&&(!Number.isFinite(Number(entry.amount))||Number(entry.amount)<0))issues.push('مبلغ غير صالح في '+name);
  }
 }
 if(Array.isArray(db.ledgerEntries))for(const entry of db.ledgerEntries){
  if(!Array.isArray(entry.lines))continue;
  const debit=entry.lines.reduce((n,l)=>n+Number(l.debit||0),0),credit=entry.lines.reduce((n,l)=>n+Number(l.credit||0),0);
  if(!Number.isFinite(debit)||!Number.isFinite(credit)||Math.abs(debit-credit)>.01)issues.push('قيد غير متوازن: '+String(entry.description||entry.id||'بدون وصف'));
 }

 const safeArray=k=>Array.isArray(db[k])?db[k]:[];
 const numeric=x=>Number.isFinite(Number(x))&&Number(x)>=0;
 const categories=new Set(safeArray('categories').map(x=>x.id));
 const holdingIds=new Set(safeArray('holdings').map(x=>x.id));
 const accountIds=new Set(safeArray('assetAccounts').map(x=>x.id));
 const receivables=new Map(safeArray('receivables').map(x=>[x.id,x]));
 for(const c of safeArray('categories')){
  if(!c||!c.id||!String(c.name||'').trim()||!numeric(c.limit))issues.push('بند ميزانية غير صالح');
 }
 for(const t of safeArray('transactions')){
  if(!t||!numeric(t.amount)||Number(t.amount)<=0)issues.push('عملية بمبلغ غير صالح');
  if(t?.type==='expense'&&t.category&&!categories.has(t.category))issues.push('مصروف مرتبط ببند محذوف');
 }
 for(const d of safeArray('debts')){
  if(!numeric(d.principal)||!numeric(d.paid)||Number(d.paid)>Number(d.principal))issues.push('التزام مدفوعاته تتجاوز أصله');
  if(!numeric(d.installment))issues.push('قسط غير صالح');
 }
 for(const g of safeArray('goals'))if(!numeric(g.target)||!numeric(g.saved)||Number(g.saved)>Number(g.target))issues.push('هدف مالي بتخصيص غير صالح');
 for(const z of safeArray('savings'))if(!numeric(z.balance))issues.push('رصيد ادخار غير صالح');
 for(const h of safeArray('holdings')){
  if(h.accountId&&!accountIds.has(h.accountId))issues.push('أصل مرتبط بمحفظة غير موجودة');
  if(h.quantity!==undefined&&!numeric(h.quantity))issues.push('كمية أصل غير صالحة');
 }
 for(const d of safeArray('dividends'))if(!holdingIds.has(d.holding)||!numeric(d.amount)||Number(d.amount)<=0)issues.push('توزيع استثماري غير صالح');
 const received=new Map();
 for(const c of safeArray('receivableCollections')){
  if(!receivables.has(c.receivableId)||!numeric(c.amount)||Number(c.amount)<=0)issues.push('تحصيل مستحق غير صالح');
  received.set(c.receivableId,(received.get(c.receivableId)||0)+Number(c.amount||0));
 }
 for(const [id,sum] of received)if(sum>Number(receivables.get(id)?.principal||0))issues.push('تحصيل يتجاوز أصل المستحق');
 for(const op of safeArray('scheduledOps')){
  if(op.method==='percentage'&&(!numeric(op.rate)||Number(op.rate)>100))issues.push('نسبة جدولة غير صالحة');
  if(op.method==='fixed'&&!numeric(op.amount))issues.push('مبلغ عملية مجدولة غير صالح');
 }
 const allocationValid=o=>{
  if(o==null)return true;
  if(typeof o!=='object'||Array.isArray(o))return false;
  const fields=rkAllocationClasses.filter(([k])=>Object.prototype.hasOwnProperty.call(o,k));
  if(!fields.length)return true;
  const numbers=fields.map(([k])=>Number(o[k]));
  return numbers.every(v=>Number.isFinite(v)&&v>=0&&v<=100)&&Math.round(numbers.reduce((a,b)=>a+b,0)*100)===10000;
 };
 for(const p of safeArray('candidatePortfolios'))if(!allocationValid(p.allocation))issues.push('نسب توزيع فرصة استثمارية غير متوازنة');
 for(const p of safeArray('holdings'))if(!allocationValid(p.allocationDetail))issues.push('نسب توزيع محفظة غير متوازنة');
 for(const p of safeArray('assetAccounts'))if(!allocationValid(p.allocationDetail))issues.push('نسب توزيع محفظة الوساطة غير متوازنة');
 const checkComponents=(obj,label)=>{
  if(obj.components===undefined||obj.components===null)return;
  if(!Array.isArray(obj.components)){issues.push('مكونات غير صالحة في '+label);return}
  const seen=new Set(),ids=new Set();let weightCount=0,weightSum=0;
  for(const item of obj.components){
   if(!item||typeof item.name!=='string'||!item.name.trim()||!rkComponentTypes.includes(item.kind)||(item.kind==='أخرى'&&!String(item.customKind||'').trim())){
    issues.push('مكوّن استثماري غير صالح في '+label);continue;
   }
   const canonical=item.kind+'|'+item.name.trim().toLocaleLowerCase('ar');
   if(seen.has(canonical))issues.push('مكوّن مكرر في '+label);seen.add(canonical);
   if(item.id){if(ids.has(item.id))issues.push('معرّف مكوّن مكرر في '+label);ids.add(item.id)}
   if(item.weight!==null&&item.weight!==undefined&&item.weight!==''){
    const w=Number(item.weight);weightCount++;weightSum+=w;
    if(!Number.isFinite(w)||w<0||w>100||Math.abs(w*100-Math.round(w*100))>0.000001)issues.push('نسبة مكوّن غير صالحة في '+label);
   }
  }
  if(weightCount&&(weightCount!==obj.components.length||Math.round(weightSum*100)!==10000))issues.push('مجموع نسب مكونات '+label+' ليس 100%');
 };
 for(const account of safeArray('assetAccounts'))checkComponents(account,'محفظة الوساطة');
 for(const holding of safeArray('holdings'))if(holding.kind==='محفظة استثمارية')checkComponents(holding,'المحفظة الاستثمارية');
 for(const candidate of safeArray('candidatePortfolios'))if(candidate.category==='محفظة')checkComponents(candidate,'فرصة المحفظة');
 for(const b of safeArray('externalBanks')){
  if(!String(b.name||'').trim()||!['hilal','malaa','assets'].includes(b.center)||b.last4&&!/^[0-9]{4}$/.test(b.last4))issues.push('تعريف بنك خارجي غير صالح');
  if(b.logo&&!/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(b.logo))issues.push('شعار بنك خارجي غير صالح');
 }
 return issues;
}

function rkStoreFile(id,file){

  const request=indexedDB.open('rakaez-local-attachments',1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files')};
  request.onerror=()=>reject(request.error);
  request.onsuccess=()=>{const conn=request.result,tx=conn.transaction('files','readwrite');tx.objectStore('files').put(file,(v11ExamplesMode?'demo:':'real:')+id);tx.oncomplete=()=>{conn.close();resolve()};tx.onerror=()=>{conn.close();reject(tx.error)}};
 });
}
function rkDocumentDownload(id){

 request.onsuccess=()=>{
  const conn=request.result,tx=conn.transaction('files','readonly'),get=tx.objectStore('files').get((v11ExamplesMode?'demo:':'real:')+id);
  get.onsuccess=()=>{const blob=get.result;if(!blob)return alert('المرفق غير متوفر على هذا الجهاز.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=db.docs.find(x=>x.id===id).fileName||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
  get.onerror=()=>alert('تعذر قراءة الملف.');tx.oncomplete=()=>conn.close();
 };
}


/* Complete missing icon coverage without discarding action labels. */
function rkIconForAction(label){
 if(/حذف|مسح|إزالة/.test(label))return 'delete';
 if(/إعادة ضبط|تصفير/.test(label))return 'refresh';
 if(/السابق|رجوع|عودة/.test(label))return 'back';
 if(/التالي/.test(label))return 'forward';
 if(/إغلاق|إلغاء|✕|×/.test(label))return 'close';
 if(/تصفية|فلترة|فلتر/.test(label))return 'filter';
 if(/بحث/.test(label))return 'search';
 if(/الكل/.test(label))return 'list';
 if(/مصروف|سحب|خسارة/.test(label))return 'expense';
 if(/إيراد|دخل/.test(label))return 'income';
 if(/تحديث|تجديد/.test(label))return 'refresh';
 if(/إعدادات|الإعدادات|ضبط النظام/.test(label))return 'settings';
 if(/تعديل|تحرير|خصائص/.test(label))return 'edit';
 if(/حفظ|اعتماد|تأكيد|تطبيق/.test(label))return 'check';
 if(/عرض|فتح|تفاصيل|فحص|معاينة/.test(label))return 'view';
 if(/تصدير|تنزيل|تحميل/.test(label))return 'download';
 if(/رفع|استيراد/.test(label))return 'upload';
 if(/إضافة|إنشاء|تسجيل|جديد|إثبات/.test(label))return 'plus';
 if(/توزيع|أرباح|تقرير|تحليل|رسم/.test(label))return 'chart';
 if(/قسط|تمويل|سداد|تحويل|إيداع|تحصيل/.test(label))return 'wallet';
 // No guessed icon. Ambiguous text-only buttons are preferable to incorrect symbols.
 return null;
}
function rkEnsureAllButtonIcons(root=document){
 root.querySelectorAll('button').forEach(button=>{
  if(button.querySelector('svg')||button.closest('.rakaez-nav-flat')||button.matches('.rakaez-bell,[data-step]'))return;
  const label=(button.textContent||button.getAttribute('aria-label')||'').trim();
  if(!label)return;
  const iconName=rkIconForAction(label);
  if(!iconName)return;
  const svg=ico(iconName);
  if(label==='✕'||label==='×')button.textContent='';
  button.insertAdjacentHTML('afterbegin',svg);
  button.classList.add('rk-icon-ready');
 });
}

/* V15 — Operational merchant monitoring. Integrates existing local data; preserves established design. */
function rkMerchantEnglishFromText(text){
 const value=String(text||'').replace(/\s+/g,' ').trim();
 const explicit=value.match(/(?:لدى|عند|التاجر|المتجر|merchant(?: name)?|store|pos(?: purchase)? at|\bat\b)\s*[:：-]?\s*([A-Za-z][A-Za-z0-9 &'.,-]{2,75})/i);
 const purchase=value.match(/(?:شراء|مشتريات|عملية بيع)\s+([A-Za-z][A-Za-z0-9 &'.,-]{2,75})/i);
 const plain=/^[A-Za-z][A-Za-z0-9 &'.,-]{2,75}$/.test(value)?value:null;
 let candidate=explicit?.[1]||purchase?.[1]||plain;
 if(!candidate)return null;
 candidate=candidate.split(/\s+(?=SAR\b|SR\b|CARD\b|MADA\b|VISA\b|BALANCE\b|REF\b|AUTH\b|TERMINAL\b|AMOUNT\b|DATE\b|ريال|بطاقة|الرصيد|مرجع|الوقت|التاريخ|مبلغ)/i)[0]
  .replace(/\s+\d[\d.,:/-]*$/,'').replace(/^[\s,.-]+|[\s,.-]+$/g,'').replace(/\s+/g,' ').trim();
 if(candidate.length<3||candidate.length>72||/^(?:SAR|MADA|VISA|POS|BANK|ATM|CREDIT|DEBIT|PURCHASE|TRANSACTION|CARD|AMOUNT|BALANCE)$/i.test(candidate))return null;
 return candidate;
}
const rkLegacyParseSMS=parseSMS;
parseSMS=function(text){
 const row=rkLegacyParseSMS(text);
 const english=rkMerchantEnglishFromText(text);
 return {...row,merchantEnglish:english,merchantSource:english?'BANK_MESSAGE_SUGGESTION':null};
};
const rkLegacyNormalizeCSV=normalizeCSV;
normalizeCSV=function(csv){
 return rkLegacyNormalizeCSV(csv).map(row=>{
  const english=rkMerchantEnglishFromText(row.description);
  return {...row,merchantEnglish:english,merchantSource:english?'CSV_DESCRIPTION_SUGGESTION':null};
 });
};
function rkMerchantKey(name){return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function rkMerchantWindowDays(date,difference){
 const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+difference);return d.toISOString().slice(0,10);
}
function rkMerchantMonitored(){
 const end=iso(new Date()),start=rkMerchantWindowDays(end,-29),priorStart=rkMerchantWindowDays(end,-59),priorEnd=rkMerchantWindowDays(end,-30);
 const groups=new Map(),seenIds=new Set();
 for(const t of db.transactions||[]){
  if(t.type!=='expense'||!Number.isSafeInteger(Number(t.amount))||Number(t.amount)<=0)continue;
  const id=String(t.id||'');if(id&&seenIds.has(id))continue;if(id)seenIds.add(id);
  const name=(t.merchantEnglish||rkMerchantEnglishFromText(t.description)||'').trim(),key=rkMerchantKey(name);
  if(!key||!Array.isArray(db.categories)||!db.categories.some(c=>c.id===t.category))continue;
  const date=String(t.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<priorStart||date>end)continue;
  let g=groups.get(key);
  if(!g){g={key,name,current:0,prior:0,count:0,categoryTotals:{}};groups.set(key,g)}
  const cents=Number(t.amount);
  if(date>=start){g.current+=cents;g.count++;g.categoryTotals[t.category]=(g.categoryTotals[t.category]||0)+cents}
  else if(date<=priorEnd)g.prior+=cents;
 }
 return [...groups.values()].map(g=>{
  const category=Object.keys(g.categoryTotals).sort((a,b)=>g.categoryTotals[b]-g.categoryTotals[a])[0]||'';
  const categoryObj=db.categories.find(c=>c.id===category),used=category?rkActionPeriodSpend(category,iso(new Date()).slice(0,7)):0;
  const limit=categoryObj?Math.round(Number(categoryObj.limit||0)*100)+(db.fundings||[]).filter(f=>f.category===category&&String(f.date||'').slice(0,7)<=iso(new Date()).slice(0,7)).reduce((a,f)=>a+Number(f.principal||0),0):0;
  const ratio=g.prior>0?Math.round((g.current-g.prior)/g.prior*1000)/10:null;
  const pressure=limit>0&&used>limit?'OVER':limit>0&&used>=limit*.8?'WATCH':ratio!==null&&ratio>=30&&g.current>=g.prior&&g.count>=2?'RISING':'NORMAL';
  return {...g,category,categoryName:categoryObj?.name||'غير محدد',used,limit,ratio,pressure};
 }).sort((a,b)=>b.current-a.current);
}

  if(!note||!action)return alert('إغلاق المتابعة يتطلب الإجراء المنفذ ونتيجة موثقة.');

function rkActionCents(value){
 const raw=String(value??'').trim();
 if(!/^\d{1,15}(?:\.\d{1,2})?$/.test(raw))return null;
 const [whole,dec='']=raw.split('.');
 const valueMinor=BigInt(whole)*100n+BigInt(dec.padEnd(2,'0'));
 return valueMinor>0n&&valueMinor<=BigInt(Number.MAX_SAFE_INTEGER)?Number(valueMinor):null;
}
function rkActionPeriodSpend(category,period){
 return (db.transactions||[]).filter(t=>t.type==='expense'&&t.category===category&&String(t.date||'').slice(0,7)===period)
  .reduce((a,t)=>a+Number(t.amount||0),0);
}
function rkActionExpected(input){
 const cat=db.categories.find(c=>c.id===input.category);
 const date=String(input.date||''),period=date.slice(0,7),minor=rkActionCents(input.amount);
 if(!cat||!minor||!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
 const limit=Math.round(Number(cat.limit||0)*100)+(db.fundings||[]).filter(f=>f.category===cat.id&&String(f.date||'').slice(0,7)<=period).reduce((a,f)=>a+Number(f.principal||0),0);
 const before=rkActionPeriodSpend(cat.id,period),after=before+minor;
 const pct=limit>0?Math.round(after/limit*100):null;
 return {category:cat,minor,period,before,after,limit,percent:pct,
  pressure:limit>0&&after>limit?'OVER':limit>0&&after>=limit*.8?'WATCH':'NORMAL'};
}
function rkCaseCurrentMetric(c){
 if(String(c.merchantKey||'').startsWith('budget:')){
  const category=String(c.categoryId||c.merchantKey.slice(7));
  return {current:rkActionPeriodSpend(category,iso(new Date()).slice(0,7))};
 }
 return rkMerchantMonitored().find(m=>m.key===c.merchantKey)||null;
}

function rkActionStoreFollowup(tx,impact,force){
 if(!Array.isArray(db.merchantFollowups))db.merchantFollowups=[];
 const merchantKey=tx.merchantEnglish?rkMerchantKey(tx.merchantEnglish):'budget:'+tx.category;
 const merchantName=tx.merchantEnglish||'بند '+impact.category.name;
 const trend=tx.merchantEnglish?rkMerchantMonitored().find(m=>m.key===merchantKey):null;
 const rising=Boolean(trend&&trend.ratio!==null&&trend.ratio>=30&&trend.count>=2);
 const recent=tx.date>=rkMerchantWindowDays(iso(new Date()),-30)&&tx.date<=iso(new Date());
 if(!force&&!recent)return null;
 if(!force&&impact.pressure==='NORMAL'&&!rising)return null;
 const current=tx.merchantEnglish?(trend?.current||tx.amount):impact.after;
 let existing=db.merchantFollowups.find(c=>c.merchantKey===merchantKey&&c.status!=='VERIFIED');
 if(existing){
  if(!Array.isArray(existing.events))existing.events=[];
  if(!Array.isArray(existing.relatedTransactionIds))existing.relatedTransactionIds=[];
  if(!existing.relatedTransactionIds.includes(tx.id))existing.relatedTransactionIds.push(tx.id);
  existing.events.push({date:new Date().toISOString(),action:'TRANSACTION_LINKED',note:'ارتبطت عملية مصروف جديدة رقم '+tx.id+' بالمراجعة'});
  return existing;
 }
 const now=iso(new Date());
 const next={id:rid(),merchantKey,merchantName,categoryId:tx.category,status:'OPEN',owner:'',action:'',targetPercent:20,
  baseline:current,createdAt:now,nextReview:rkMerchantWindowDays(now,30),
  lastMeasurement:null,originTransactionId:tx.id,relatedTransactionIds:[tx.id],
  events:[{date:new Date().toISOString(),action:'OPEN',note:'بدأت المتابعة بعد رصد أثر العملية على '+impact.category.name}]};
 db.merchantFollowups.push(next);
 return next;
}

 const category=get('rkACategory');
 if(!['income','expense'].includes(type)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T00:00:00Z').getTime())||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date||!description||description.length>140||!amountCents)return alert('راجع نوع العملية والتاريخ والوصف والمبلغ.');
 const rawMerchant=get('rkAMerchant'),suggestedMerchant=rkMerchantEnglishFromText(description)||'';
 const merchant=type==='expense'?(rawMerchant||suggestedMerchant):'';
 if(merchant&&(!/^[A-Za-z][A-Za-z0-9 &'.,-]{2,71}$/.test(merchant)||merchant.length>72))return alert('اسم المحل الإنجليزي غير صالح. صححه أو اتركه فارغًا.');
 const impact=type==='expense'?rkActionExpected({date,amount:get('rkAAmount'),category}):null;
 if(type==='expense'&&!impact)return alert('اختر بندًا صحيحًا للمصروف.');
 const tx={id:rid(),date,description,type,category:type==='expense'?category:'',amount:amountCents,
  ...(merchant?{merchantEnglish:merchant,merchantSource:rawMerchant?'USER_CONFIRMED':'DESCRIPTION_SUGGESTION'}:{}),
  workflowSource:'ONE_ACTION_LOCAL',recordedAt:new Date().toISOString()};
 if(duplicate(tx))return alert('عملية مماثلة مسجلة بالفعل. راجع سجل المعاملات قبل الإضافة.');
 const previous=JSON.stringify(db);
 let c=null;
 try{
  db.transactions.push(tx);
  if(type==='expense')c=rkActionStoreFollowup(tx,impact,Boolean(document.getElementById('rkAFollow')?.checked));
  audit('إجراء مالي مترابط',type+' '+tx.id+(c?' متابعة '+c.id:''));
  save();
 }catch(e){db=JSON.parse(previous);alert('تعذر حفظ العملية؛ لم تُعتمد التغييرات.');return}
 render();rkActionReceipt(tx.id,c?.id||'');
}

function rkOperationCaseSave(id){

 const valid=c.kind==='INVESTMENT'?['MONITORING','BLOCKED','CHECKIN']:['MONITORING','BLOCKED','VERIFIED'];
 if(!valid.includes(state)||!owner||!note||!/^\d{4}-\d{2}-\d{2}$/.test(next))return alert('حدد المسؤول ونتيجة المراجعة وتاريخ المتابعة.');

 c.status=state==='CHECKIN'?'MONITORING':state;

 if(state==='CHECKIN')c.reviews=Number(c.reviews||0)+1;
 c.events.push({date:new Date().toISOString(),status:state,note});
 audit('متابعة عملية',c.title+' — '+state);save();closeModal();navigate('spending');

}
