/* Consolidate aggregate KPI panels into the home page while retaining actionable
   record-level figures and all original page routes. */
const rkKpiPanelClasses=new Set(['rk-assets-summary','rk-malaa-hero','rk-goal-overview','rk-slim-summary']);
function rkIsKpiPanel(className){
 const names=String(className||'').trim().split(/\s+/);
 return (names.includes('grid')&&names.includes('stats'))||names.some(x=>rkKpiPanelClasses.has(x));
}
function rkSplitKpiPanels(source){
 const html=String(source||''),blocks=[],ranges=[];
 const open=/<(div|section)\b[^>]*\bclass="([^"]*)"[^>]*>/gi;
 let match;
 while((match=open.exec(html))){
  if(!rkIsKpiPanel(match[2]))continue;
  const tag=match[1].toLowerCase();
  const tags=new RegExp('<(/?)'+tag+'\\b[^>]*>','gi');
  tags.lastIndex=open.lastIndex;
  let depth=1,end=-1,token;
  while((token=tags.exec(html))){
   if(token[1]==='/')depth--;
   else if(!/\/\s*>$/.test(token[0]))depth++;
   if(depth===0){end=tags.lastIndex;break;}
  }
  if(end<0)continue;
  blocks.push(html.slice(match.index,end));
  ranges.push([match.index,end]);
  open.lastIndex=end;
 }
 let cursor=0,remaining='';
 for(const [start,end] of ranges){remaining+=html.slice(cursor,start);cursor=end;}
 remaining+=html.slice(cursor);
 return {remaining,blocks};
}

/* Standalone analytical indicator sections are statistics too, not action data. */
function rkSplitTitledIndicators(source){
 const html=String(source||''),ranges=[],blocks=[];
 const heading=/<div class="sectiontitle">\s*<h2>(?:المؤشرات|التزامات غير نقدية ومؤشرات تخطيطية)<\/h2>[\s\S]*?<\/div>\s*<section class="card">/gi;
 let match;
 while((match=heading.exec(html))){
  const tags=/<\/?section\b[^>]*>/gi;
  tags.lastIndex=heading.lastIndex;
  let depth=1,last=-1,token;
  while((token=tags.exec(html))){
   if(/^<\//.test(token[0]))depth--;
   else depth++;
   if(depth===0){last=tags.lastIndex;break;}
  }
  if(last<0)continue;
  ranges.push([match.index,last]);
  blocks.push(html.slice(match.index,last));
  heading.lastIndex=last;
 }
 let remaining='',start=0;
 for(const [begin,end] of ranges){remaining+=html.slice(start,begin);start=end;}
 return {remaining:remaining+html.slice(start),blocks};
}


/* V20 — Only the six decision-useful totals are shown on the home page.
   Other pages retain actual ledger, portfolio, and operation details. */
function rkHomeExecutiveSnapshot(){
 const selected=/^\d{4}-\d{2}$/.test(month)?month:iso(today).slice(0,7);
 const [year,monthNumber]=selected.split('-').map(Number);
 const months=Array.from({length:6},(_,i)=>new Date(Date.UTC(year,monthNumber-1-5+i,1)).toISOString().slice(0,7));
 const totals=new Map(months.map(period=>[period,{period,income:0,expense:0}]));
 const categories=new Map();
 for(const tx of db.transactions||[]){
  const period=String(tx.date||'').slice(0,7),amount=Number(tx.amount||0);
  if(!Number.isSafeInteger(amount)||amount<0)continue;
  const row=totals.get(period);
  if(row&&(tx.type==='expense'||tx.type==='income'))row[tx.type]+=amount;
  if(period===selected&&tx.type==='expense'){
   const label=db.categories.find(c=>c.id===tx.category)?.name||'غير مصنف';
   categories.set(label,(categories.get(label)||0)+amount);
  }
 }
 for(const row of totals.values()){
  if(db.salaryMonths.includes(row.period))row.income+=Math.max(0,Number(db.salary)||0);
 }
 const monthly=totals.get(selected)||{
  period:selected,
  income:(db.salaryMonths.includes(selected)?Number(db.salary)||0:0),
  expense:0,
 };
 const savings=(db.savings||[]).reduce((sum,item)=>sum+Math.max(0,Number(item.balance)||0),0);
 const priced=(db.holdings||[]).filter(h=>rkHoldingHasPrice(h));
 const investments=priced.reduce((sum,h)=>sum+Math.max(0,rkHoldingMarket(h)),0);
 const unpriced=(db.holdings||[]).length-priced.length;
 const debt=(db.debts||[]).reduce((sum,d)=>sum+Math.max(0,(Number(d.principal)||0)-(Number(d.paid)||0)),0);
 const merchantCases=(db.merchantFollowups||[]).filter(c=>c.status!=='VERIFIED').length;
 const operationCases=(db.operationFollowups||[]).filter(c=>c.status!=='VERIFIED').length;
 const sorted=[...categories].filter(([,amount])=>amount>0).sort((a,b)=>b[1]-a[1]);
 const top=sorted.slice(0,5).map(([name,amount])=>({name,amount}));
 const remainder=sorted.slice(5).reduce((sum,[,amount])=>sum+amount,0);
 if(remainder>0)top.push({name:'بقية البنود',amount:remainder});
 return {
  period:selected,income:monthly.income,expenses:monthly.expense,
  net:monthly.income-monthly.expense,savings,investments,unpriced,debt,
  openCases:merchantCases+operationCases,
  months:[...totals.values()],
  categories:top,
 };
}

 function prepareFilters(){

   group.dataset.rkV18Filter='1';group.dataset.rkV18HiddenFilter='1';

 function streamlineDialog(modal){
  if(!modal||modal.dataset.rkV18Cleaned)return;
  modal.dataset.rkV18Cleaned='1';
  modal.classList.add('rk-v18-streamlined');
  modal.querySelectorAll(':scope > .notice,:scope > p.notice').forEach(n=>n.remove());
 }
 function paginateForm(modal){
  if(!modal||modal.dataset.rkV18Wizard||modal.querySelector('.v8-wizard-host,.wiz-head'))return;
  const form=modal.querySelector('form');
  if(!form)return;
  const grid=form.querySelector(':scope > .formgrid');
  if(!grid)return;
  const fields=[...grid.children].filter(e=>e.classList.contains('field'));
  if(fields.length<5)return;
  const actions=form.querySelector(':scope > .rk-budget-detail-actions,:scope > .actions,:scope > .v3footer');
  if(!actions)return;
  modal.dataset.rkV18Wizard='1';
  form.noValidate=true;
  const actionFlow=modal.classList.contains('rk-work-action-form');
  const groups=actionFlow?
   [fields.filter(e=>['rkAType','rkADate','rkADesc'].includes(e.querySelector('input,select,textarea')?.id)),
    fields.filter(e=>['rkAAmount','rkACategory','rkAMerchant'].includes(e.querySelector('input,select,textarea')?.id)),
    fields.filter(e=>!['rkAType','rkADate','rkADesc','rkAAmount','rkACategory','rkAMerchant'].includes(e.querySelector('input,select,textarea')?.id))]:
   [fields.slice(0,Math.ceil(fields.length/2)),fields.slice(Math.ceil(fields.length/2))];
  const labels=actionFlow?['العملية','المبلغ والتصنيف','المراجعة']:['البيانات الأساسية','التفاصيل'];
  const shell=document.createElement('div');shell.className='rk-v18-entry-wizard';
  grid.before(shell);
  const steps=[];
  groups.forEach((nodes,i)=>{
   if(!nodes.length)return;
   const step=document.createElement('section');step.className='rk-v18-step';step.setAttribute('aria-label',labels[i]);
   const heading=document.createElement('h3');heading.className='rk-v18-entry-step-title';heading.textContent=labels[i];step.append(heading);
   const body=document.createElement('div');body.className='formgrid';nodes.forEach(node=>body.append(node));step.append(body);shell.append(step);steps.push(step);
  });
  const preview=form.querySelector('#rkAPreview');
  if(preview&&steps.length)steps[steps.length-1].append(preview);
  if(!steps.length)return;
  grid.remove();
  const nav=document.createElement('div');nav.className='rk-v18-entry-nav';
  const prev=control('الصفحة السابقة','prev',()=>change(-1));
  const next=control('الصفحة التالية','next',()=>change(1));
  prev.insertAdjacentHTML('beforeend','<span>السابق</span>');
  next.insertAdjacentHTML('beforeend','<span>التالي</span>');
  const count=document.createElement('span');count.className='rk-v18-entry-index';count.setAttribute('aria-live','polite');
  const mainSave=actions.querySelector('button[type="submit"],input[type="submit"]');
  if(mainSave){
   nav.classList.add('rk-v22-balanced-entry');
   shell.prepend(count);
   nav.append(next,mainSave,prev);
   actions.before(nav);
   steps[steps.length-1].append(actions);
  }else nav.append(next,count,prev);
  if(!mainSave)actions.before(nav);
  actions.classList.add('rk-v18-entry-actions');
  let index=0;
  function validStep(step){
   for(const field of step.querySelectorAll('input,select,textarea')){
    if(field.disabled||field.type==='hidden')continue;
    const hiddenAncestor=field.closest('[hidden]');
    if(hiddenAncestor&&hiddenAncestor!==step)continue;
    if(!field.checkValidity()){
     const failedIndex=steps.indexOf(step);
     if(failedIndex!==index){index=failedIndex;renderSteps();}
     field.reportValidity();return false;
    }
   }
   return true;
  }
  function renderSteps(){
   steps.forEach((step,i)=>step.hidden=i!==index);
   count.textContent=(index+1)+' / '+steps.length;
   prev.disabled=index===0;
   next.disabled=index===steps.length-1;
   if(mainSave)mainSave.disabled=index!==steps.length-1;
   actions.hidden=index!==steps.length-1 || actions.children.length===0;
   const field=steps[index].querySelector('input:not([type="hidden"]),select,textarea');
   if(field)field.focus({preventScroll:true});
  }
  function change(delta){
   if(delta>0&&!validStep(steps[index]))return;
   index=Math.min(steps.length-1,Math.max(0,index+delta));renderSteps();
  }
  form.addEventListener('submit',e=>{
   for(let i=0;i<steps.length;i++){
    if(!validStep(steps[i])){
      e.preventDefault();e.stopImmediatePropagation();return;
    }
   }
  },true);
  renderSteps();
 }
 let scheduled=false;
 function apply(){
  scheduled=false;
  if(!document.getElementById('view'))return;
  prepareFilters();
  const modal=document.querySelector('#modalRoot .modal');
  if(modal){streamlineDialog(modal);paginateForm(modal);}
  else if(activeFilter&&!activeFilter.isConnected)activeFilter=null;
 }
 const obs=new MutationObserver(()=>{if(scheduled)return;scheduled=true;queueMicrotask(apply);});
 obs.observe(document.body,{childList:true,subtree:true});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeFilter){e.preventDefault();closeFilter();}});
 apply();
})();

/* Rakaez V18 unified: assets category filter and paged opportunity flow. */
(function(){
 const root=document.getElementById('modalRoot');
 const view=document.getElementById('view');
 if(!root||!view)return;
 const v18Icon=(name)=>typeof ico==='function'?ico(name):'';
 const element=(tag,className,txt)=>{
  const e=document.createElement(tag);
  if(className)e.className=className;
  if(txt!=null)e.textContent=txt;
  return e;
 };
 function closeFilter(){closeModal();}
 function showFilter(title,options,current,apply){
  const backdrop=element('div','modalbg');
  const modal=element('div','modal rk-v18-filter-modal');
  modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
  const head=element('div','modalhead');
  const heading=element('h2','',title);
  const exit=element('button','btn');exit.type='button';exit.setAttribute('aria-label','إغلاق الفلتر');exit.title='إغلاق';exit.innerHTML=v18Icon('close');exit.onclick=closeFilter;
  head.append(heading,exit);
  const body=element('div','rk-v18-filter-content');
  const radios=[];
  for(const option of options){
   const label=element('label','rk-v18-filter-option');
   const input=element('input');input.type='radio';input.name='rkV18Filter';input.value=option.value;
   input.checked=String(option.value)===String(current);
   radios.push(input);
   const span=element('span','',option.label);
   label.append(input,span);body.appendChild(label);
  }
  if(!radios.some(x=>x.checked)&&radios[0])radios[0].checked=true;
  const foot=element('div','rk-v18-filter-footer');
  const cancel=element('button','btn');cancel.type='button';cancel.setAttribute('aria-label','إلغاء');cancel.title='إلغاء';cancel.innerHTML=v18Icon('close');cancel.onclick=closeFilter;
  const submit=element('button','btn primary');submit.type='button';submit.setAttribute('aria-label','تطبيق الفلتر');submit.title='تطبيق الفلتر';submit.innerHTML=v18Icon('check');
  submit.onclick=()=>{const choice=radios.find(x=>x.checked);apply(choice?choice.value:current);closeFilter()};
  foot.append(cancel,submit);modal.append(head,body,foot);backdrop.appendChild(modal);
  backdrop.onclick=e=>{if(e.target===backdrop)closeFilter()};
  root.replaceChildren(backdrop);
 }
 function filterButton(target,title,handler){

  btn.onclick=handler;target.appendChild(btn);

 function enhanceFilters(){

 }
 function enhanceCandidateWizard(){
  const modal=root.querySelector('.rk-candidate-form-modal');
  if(!modal||modal.dataset.r18Wizard)return;
  const form=modal.querySelector('form');
  const content=modal.querySelector('.rk-candidate-fields');
  const grid=content?.querySelector('.rk-candidate-field-grid');
  const previousFooter=form?.querySelector('.rk-compact-footer');
  if(!form||!content||!grid||!previousFooter)return;
  modal.dataset.r18Wizard='1';form.noValidate=true;
  const children=[...grid.children];
  const includes=(el,id)=>!!el.querySelector('[id="'+id+'"]');
  const pick=(ids)=>children.filter(el=>ids.some(id=>includes(el,id)));
  const group1=pick(['rkCandidateName','rkCandidateCategory','rkCandidateRisk','rkCandidateManager']);
  const group2=pick(['rkCandidateDays','rkCandidateReturn','rkCandidateFees','rkCandidateMin']);
  const used=new Set([...group1,...group2]);
  const group3=children.filter(el=>!used.has(el));
  const objective=content.querySelector('#rkCandidateObjective')?.closest('.field');
  const allocation=content.querySelector('.rk-candidate-allocation-edit');
  const notes=content.querySelector('#rkCandidateNotes')?.closest('.field');
  [objective,allocation,notes].forEach(node=>{if(node)group3.push(node)});
  const pages=[
   {title:'الأساسية',fields:group1},
   {title:'المالية',fields:group2},
   {title:'التفاصيل',fields:group3},
   {title:'المراجعة',fields:[]}
  ];
  const wizard=element('div','rk-v18-wizard');
  const nav=element('div','rk-v18-steps');
  const panels=element('div','rk-v18-panels');
  const links=[],contents=[];
  pages.forEach((page,i)=>{
   const tab=element('button','rk-v18-step-nav');
   tab.type='button';tab.setAttribute('aria-label','الانتقال إلى '+page.title);tab.title=page.title;
   tab.innerHTML='<b class="rk-v20-step-number">'+(i+1)+'</b><span class="rk-v20-step-label">'+page.title+'</span>';tab.dataset.rkV17Enhanced='1';nav.append(tab);links.push(tab);
   const panel=element('section','rk-v18-step-panel');panel.setAttribute('aria-label',page.title);
   panel.appendChild(element('h3','rk-v18-panel-heading',page.title));
   const inner=element('div',i===3?'rk-v18-review':'rk-v18-fields');
   page.fields.forEach(node=>inner.append(node));panel.append(inner);panels.append(panel);contents.push(panel);
   tab.onclick=()=>go(i);
  });
  grid.remove();wizard.append(nav,panels);content.prepend(wizard);
  const actions=element('div','rk-v18-wizard-actions');
  const back=element('button','btn');back.type='button';back.title='السابق';back.setAttribute('aria-label','السابق');back.innerHTML=v18Icon('prev')+'<span>السابق</span>';
  const next=element('button','btn primary');next.type='button';next.title='التالي';next.setAttribute('aria-label','التالي');next.innerHTML='<span>التالي</span>'+v18Icon('forward');
  const save=previousFooter.querySelector('button[type="submit"]');
  if(save){save.dataset.r18Save='1';save.title='حفظ الفرصة';save.setAttribute('aria-label','حفظ الفرصة');}
  const details=previousFooter.querySelector('button[type="button"]');
  back.onclick=()=>go(Math.max(0,index-1));
  next.onclick=()=>go(Math.min(3,index+1));
  actions.classList.add('rk-v22-wizard-actions');
  if(details){details.title='العودة إلى التفاصيل';details.setAttribute('aria-label','العودة إلى التفاصيل');details.classList.add('rk-v22-related-action');contents[3].append(details);}
  actions.append(next);
  if(save)actions.append(save);
  actions.append(back);
  form.append(actions);previousFooter.remove();
  function updateReview(){
   const container=contents[3].querySelector('.rk-v18-review');container.replaceChildren();
   const items=[
    ['اسم الفرصة',document.getElementById('rkCandidateName')?.value],
    ['النوع',document.getElementById('rkCandidateCategory')?.value],
    ['المخاطرة',document.getElementById('rkCandidateRisk')?.value],
    ['العائد السنوي',document.getElementById('rkCandidateReturn')?.value?document.getElementById('rkCandidateReturn').value+'%':'—'],
    ['الرسوم',document.getElementById('rkCandidateFees')?.value?document.getElementById('rkCandidateFees').value+'%':'—'],
    ['المدير',document.getElementById('rkCandidateManager')?.value||'—']
   ];
   for(const [title,value] of items){
    const line=element('div','rk-v18-review-row');
    line.append(element('small','',title),element('b','',value||'—'));container.append(line);
   }
  }
  let index=0;
  function go(nextStep){
   if(nextStep>index){
    for(let i=index;i<nextStep;i++){
     const invalid=[...contents[i].querySelectorAll('input,select,textarea')].find(el=>
      !el.disabled&&el.type!=='hidden'&&(!el.closest('[hidden]')||el.closest('[hidden]')===contents[i])&&!el.checkValidity()
     );
     if(invalid){
      index=i;
      contents.forEach((panel,j)=>{panel.hidden=j!==i});
      links.forEach((tab,j)=>tab.setAttribute('aria-current',j===i?'step':'false'));
      invalid.focus({preventScroll:true});
      invalid.reportValidity();
      return;
     }
    }
   }
   index=nextStep;
   contents.forEach((section,i)=>{section.hidden=i!==index});
   links.forEach((button,i)=>button.setAttribute('aria-current',i===index?'step':'false'));
   back.disabled=index===0;
   next.disabled=index===3;
   if(save)save.disabled=index!==3;
   if(index===3)updateReview();
   const focusable=contents[index].querySelector('input:not([hidden]),select:not([hidden]),textarea:not([hidden])');
   if(focusable&&index<3)focusable.focus({preventScroll:true});
   content.scrollTop=0;
  }
  // Run native validity checks across all wizard panels, including inactive steps.
  form.addEventListener('submit',event=>{
   for(let i=0;i<contents.length;i++){
    const invalid=[...contents[i].querySelectorAll('input,select,textarea')].find(el=>
     !el.disabled&&el.type!=='hidden'&&(!el.closest('[hidden]')||el.closest('[hidden]')===contents[i])&&!el.checkValidity()
    );
    if(invalid){
     event.preventDefault();event.stopImmediatePropagation();
     index=i;go(i);
     invalid.focus({preventScroll:true});invalid.reportValidity();
     return;
    }
   }
  },true);
  go(0);
  if(typeof rkCandidateToggleFields==='function')rkCandidateToggleFields();
  if(typeof rkAllocationInputTotal==='function')rkAllocationInputTotal('rkCa');
 }
 const originalRender=render;
 render=function(){const result=originalRender.apply(this,arguments);enhanceFilters();return result};
 let queued=false;

 });
 observer.observe(root,{childList:true,subtree:true});
 enhanceFilters();enhanceCandidateWizard();
})();


/* Rakaez V18 — Hilal category, exceptional request, financing and cycle workflows.
   All persisted amounts are integer halalas except db.categories[].limit (SAR).
   Exceptional expense transactions use a dedicated category and never consume a budget item. */
const V18_EXCEPTIONAL_CATEGORY='hilal_exceptional';
let v18Tab='budgets';
function v18Ensure(){
 if(!Array.isArray(db.hilalRequests))db.hilalRequests=[];
 if(!Array.isArray(db.hilalFinancings))db.hilalFinancings=[];
 if(!Array.isArray(db.hilalPayments))db.hilalPayments=[];
 if(!Array.isArray(db.categories))db.categories=[];
 ensureCycle();
}
function v18ById(collection,id){return collection.find(x=>x.id===id)}
function v18PeriodAdd(p,offset){const [y,m]=p.split('-').map(Number);const d=new Date(y,m-1+offset,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function v18DueDate(period){const [y,m]=period.split('-').map(Number);return `${y}-${String(m).padStart(2,'0')}-${String(db.cycleDay||25).padStart(2,'0')}`}
function v18OutstandingForPeriod(period){v18Ensure();return db.hilalPayments.filter(p=>p.period===period&&p.status!=='paid'&&db.hilalFinancings.some(f=>f.id===p.financingId&&f.status==='active')).reduce((s,p)=>s+p.amount,0)}
function v18ActiveCategories(){return db.categories.filter(c=>!c.archived)}
function v18Status(s){return ({pending:'بانتظار الموافقة',approved:'معتمد',executed:'تم الصرف',rejected:'مرفوض',cancelled:'ملغى',active:'نشط',paid:'مُسدّد',due:'قادم',closed:'مغلق'})[s]||s}
function v18Tag(status){return `<span class="tag ${['rejected','cancelled'].includes(status)?'neg':['pending','due'].includes(status)?'gold':''}">${v18Status(status)}</span>`}
function v18Btn(action,label,id='',kind=''){return `<button type="button" class="btn ${kind}" data-v18-action="${action}" data-v18-id="${esc(id)}">${esc(label)}</button>`}
function v18SectionTitle(title,subtitle='',action=''){return `<div class="v18-sectionhead"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>${action}</div>`}
function v18Budgets(){
 const cats=v18ActiveCategories();
 return `${v18SectionTitle('بنود الميزانية','البنود الشهرية فقط، دون تحميل الطلبات الاستثنائية عليها',v18Btn('new-category','+ إضافة بند','','primary'))}
 ${cats.length?`<div class="v18-cardgrid">${cats.map(c=>{
 const used=spent(c.id),limit=Math.round(c.limit*100),left=limit-used,pct=limit>0?Math.round(used/limit*100):used>0?100:0;
 return `<article class="card v18-budget-card"><div class="v18-cardtop"><h3>${esc(c.name)}</h3><div class="v18-actions">${v18Btn('edit-category','تعديل',c.id)}${v18Btn('delete-category','حذف',c.id,'warn')}</div></div><div class="v18-numberrow"><div><small>المخصص</small><strong>${money(limit)}</strong></div><div><small>المصروف</small><strong>${money(used)}</strong></div><div><small>المتبقي</small><strong class="${left<0?'v18-danger':''}">${money(left)}</strong></div></div><div class="track v18-track"><div class="fill" style="width:${Math.min(100,Math.max(0,pct))}%"></div></div><small class="muted">${pct}% مستخدم من مخصص الشهر المختار</small></article>`}).join('')}</div>`:'<section class="card empty">لا توجد بنود نشطة. ابدأ بإضافة بند للميزانية.</section>'}
 ${db.categories.some(c=>c.archived)?`<section class="card"><div class="row between"><strong>البنود المؤرشفة</strong><small class="muted">تبقى بياناتها التاريخية محفوظة</small></div>${db.categories.filter(c=>c.archived).map(c=>`<div class="item"><strong>${esc(c.name)}</strong>${v18Btn('restore-category','استعادة',c.id)}</div>`).join('')}</section>`:''}
 <section class="card v18-note"><strong>فصل مالي ثابت</strong><p>الطلبات الاستثنائية لا تستهلك أي مبلغ من مخصصات البنود الشهرية حتى لو كانت من نفس نوع المصروف.</p></section>`;
}
function v18Requests(){v18Ensure();const rows=db.hilalRequests.slice().reverse();return `${v18SectionTitle('الطلبات الاستثنائية','تسجيل الاحتياجات غير المدرجة ضمن مخصصات البنود',v18Btn('new-request','+ طلب جديد','','primary'))}
 ${rows.length?`<div class="v18-cardgrid">${rows.map(r=>{

  p.status='paid';p.paidAt=new Date().toISOString();fin.status=v18Paid(fin.id)>=fin.total?'closed':'active';audit('تسجيل سداد قسط استثنائي',p.id+' — '+money(p.amount));break;
 }
 case 'cancel-finance':{
  if(!f||f.status!=='active'||v18Paid(id)>0)return alert('لا يمكن إلغاء تمويل بدأ سداده. استخدم التسوية الموثقة.');
  const req=v18ById(db.hilalRequests,f.requestId);if(req?.executedAt)return alert('لا يمكن إلغاء تمويل تم صرفه.');

  f.status='cancelled';db.hilalPayments=db.hilalPayments.filter(x=>x.financingId!==f.id);if(req){req.financeId=null;req.status='pending'}audit('إلغاء عرض تمويل غير منفّذ',f.id);break;
 }
 case 'go-cycle':navigate('cycles');return;
 default:return;
 }
 save();render();toast('تم تنفيذ الإجراء');
