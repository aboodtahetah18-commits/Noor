<style>

*{box-sizing:border-box}html,body{margin:0;max-width:100%;min-height:100%;overflow-x:hidden}body{background:var(--paper);font:14px/1.8 Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}.ico{display:inline-block;vertical-align:-4px;flex-shrink:0;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;width:19px;height:19px}.ico.lg{width:25px;height:25px}
.top{background:var(--navy);border-bottom:3px solid var(--gold);color:#fff}.topin{max-width:930px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;gap:12px}.top b{font-size:19px}.top small{font-size:11px;color:#c3ceda;display:block}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff;font-weight:700;font-size:11px;color:var(--muted)}.shell{max-width:870px;margin:auto;padding:18px 13px 70px}.hero{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 3px 12px rgba(24,42,66,.035)}.hero h1{font-size:19px;color:var(--navy);margin:0}.hero p{margin:3px 0 0;color:var(--muted);font-size:12px}.round-icon{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;width:47px;height:47px;background:var(--paper);color:var(--teal);flex:0 0 auto}.btn{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);padding:9px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:750;max-width:100%;line-height:1.5;text-align:center}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn.small{min-height:36px;padding:6px 9px;font-size:11px}.btn.weak{color:var(--muted)}.btn.block{width:100%}.btn.danger{color:var(--red);border-color:#edcad0}.btn:active{transform:translateY(1px)}

.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px rgba(24,42,66,.045)}.card-h{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:13px}.card-h h2,.card-h h3{font-size:16px;margin:0;color:var(--navy);display:flex;align-items:center;gap:7px;line-height:1.5}.card-h h3{font-size:14px}.smallmuted{font-size:11px;line-height:1.85;color:var(--muted);margin:3px 0}.note{font-size:12px;line-height:2;color:var(--muted);margin:5px 0 10px}.info{display:flex;gap:9px;align-items:flex-start;background:var(--paper);border-right:3px solid var(--blue);padding:10px 11px;border-radius:9px;font-size:11px;line-height:1.95;margin-bottom:13px}.info.warning{border-color:var(--red)}.info.good{border-color:var(--teal)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row.wrap{flex-wrap:wrap}.line{padding:13px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.money{direction:ltr;unicode-bidi:plaintext;white-space:nowrap;display:inline-block;font-variant-numeric:tabular-nums;font-weight:850}.money.pos{color:var(--teal)}.money.bad{color:var(--red)}.money.blue{color:var(--blue)}.money.neutral{color:var(--navy)}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:13px 0}.statgrid>div{text-align:center;padding:10px 5px;border-left:1px solid var(--line);min-width:0}.statgrid>div:last-child{border:0}.statgrid span{font-size:10px;color:var(--muted);display:block;line-height:1.6}.statgrid b{font-size:13px;display:block;margin-top:6px}.status{border-radius:999px;font-size:10px;font-weight:750;border:1px solid var(--line);padding:4px 9px;background:#fff;color:var(--muted);display:inline-block}.status.bad{color:var(--red);background:#fff9fa;border-color:#f0cbd0}.status.good{color:var(--teal);background:#f1fbf8;border-color:#c4e7df}.status.wait{color:var(--blue);background:#f .operation{display:grid;gap:9px;border:1px solid var(--line);border-right:4px solid var(--teal);border-radius:13px;margin:0 0 11px;padding:12px;background:#fff}.operation.badline{border-right-color:var(--red)}.operation h3{margin:0;font-size:13px;color:var(--navy)}.operation small{font-size:11px;color:var(--muted)}.opline{display:flex;justify-content:space-between;align-items:center;gap:10px}.op-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.op-actions button{width:100%;min-width:0}.summary-line{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.summary-line:last-child{border:0}.summary-line span{color:var(--muted);font-size:12px}.reviewbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0}.reviewbar button{min-width:0;min-height:48px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:750;font-size:11px;color:var(--navy);padding:8px 4px}.reviewbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.flow-step{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.flow-step:last-child{border-bottom:0}.flow-step .circle{width:35px;height:35px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--teal);flex:0 0 auto}.flow-step b{display:block;font-size:12px}.flow-step p{font-size:11px;color:var(--muted);margin:0;line-height:1.8}.notice-success{background:#f2faf8;border:1px solid #c9e5e0;color:var(--teal);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.9}.btngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.btngrid button{min-width:0;width:100%}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(16,30,49,.75);display:flex;align-items:center;justify-content:center;padding:9px}.modal{max-height:calc(100dvh - 18px);width:min(610px,100%);overflow:hidden;display:flex;flex-direction:column;border-radius:17px;border:2px solid var(--gold);background:#fff}.modalhead{background:var(--navy);border-bottom:3px solid var(--gold);display:grid;grid-template-columns:76px minmax(0,1fr) 43px;gap:8px;padding:11px;align-items:center;color:#fff}.modalhead h2{font-size:15px;text-align:center;margin:0;line-height:1.5}.modalhead .back{min-height:40px;padding:4px 5px;background:#334963;border:1px solid #8193a8;color:white;border-radius:9px;display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px}.modalhead .close{min-height:40px;min-width:40px;border:1px solid #fff;background:#fff;color:var(--navy);font-size:26px;font-weight:bold;border-radius:9px;display:grid;place-items:center}.modalbody{overflow-y:auto;padding:16px;min-height:0;flex:1}.modalfooter{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 16px;border-top:1px solid var(--line)}.modalfooter .btn{width:100%}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:11px;color:var(--navy);font-weight:700;line-height:1.8}.field input,.field select{border-radius:9px;padding:9px 10px;min-height:42px;border:1px solid var(--line);background:#fff;color:var(--navy);min-width:0;width:100%;max-width:100%;font-size:12px}.field input[type=number]{direction:ltr;text-align:right}.checkrow{display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.9;margin:12px 0;color:var(--navy)}.checkrow input{accent-color:var(--teal);margin-top:5px;flex:0 0 auto}.error{color:var(--red);font-size:11px;font-weight:700;min-height:0;line-height:1.85;margin-top:8px}.error:empty{display:none}.focus-slab{padding:12px;border:1px solid var(--line .shell{max-width:650px;padding-top:17px}.mini-status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 18px;color:var(--muted);font-size:12px}.mini-status>span{display:inline-flex;align-items:center;gap:6px}.mini-status .ico{width:16px;height:16px}.text-action{background:none;border:0;color:var(--blue);font-size:12px;font-weight:800;padding:7px 0;display:inline-flex;align-items:center;gap:6px;cursor:pointer}.text-action .ico{width:15px;height:15px}.home-intro{padding:12px 4px 21px}.home-intro h1{font-size:24px;margin:5px 0;color:var(--navy);line-height:1.4}.home-intro p{color:var(--muted);font-size:13px;margin:5px 0}.subtle-kicker{font-size:11px;font-weight:800;color:var(--teal)}.home-menu{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.journey-choice{border:0;border-bottom:1px solid var(--line);width:100%;min-width:0;background:#fff;display:flex;text-align:right;align-items:center;gap:12px;padding:20px 15px;color:var(--navy);cursor:pointer}.journey-choice:last-child{border-bottom:0}.journey-choice:active{background:var(--paper)}.choice-icon{display:grid;place-items:center;color:var(--teal);background:var(--paper);border:1px solid var(--line);border-radius:12px;width:46px;height:46px;flex:0 0 auto}.choice-text{display:grid;gap:3px;min-width:0;flex:1}.choice-text strong{font-size:15px}.choice-text small{font-size:11px;color:var(--muted)}.choice-end{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}.choice-end .ico{width:14px;height:14px}.one-liner{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:var(--muted);padding:14px 5px}.page-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.page-foot .btn{width:100%;min-width:0}.internal-head{display:grid;grid-template-columns:74px minmax(0,1fr) 46px;align-items:center;gap:8px;margin:5px 0 17px}.internal-head h1{margin:0;text-align:center;color:var(--navy);font-size:16px}.mini-back{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:10px;padding:8px 6px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;min-height:41px;white-space:nowrap}.mini-back .ico{width:16px;height:16px}.panel-simple{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.main-amount{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:17px;border-bottom:1px solid var(--line)}.main-amount>div{display:grid;gap:4px}.main-amount span{font-size:11px;color:var(--muted)}.main-amount strong{font-size:17px}.section-inline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.section-inline h2{font-size:14px;margin:0;color:var(--navy)}.transaction-line{border-bottom:1px solid var(--line);padding:13px 2px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}.transaction-line:last-child{border:0}.transaction-line small{display:block;color:var(--muted);font-size:10px}.empty-light{text-align:center;padding:25px 7px;color:var(--muted);font-size:12px}.footer-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.footer-actions button{width:100%}.review-modal{max-width:540px}.review-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 16px 0}.review-steps span{height:4px;border-radius:99px;background:var(--line)}.review-steps span.active{background:var(--teal)}.review-steps span.done{background:var(--navy)}.review-body{padding:20px 17px 24px;min-height:260px}.phase-label{font-size:11px;color:var(--muted);font-weight:750;margin-bottom:15px}.result-face{border:1px solid var(--line);border-right:4px solid var(--blue);border-radius:13px;padding:18px 15px;display:grid;gap:6px;background:var(--paper);margin-bottom:18px}.result-face.risk{border-right-color:var(--red)}.result-face.surplus{border-right-color:var(--teal)}.result-face.balanced{border-right-color:var(--blue)}.result-face>span{font-weight:800;color:var(--navy);font-size:13px}.result-face strong{font-size:27px;line-height:1.35}.result-face small{font-size:11px;color:var(--muted)}.plain-numbers{display:grid;gap:0}.plain-numbers>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:11px}.plain-numbers>div:last-child{border:0}.plain-numbers>div span{color:var(--muted)}.plain-numbers .money{font-size:12px}.light-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.light-actions .btn{min-width:0;width:100%}.vertical-actions{display:grid;gap:10px;margin-top:18px}.vertical-actions .btn{width:100%}.vertical-actions .text-action{justify-self:center}.compact-end{min-height:200px;display:grid;align-content:center;justify-items:center;text-align:center;gap:9px}.compact-end strong{font-size:17px;color:var(--navy)}.compact-end span{font-size:12px;color:var(--muted)}.end-big-icon{border:1px solid var(--line);color:var(--teal);background:var(--paper);padding:12px;border-radius:15px}.inline-warning{border-right:3px solid var(--red);padding:11px;font-size:11px;color:var(--red);margin-top:12px;background:var(--paper)}.flat-confirm{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--teal);padding:11px 0}.centred{margin:auto;display:flex;justify-content:center}.day-picker-modal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.day-picker-modal button{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:9px;min-height:43px;font-size:12px}.day-picker-modal button.active{background:var(--navy);color:#fff}.help-mini{color:var(--navy);font-size:12px;line-height:2}.modalfooter{gap:10px}.modalfooter .btn{font-size:12px}.review-modal .modalbody{overflow-y:auto}.topin small{line-height:1.5}

.surplus-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}.surplus-field-grid .focus-slab{margin:0;padding:10px;min-width:0}.surplus-field-grid .focus-slab label{display:grid;gap:6px;font-size:11px}.surplus-field-grid .focus-slab input{width:100%;max-width:100%;min-height:40px;font-size:13px}.surplus-field-grid .focus-slab label span{line-height:1.5}
@media(max-width:450px){.surplus-field-grid{grid-template-columns:minmax(0,1fr)}.surplus-field-grid .focus-slab label{display:flex;align-items:center}.surplus-field-grid .focus-slab input{width:39%;max-width:39%}}

/* توزيع الفائض التفصيلي — بالألوان والخطوط الموجودة في هوية ركائز */
.sur-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.sur-flow span{height:5px;background:var(--line);border-radius:10px}.sur-flow span.on{background:var(--teal)}
.sur-totalbar{border:1px solid var(--line);border-right:4px solid var(--teal);border-radius:13px;padding:12px;display:grid;gap:7px;margin-bottom:12px;background:var(--paper)}
.sur-totalbar .row,.sur-cathead,.sur-rowtitle,.sur-pick{display:flex;justify-content:space-between;align-items:center;gap:9px;min-width:0}
.sur-totalbar strong{font-size:19px;color:var(--teal)}.sur-totalbar small{font-size:10px;color:var(--muted)}
.sur-choices{display:grid;gap:8px}.sur-choice{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);text-align:right;display:grid;gap:5px;min-width:0;cursor:pointer}
.sur-choice .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.sur-choice b{font-size:12px;overflow-wrap:anywhere}.sur-choice small{font-size:10px;color:var(--muted)}
.sur-choice:hover,.sur-choice:focus-visible{border-color:var(--teal)}.sur-choice .pill{flex:0 0 auto}
.sur-group{border:1px solid var(--line);border-radius:13px;background:#fff;margin-bottom:10px;overflow:hidden;min-width:0}
.sur-group>summary{cursor:pointer;list-style:none;padding:12px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;color:var(--navy)}
.sur-group>summary::-webkit-details-marker{display:none}.sur-group>summary::marker{content:''}.sur-cathead b{font-size:12px}.sur-summaryright{display:grid;justify-items:end;gap:2px}.sur-summaryright strong{font-size:13px;color:var(--blue)}.sur-summaryright small{font-size:10px;color:var(--muted)}
.sur-group>summary .sur-cathead{justify-content:flex-start}.sur-group>summary .ico{width:17px;height:17px;color:var(--teal)}.sur-group>summary .arrow-mark{color:var(--muted);font-size:14px;margin-inline-start:2px}
.sur-group[open]{border-color:var(--teal)}.sur-group[open]>summary{border-bottom:1px solid var(--line);background:var(--paper)}
.sur-groupbody{display:grid;gap:10px;padding:11px;min-width:0}.sur-groupbody>.note{margin:0;color:var(--muted);font-size:10px}
.sur-target{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;display:grid;gap:9px;min-width:0}

<header class="top"><div class="topin"><div><b>ركائز</b><small>ما قبل إغلاق الدورة المالية</small></div><span style="color:#d5e0ec;font-size:11px">معاينة محلية • دون نشر</span></div></header>

<script>
'use strict';
const $=s=>document.querySelector(s);
const icon=(id,size='')=>`<svg class="ico ${size}" aria-hidden="true"><use href="#ic-${id}"></use></svg>`;
const money=(c,kind='neutral')=>`<span class="money ${kind}">${(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} ﷼</span>`;
const fmt=c=>(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const toCents=x=>{const v=String(x??'').trim();if(!/^(0|[1-9]\d*)(?:\.\d{1,2})?$/.test(v))throw Error('أدخل مبلغًا بالريال بحد أقصى منزلتين عشريتين.');const c=Math.round(Number(v)*100);if(!Number.isSafeInteger(c)||c>100000000000)throw Error('المبلغ خارج النطاق المسموح.');return c};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demoModes={
 deficit:{cash:150000,pending:0,needs:70000,dues:85000,reserve:25000,blocked:0,cats:[{name:'المطاعم والمقاهي',budget:25000,spent:31000},{name:'الوقود',budget:18000,spent:15000},{name:'المقاضي',budget:50000,spent:46500}]},
 enough:{cash:165000,pending:0,needs:65000,dues:35000,reserve:65000,blocked:0,cats:[{name:'المطاعم والمقاهي',budget:20000,spent:20000},{name:'الوقود',budget:19000,spent:19000},{name:'المقاضي',budget:53000,spent:53000}]},
 surplus:{cash:310000,pending:10000,needs:45000,dues:35000,reserve:75000,blocked:0,cats:[{name:'المطاعم والمقاهي',budget:25000,spent:22000},{name:'الوقود',budget:18000,spent:15000},{name:'المقاضي',budget:50000,spent:45500}]}
};
let state={day:25,tab:'review',mode:'surplus',data:structuredClone(demoModes.surplus),entries:[],earlyReviewed:false,closed:false,reconciled:false,loanRequests:[],plans:[],carry:0,loanTaken:false,modalSeen:false,confirmation:'',history:[], surplusPlan:null};
let modalName='';
const sampleDate=()=>`2026-11-${String(state.day).padStart(2,'0')}`;
const capture=()=>{const d=state.data;const shortfalls=d.cats.filter(c=>c.spent>c.budget).map(c=>({...c,overspend:c.spent-c.budget}));const cash=Math.max(0,d.cash);const due=d.dues;const daily=d.needs;const committed=d.blocked+d.pending;const usable=cash-committed;const essentials=due+daily;const reserve=d.reserve;const deficit=Math.max(0,essentials-usable);const free=usable-essentials-reserve;const type=deficit>0?'deficit':free>0?'surplus':'enough';return {cash,due,daily,committed,usable,essentials,reserve,free,deficit,type,shortfalls,positiveCategories:d.cats.filter(c=>c.budget>c.spent).map(c=>({...c,remaining:c.budget-c.spent}))}};
const captions={deficit:['عجز في السيولة','bad','هناك استحقاقات أو احتياجات لا تغطيها السيولة المتاحة'],enough:['الميزانية كافية','good','الضروريات مغطاة، ولا يوجد فائض آمن قابل للتوجيه'],surplus:['فائض بعد الحماية','good','يمكن تجهيز خطة توجيه الفائض دون تنفيذ تلقائي']};
const btn=(label,callback,variant='',i='')=>`<button class="btn ${variant}" onclick="${callback}">${i?icon(i):''}${label}</button>`;
function dateBtns(){return [24,25,26,27].map(n=>`<button class="${state.day===n?'active':''}" onclick="changeDay(${n})">${n} نوفمبر</button>`).join('')}
// واجهة ركائز المختصرة: صفحة أساسية ثم صفحات داخلية ونافذة مراجعة بثلاث خطوات.
state.tab='home';
state.reviewStep=0;
state.reviewOpen=false;
function shortDate(){return state.day+' نوفمبر 2026'}
function render(){
 const x=capture(),screen=state.tab;
 $('#app').innerHTML=`<div class="mini-status"><span>${icon('calendar')} ${shortDate()}</span><button class="text-action" onclick="openModal('date')">تغيير التاريخ ${icon('edit')}</button></div>
 ${screen==='home'?homeView(x):activeView(x)}
 <div class="page-foot"><button class="btn" onclick="openModal('history')">${icon('receipt')} سجل الإجراءات</button><button class="btn" onclick="openModal('help')">${icon('shield')} معلومات</button></div>`;
}
function homeView(x){
 const ready=state.day>=25;
 return `<div class="home-intro"><span class="subtle-kicker">ركائز · متابعة الدورة</span><h1>ماذا تريد أن تراجع؟</h1><p>اختر الصفحة المطلوبة</p></div>
 <section class="home-menu" aria-label="صفحات دورة الراتب">
 <button class="journey-choice" onclick="switchTab('active')"><span class="choice-icon">${icon('receipt','lg')}</span><span class="choice-text"><strong>الدورة الجارية</strong><small>المصروفات حتى يوم 27</small></span><span class="choice-end">${state.closed?'مغلقة':'مستمرة'} ${icon('arrow')}</span></button>
 <button class="journey-choice" onclick="openReview()"><span class="choice-icon">${icon('shield','lg')}</span><span class="choice-text"><strong>مراجعة ما قبل الراتب</strong><small>الحالة المالية والإجراء المناسب</small></span><span class="choice-end">${ready?'متاحة':'تبدأ يوم 25'} ${icon('arrow')}</span></button>
 </section><div class="one-liner"><span class="status ${state.closed?'good':'wait'}">${state.closed?'أُغلقت الدورة':'الدورة مفتوحة'}</span><span>الراتب القادم: 27 نوفمبر</span></div>`;
}
function activeView(x){
 const operations=state.entries.slice().reverse();
 return `<div class="internal-head"><button class="mini-back" onclick="switchTab('home')">${icon('arrow')} رجوع</button><h1>مصروفات الدورة الجارية</h1><button class="mini-back" onclick="openModal('help')" aria-label="معلومات">ⓘ</button></div>
 <section class="panel-simple"><div class="main-amount"><div><span>النقد المسجل</span><strong>${money(x.cash,'pos')}</strong></div><button class="btn primary" onclick="openModal('expense')">${icon('receipt')} تسجيل مصروف</button></div>
 <div class="section-inline"><h2>المصروفات المسجلة</h2><button class="text-action" onclick="openModal('categories')">بنود الدورة ${icon('arrow')}</button></div>
 ${operations.length?operations.map(o=>`<div class="transaction-line"><div><strong>${esc(state.data.cats[o.category]?.name||'مصروف')}</strong><small>${esc(o.date)}</small></div>${money(o.amount,'bad')}</div>`).join(''):'<div class="empty-light">لا توجد مصروفات مسجلة بعد.</div>'}
 <div class="footer-actions"><button class="btn" onclick="switchTab('home')">الرئيسية</button><button class="btn primary" onclick="openReview()">${icon('shield')} مراجعة 25</button></div></section>`;
}
function reviewStatus(x){
 if(x.deficit>0)return {name:'عجز نقدي',kind:'bad',amount:x.deficit,label:'يلزم معالجة العجز'};
 if(x.free>0)return {name:'فائض بعد الحماية',kind:'pos',amount:x.free,label:'قابل للتخطيط'};
 return {name:x.free<0?'الميزانية كافية مع نقص الحماية':'الميزانية كافية',kind:'blue',amount:Math.max(0,-x.free),label:x.free<0?'هامش الحماية غير مكتمل':'الاحتياجات مغطاة'};
}
function wizardContent(x){
 const s=reviewStatus(x);
 if(state.reviewStep===0)return `<div class="phase-label">01 · التحليل المالي</div>
  <div class="result-face ${x.deficit?'risk':x.free>0?'surplus':'balanced'}"><span>${s.name}</span><strong>${money(s.amount,s.kind)}</strong><small>${s.label}</small></div>
  <div class="plain-numbers"><div><span>المتاح بعد الحجوزات</span>${money(x.usable,x.usable<0?'bad':'pos')}</div><div><span>الاحتياجات والاستحقاقات</span>${money(x.essentials,'blue')}</div><div><span>هامش الحماية</span>${money(x.reserve,'blue')}</div></div>
  <div class="light-actions"><button class="btn" onclick="openModal('settings')">${icon('edit')} تعديل البيانات</button><button class="btn" onclick="openModal('scenarios')">${icon('repeat')} تجربة الحالات</button></div>`;
 if(state.reviewStep===1){
  if(x.deficit>0)return `<div class="phase-label">02 · معالجة العجز</div>
   <div class="result-face risk"><span>العجز الذي يحتاج معالجة</span><strong>${money(x.deficit,'bad')}</strong></div>
   <div class="plain-numbers"><div><span>مخصصات متاحة في بنود أخرى</span>${money(x.positiveCategories.reduce((a,b)=>a+b.remaining,0),'pos')}</div><div><span>بنود تجاوزت مخصصها</span><b>${x.shortfalls.length}</b></div></div>
   <div class="vertical-actions"><button class="btn primary" onclick="openModal('rebalance')">${icon('repeat')} إعادة تخصيص مبلغ</button><button class="btn" onclick="openModal('loan')">${icon('bank')} طلب تمويل عبر الهلال</button>${x.shortfalls.length?`<button class="text-action" onclick="openModal('shortfalls')">عرض البنود المتجاوزة ${icon('arrow')}</button>`:''}${state.loanRequests.length?'<div class="flat-confirm">طلب تمويل قيد الدراسة — لا يُعد نقدًا متاحًا.</div>':''}</div>`;
  if(x.free>0)return `<div class="phase-label">02 · توجيه الفائض</div>
   <div class="result-face surplus"><span>الفائض المتاح للتخطيط</span><strong>${money(x.free,'pos')}</strong></div>
   ${state.surplusPlan?`<div class="flat-confirm">${icon('check')} خطة مبدئية محفوظة بقيمة ${money(Object.values(state.surplusPlan).reduce((a,b)=>a+b,0),'blue')}</div>`:''}
   <div class="vertical-actions"><button class="btn primary" onclick="openModal('surplus')">${icon('edit')} ${state.surplusPlan?'تعديل خطة الفائض':'توزيع الفائض'}</button><button class="btn" onclick="openModal('help')">${icon('shield')} سياسة الحماية</button></div>`;
  return `<div class="phase-label">02 · اعتماد الكفاية</div>
   <div class="result-face balanced"><span>الاحتياجات مغطاة</span><strong>${money(x.essentials,'blue')}</strong></div>
   ${x.free<0?'<div class="inline-warning">الحماية غير مكتملة؛ لا يُقترح استثمار جديد.</div>':''}
   <div class="vertical-actions"><button class="btn primary" onclick="confirmEnough()">${icon('check')} توثيق الكفاية</button><button class="btn" onclick="switchToExpenses()">${icon('receipt')} متابعة المصروفات</button></div>`;
 }
 return `<div class="phase-label">03 · المتابعة والإغلاق</div>
   <div class="compact-end"><div class="end-big-icon">${icon('calendar','lg')}</div><strong>${state.day<27?'الدورة مستمرة حتى يوم 27':state.closed?'تم إغلاق الدورة':'جاهزة للمراجعة النهائية'}</strong><span>${state.day<27?'يمكنك استكمال مصروفاتك حتى نزول الراتب.':'تتم المطابقة قبل إغلاق الدورة.'}</span></div>
   ${state.day>=27?`<label class="checkrow"><input type="checkbox" id="match-box" ${state.reconciled?'checked':''} onchange="state.reconciled=this.checked"> تمت مطابقة الحسابات والسدادات</label><button class="btn primary block" onclick="openModal('close')">${icon('shield')} مراجعة الإغلاق النهائي</button>`:`<button class="btn primary block" onclick="switchToExpenses()">${icon('receipt')} متابعة المصروفات</button><button class="text-action centred" onclick="openModal('date')">تجربة يوم 27 ${icon('calendar')}</button>`}
   ${x.deficit>0?'<div class="inline-warning">لا يُغلق الشهر قبل معالجة العجز الفعلي.</div>':''}`;
}
function openReview(){state.reviewOpen=true;state.reviewStep=0;renderReviewWizard()}
function closeReview(){state.reviewOpen=false;modalName='';$('#modal-root').innerHTML='';render()}
function wizardStepTo(n){state.reviewStep=Math.max(0,Math.min(2,n));renderReviewWizard()}
function switchToExpenses(){closeReview();switchTab('active')}
function confirmEnough(){if(!state.earlyReviewed){state.earlyReviewed=true;state.history.push('تمت مراجعة كفاية الميزانية دون تعديل الأرصدة')}renderReviewWizard()}
function renderReviewWizard(){
 modalName='review-wizard';const x=capture();const step=state.reviewStep;
 const title=['التحليل المالي','معالجة الحالة','المتابعة والإغلاق'][step];
 $('#modal-root').innerHTML=`<div class="overlay" role="presentation"><section class="modal review-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modalhead"><button class="back" onclick="${step?'wizardStepTo('+(step-1)+')':'closeReview()'}">${icon('arrow')} رجوع</button><h2 id="modal-title">${title}</h2><button class="close" aria-label="إغلاق" onclick="closeReview()">×</button></div>
  <div class="review-steps"><span class="${step===0?'active':step>0?'done':''}"></span><span class="${step===1?'active':step>1?'done':''}"></span><span class="${step===2?'active':''}"></span></div>
  <div class="modalbody review-body">${wizardContent(x)}</div>
  <footer class="modalfooter"><button class="btn" onclick="${step?'wizardStepTo('+(step-1)+')':'closeReview()'}">${step?'السابق':'إغلاق'}</button><button class="btn primary" onclick="${step<2?'wizardStepTo('+(step+1)+')':state.day<27?'switchToExpenses()':"openModal('close')"}">${step===0?'متابعة الإجراء':step===1?'التالي':state.day<27?'متابعة الدورة':'الإغلاق النهائي'} ${icon('arrow')}</button></footer>
  </section></div>`;
}
function autoSurplusPlan(x){let free=Math.max(0,x.free);const outstandingReserve=Math.max(0,120000-75000);const preferredGoal=25000,flexDebt=35000,preferredSaving=30000;const e=Math.min(outstandingReserve,free);free-=e;const debt=Math.min(flexDebt,free);free-=debt;const goal=Math.min(preferredGoal,free);free-=goal;const savings=Math.min(preferredSaving,free);free-=savings;return {reserve:e,flexDebt:debt,goals:goal,savings,investment:0,carry:free}}

const surplusSections=[
 {id:'reserve',name:'ملاءة — الاحتياطي',short:'حماية السيولة',desc:'صناديق الحماية والأمان',icon:'shield'},
 {id:'flexDebt',name:'الهلال — الدين أو الأمان المرن',short:'ديون أو أمان',desc:'ديون مرنة مسجلة أو احتياطي مرن دون دين',icon:'bank'},
 {id:'goals',name:'ملاءة — الأهداف',short:'الأهداف المالية',desc:'توزيع المبلغ على الأهداف المستهدفة',icon:'target'},
 {id:'savings',name:'ملاءة — الادخار',short:'محافظ الادخار',desc:'اختيار وعاء الادخار المستهدف',icon:'wallet'},
 {id:'investment',name:'الأصول — دراسة الاستثمار',short:'الاستثمار والدراسة',desc:'وجهة الدراسة دون تنفيذ شراء',icon:'up'},
 {id:'carry',name:'الهلال — الترحيل',short:'ترحيل الرصيد',desc:'المبلغ المتروك للدورة التالية',icon:'calendar'}
];
let surplusWizard=null;
function emptySurplusTargets(){return {
 reserve:[{id:'emergency',name:'صندوق الطوارئ · مثال',amount:30000,kind:'reserve'},
  {id:'liquid',name:'احتياطي السيولة · مثال',amount:15000,kind:'reserve'}],
 flexDebt:[{id:'flex-buffer',name:'احتياطي مرن دون دين فعلي',amount:35000,kind:'buffer'}],
 goals:[{id:'trip',name:'هدف السفر · مثال',amount:10000,kind:'goal'},
  {id:'education',name:'هدف التعليم · مثال',amount:15000,kind:'goal'}],
 savings:[{id:'short-saver',name:'ادخار قصير المدى · مثال',amount:10000,kind:'saving'},
  {id:'general-saver',name:'ادخار عام · مثال',amount:20000,kind:'saving'}],
 investment:[{id:'research',name:'مبلغ قيد الدراسة · لا شراء',amount:0,kind:'study'},
  {id:'portfolio',name:'محفظة صناديق · مثال',amount:0,kind:'portfolio'}],
 carry:[{id:'next-cycle',name:'رصيد مرحّل إلى الدورة القادمة',amount:10000,kind:'carry'}]
}}
function surTotals(){return Object.fromEntries(surplusSections.map(g=>[g.id,
 surplusWizard.targets[g.id].reduce((sum,r)=>sum+r.amount,0)]))}
function surTotal(){return Object.values(surTotals()).reduce((sum,n)=>sum+n,0)}
function surFree(){return Math.max(0,capture().free)}
function surPct(c){const free=surFree();return free?((c/free)*100).toFixed(2):'0.00'}
function initializeSurplus(){
 const free=surFree();let targets;
 if(state.surplusDetailPlan&&state.surplusDetailPlan.available===free){
  targets=structuredClone(state.surplusDetailPlan.targets);
 }else{targets=emptySurplusTargets();const expected=surTotalSeed(targets);
  // اختلاف المبلغ المتاح عن مثال ١٤٥٠ يعاد توزيعه ضمن الترحيل، دون إنشاء ديون.
  if(free!==expected){let excess=expected-free;
    for(const cat of ['carry','investment','flexDebt','savings','goals','reserve']){
     for(const row of [...targets[cat]].reverse()){
      if(excess>0){const take=Math.min(excess,row.amount);row.amount-=take;excess-=take}
     }
    }
    const actual=surTotalSeed(targets);
    if(actual<free)targets.carry[0].amount+=free-actual;
  }
 }
 surplusWizard={step:0,targets,openCat:'reserve',invalid:false,error:'',editing:null,risk:false,approved:false};
}
function surTotalSeed(groups){return Object.values(groups).flat().reduce((a,r)=>a+r.amount,0)}
function startSurplusWizard(){initializeSurplus();modalName='surplus';renderSurplusWizard()}
function surJump(id){if(!surplusWizard)return;surplusWizard.step=1;surplusWizard.openCat=id;renderSurplusWizard()}
function surBack(){if(!surplusWizard)return;surplusWizard.error='';if(surplusWizard.editing){surplusWizard.editing=null;renderSurplusWizard();return}if(surplusWizard.step>0){surplusWizard.step--;renderSurplusWizard()}else closeModal()}
function surForward(){
 try{
  if(surplusWizard.invalid)throw Error('راجع المبالغ المدخلة أولًا.');
  if(surTotal()>surFree())throw Error('إجمالي التوزيع يتجاوز الفائض المتاح؛ خفّض أحد المخصصات.');
  if(surplusWizard.step===1&&surTotal()<surFree())throw Error('بقي مبلغ غير موجّه. يمكنك ترحيله للدورة القادمة.');
  if(surplusWizard.step===2)return surSavePlan();
  surplusWizard.step++;surplusWizard.error='';renderSurplusWizard();
 }catch(e){surplusWizard.error=e.message;surStatus()}
}
function surAddRemaining(){
 const left=surFree()-surTotal();if(left<0){surplusWizard.error='خطة التوزيع تتجاوز الفائض المتاح.';surStatus();return}
 if(!surplusWizard.targets.carry.length)surplusWizard.targets.carry.push({id:'next-cycle',name:'رصيد مرحّل إلى الدورة القادمة',amount:0,kind:'carry'});
 surplusWizard.targets.carry[0].amount+=left;surplusWizard.invalid=false;surplusWizard.error='';renderSurplusWizard();
}
function surRow(cat,id){return surplusWizard.targets[cat].find(r=>r.id===id)}
function surplusInput(event){
 const el=event.target;if(!el.matches('[data-sur-cat][data-sur-row][data-sur-kind]')||!surplusWizard)return;
 const cat=el.dataset.surCat,row=surRow(cat,el.dataset.surRow);
 if(!row)return;
 const raw=el.value.trim(),kind=el.dataset.surKind;
 let cents;
 try{
  if(kind==='amount')cents=toCents(raw);
  else {if(!/^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/.test(raw))throw Error();const percentage=Number(raw);if(percentage>100)throw Error();cents=Math.round(surFree()*percentage/100)}
  if(row.kind==='debt'&&row.remaining!=null&&cents>row.remaining)throw Error('مبلغ الدين يتجاوز المتبقي منه.');
  row.amount=cents;surplusWizard.invalid=false;surplusWizard.error='';
  const sibling=document.querySelector(`[data-sur-cat="${cat}"][data-sur-row="${row.id}"][data-sur-kind="${kind==='amount'?'percent':'amount'}"]`);
  if(sibling)sibling.value=kind==='amount'?surPct(cents):fmt(cents);
  updateSurplusUI();
 }catch(e){surplusWizard.invalid=true;surplusWizard.error=e.message||'المبلغ أو النسبة غير صالح.';surStatus()}
}
function updateSurplusUI(){
 const total=surTotal(),free=surFree();
 for(const g of surplusSections){
  const num=surplusWizard.targets[g.id].reduce((sum,r)=>sum+r.amount,0);
  const amountEl=document.getElementById('sur-sum-'+g.id),pct=document.getElementById('sur-pct-'+g.id);
  if(amountEl)amountEl.textContent=fmt(num)+' ﷼';if(pct)pct.textContent=surPct(num)+'%';
 }
 const t=document.getElementById('sur-total-detail'),r=document.getElementById('sur-left-detail');
 if(t)t.textContent=fmt(total)+' ﷼';if(r){r.textContent=fmt(free-total)+' ﷼';r.style.color=total>free?'var(--red)':'var(--teal)'}
 surStatus();
}
function surStatus(){const el=document.getElementById('sur-msg');if(el)el.textContent=surplusWizard?.error||''}
function surRemove(cat,id){if(cat==='carry'&&surplusWizard.targets.carry.length===1)return;
 surplusWizard.targets[cat]=surplusWizard.targets[cat].filter(r=>r.id!==id);
 renderSurplusWizard()}
function surDemoDebt(){
 const rows=surplusWizard.targets.flexDebt;
 if(rows.some(r=>r.kind==='debt'))return;
 rows.push({id:'demo-debt-1',name:'سلفة مرنة · مثال غير حقيقي',amount:0,remaining:60000,kind:'debt'},
  {id:'demo-debt-2',name:'دين غير مجدول · مثال غير حقيقي',amount:0,remaining:40000,kind:'debt'});
 surplusWizard.openCat='flexDebt';renderSurplusWizard();
}
function surNewTarget(cat){surplusWizard.editing=cat;renderSurplusWizard()}
function surSaveTarget(){
 const name=document.getElementById('sur-new-name')?.value.trim(),cat=surplusWizard.editing;
 if(!name||name.length<2||name.length>80){surplusWizard.error='اكتب اسمًا واضحًا من حرفين إلى 80 حرفًا.';surStatus();return}
 surplusWizard.targets[cat].push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,amount:0,
  kind:cat==='flexDebt'?'buffer':cat==='investment'?'study':cat});
 surplusWizard.editing=null;surplusWizard.openCat=cat;surplusWizard.error='';renderSurplusWizard();
}
function surChoice(g){const amount=surplusWizard.targets[g.id].reduce((s,r)=>s+r.amount,0);
 return `<button type="button" class="sur-choice" onclick="surJump('${g.id}')"><span class="row"><b>${icon(g.icon)} ${esc(g.name)}</b><span class="pill">${surPct(amount)}%</span></span><span class="row"><small>${esc(g.desc)}</small>${money(amount,'blue')}</span></button>`}
function surOneRow(g,r){return `<div class="sur-target"><div class="sur-rowtitle"><div><b>${esc(r.name)}</b>${r.kind==='debt'?`<small>المتبقي من الدين في المثال: ${fmt(r.remaining)} ﷼</small>`:''}${r.kind==='buffer'?'<small>ليس دينًا ولا سدادًا فعليًا</small>':''}${r.kind==='study'?'<small>للدراسة فقط؛ لا شراء ولا تحويل</small>':''}</div><button type="button" class="btn small danger" onclick="surRemove('${g.id}','${r.id}')" ${g.id==='carry'&&surplusWizard.targets.carry.length===1?'disabled':''}>حذف</button></div><div class="sur-targetinputs"><label>المبلغ (ريال)<input aria-label="مبلغ ${esc(r.name)}" type="number" min="0" step="0.01" value="${fmt(r.amount)}" data-sur-cat="${g.id}" data-sur-row="${r.id}" data-sur-kind="amount"></label><label>النسبة من الفائض (%)<input aria-label="نسبة ${esc(r.name)}" type="number" min="0" max="100" step="0.01" value="${surPct(r.amount)}" data-sur-cat="${g.id}" data-sur-row="${r.id}" data-sur-kind="percent"></label></div></div>`}
function surGroupToggle(id,el){if(!el.open)return;surplusWizard.openCat=id;document.querySelectorAll('.sur-group').forEach(node=>{if(node!==el)node.open=false})}
function surOneGroup(g){const rows=surplusWizard.targets[g.id],amount=rows.reduce((s,r)=>s+r.amount,0);return `<details class="sur-group" ${surplusWizard.openCat===g.id?'open':''} ontoggle="surGroupToggle('${g.id}',this)"><summary><span class="sur-cathead">${icon(g.icon)} <span><b>${esc(g.name)}</b><small class="sur-purpose">${rows.length} وجهة · اضغط للتفاصيل</small></span></span><span class="sur-summaryright"><strong id="sur-sum-${g.id}">${fmt(amount)} ﷼</strong><small><span id="sur-pct-${g.id}">${surPct(amount)}%</span> <span class="arrow-mark">⌄</span></small></span></summary><div class="sur-groupbody">${rows.map(r=>surOneRow(g,r)).join('')||'<div class="sur-disclaimer">لا توجد عناصر مسجلة لهذا القسم.</div>'}${g.id==='flexDebt'?`<p class="sur-disclaimer">الديون الفعلية تؤخذ من سجل الهلال. المبلغ المرن دون دين يبقى احتياطيًا تخطيطيًا.</p><button class="btn block" onclick="surDemoDebt()">${icon('bank')} تجربة قائمة ديون مرنة توضيحية</button>`:''}<button class="btn block" onclick="surNewTarget('${g.id}')">${icon('edit')} إضافة وجهة تخطيطية</button></div></details>`}
function surCompactTotals(){return `<div class="sur-totalbar"><div class="row"><small>الفائض المتاح بعد الحماية</small><strong>${fmt(surFree())} ﷼</strong></div><div class="row"><span class="sur-purpose">الموزع</span><b class="money blue" id="sur-total-detail">${fmt(surTotal())} ﷼</b></div><div class="row"><span class="sur-purpose">المتبقي دون توجيه</span><b class="money pos" id="sur-left-detail">${fmt(surFree()-surTotal())} ﷼</b></div></div>`}
function surReviewRows(){return surplusSections.map(g=>{
 const rows=surplusWizard.targets[g.id].filter(r=>r.amount>0);const total=rows.reduce((s,r)=>s+r.amount,0);
 if(!total)return '';
 return `<div class="sur-group" style="padding:11px"><div class="sur-pick"><strong>${icon(g.icon)} ${esc(g.name)}</strong>${money(total,'blue')}</div>${rows.map(r=>`<div class="summary-line"><span>${esc(r.name)} · ${surPct(r.amount)}%</span><b>${money(r.amount,'blue')}</b></div>`).join('')}</div>`
 }).join('')}
function surSavePlan(){
 const x=capture();if(surplusWizard.invalid||surTotal()!==x.free){surplusWizard.error='يجب توزيع كامل الفائض دون تجاوز قبل اعتماد الخطة.';surStatus();return}
 if(surplusWizard.targets.investment.some(r=>r.amount>0)&&!document.getElementById('sur-confirm-risk')?.checked){surplusWizard.error='راجع مخاطر الاستثمار والسيولة أولًا.';surStatus();return}
 if(!document.getElementById('sur-confirm-plan')?.checked){surplusWizard.error='راجع التفاصيل وأكد حفظ الخطة المقترحة.';surStatus();return}
 const detail=structuredClone(surplusWizard.targets),totals=surTotals();
 // مجرد خطة. لا تنشئ دفعة أو استثمارًا أو قرضًا ولا تغير الأرصدة المصرفية.
 state.surplusPlan=totals;state.surplusDetailPlan={available:x.free,targets:detail,approvedAt:new Date().toISOString()};
 state.history.push('اعتماد خطة تفصيلية للفائض دون تحويل أو سداد أو استثمار');surplusWizard=null;closeModal();
}
function renderSurplusWizard(){
 if(!surplusWizard)return;
 modalName='surplus';const w=surplusWizard,step=w.step;
 if(w.editing){const g=surplusSections.find(g=>g.id===w.editing);
  document.getElementById('modal-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><button class="back" onclick="surBack()">${icon('arrow')} رجوع</button><h2 id="modal-title">إضافة وجهة</h2><button class="close" aria-label="إغلاق" onclick="closeModal()">×</button></div><div class="modalbody"><div class="phase-label">${esc(g.name)}</div><div class="field"><label for="sur-new-name">اسم الوجهة المقترحة</label><input id="sur-new-name" maxlength="80" placeholder="اكتب اسم الهدف أو الوعاء"></div><p class="sur-disclaimer">إضافة تخطيطية داخل المعاينة فقط، وليست إنشاءً لحساب بنكي أو دين فعلي.</p><div class="sur-message" id="sur-msg"></div></div><div class="modalfooter"><button class="btn" onclick="surBack()">إلغاء</button><button class="btn primary" onclick="surSaveTarget()">حفظ الوجهة</button></div></section></div>`;return;
 }
 const titles=['تحديد وجهات الفائض','توزيع الفائض بالتفصيل','مراجعة خطة الفائض'];
 let body='';
 if(step===0)body=`<div class="phase-label">01 · إلى أين يتجه الفائض؟</div>${surCompactTotals()}<div class="sur-choices">${surplusSections.map(surChoice).join('')}</div><p class="sur-disclaimer">اضغط على أي وجهة لمراجعة ما تحتها. البيانات المعروضة أمثلة، وليست سجلاتك الفعلية.</p>`;
 if(step===1)body=`<div class="phase-label">02 · المبالغ والنسب</div>${surCompactTotals()}<div class="sur-mini-actions"><button class="btn" onclick="surAddRemaining()">${icon('calendar')} ترحيل غير الموزع</button><button class="btn" onclick="surplusWizard.openCat='carry';renderSurplusWizard()">${icon('repeat')} مراجعة الترحيل</button></div><p class="sur-disclaimer">افتح وجهة وحدد المبلغ أو النسبة؛ يتغير الحقل الآخر تلقائيًا.</p>${surplusSections.map(surOneGroup).join('')}`;
 if(step===2)body=`<div class="phase-label">03 · اعتماد الخطة المقترحة</div>${surCompactTotals()}${surReviewRows()}<label class="checkrow"><input id="sur-confirm-risk" type="checkbox" ${w.risk?'checked':''} onchange="surplusWizard.risk=this.checked"> إذا خصصت مبلغًا لدراسة الاستثمار فقد راجعت السيولة والمخاطر؛ هذا ليس أمر شراء.</label><label class="checkrow"><input id="sur-confirm-plan" type="checkbox" ${w.approved?'checked':''} onchange="surplusWizard.approved=this.checked"> أوافق على حفظ الخطة كمسودة توجيه مالي؛ السداد والتحويل والاستثمار تحتاج إجراءات واعتمادات مستقلة.</label>`;
 document.getElementById('modal-root').innerHTML=`<div class="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><button class="back" onclick="surBack()">${icon('arrow')} رجوع</button><h2 id="modal-title">${titles[step]}</h2><button class="close" aria-label="إغلاق" onclick="closeModal()">×</button></div><div class="modalbody"><div class="sur-flow"><span class="on"></span><span class="${step>0?'on':''}"></span><span class="${step>1?'on':''}"></span></div>${body}<div class="sur-message" id="sur-msg" role="alert"></div></div><div class="modalfooter"><button class="btn" onclick="surBack()">${step?'السابق':'إلغاء'}</button><button class="btn primary" onclick="surForward()">${step===2?'حفظ خطة الفائض':'التالي'} ${icon('arrow')}</button></div></section></div>`;
 surStatus();
}

function changeDay(n){state.day=n;render();if(state.reviewOpen)renderReviewWizard();else if(modalName==='date')openModal('date')}
function switchTab(tab){if(tab==='review'){openReview();return}state.tab=tab;render()}
function setMode(k){if(!(k in demoModes))return;state.mode=k;state.data=structuredClone(demoModes[k]);state.earlyReviewed=false;state.reconciled=false;state.surplusPlan=null;state.surplusDetailPlan=null;state.confirmation='';state.closed=false;state.history.unshift('تغيير سيناريو المعاينة إلى '+({deficit:'عجز',enough:'كفاية',surplus:'فائض'}[k]));render();if(state.reviewOpen)renderReviewWizard()}
function record(v){state.history.push(v);render()}
function renderModal(title,body,mainLabel,accept,backLabel='إلغاء',back="closeModal()"){$('#modal-root').innerHTML=`<div class="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><button class="back" onclick="${back}">${icon('arrow')} رجوع</button><h2 id="modal-title">${esc(title)}</h2><button class="close" aria-label="إغلاق" onclick="closeModal()">×</button></div><div class="modalbody">${body}<div class="error" id="modal-error" role="alert"></div></div><footer class="modalfooter"><button class="btn primary" id="modal-main">${mainLabel}</button><button class="btn" onclick="${back}">${backLabel}</button></footer></section></div>`;$('#modal-main').onclick=accept}
function closeModal(){modalName='';$('#modal-root').innerHTML='';render();if(state.reviewOpen)renderReviewWizard()}
function err(e){const target=$('#modal-error');if(target)target.textContent=String(e?.message||e)}
function openModal(kind){modalName=kind;const x=capture();
 if(kind==='date')return renderModal('موعد المراجعة',`<div class="day-picker-modal">${dateBtns()}</div>`, 'العودة',()=>{closeModal()});
 if(kind==='scenarios')return renderModal('تجربة الحالة',`<div class="vertical-actions"><button class="btn" onclick="setMode('deficit')">${icon('alert')} اختبار العجز</button><button class="btn" onclick="setMode('enough')">${icon('check')} اختبار الكفاية</button><button class="btn" onclick="setMode('surplus')">${icon('up')} اختبار الفائض</button></div>`, 'العودة',()=>closeModal());
 if(kind==='shortfalls')return renderModal('البنود المتجاوزة',x.shortfalls.map(c=>`<div class="transaction-line"><strong>${esc(c.name)}</strong>${money(c.overspend,'bad')}</div>`).join('')||'<p>لا توجد بنود متجاوزة.</p>', 'العودة',()=>closeModal());
 if(kind==='categories')return renderModal('بنود الدورة',state.data.cats.map(c=>`<div class="transaction-line"><div><strong>${esc(c.name)}</strong><small>مخصص ${fmt(c.budget)} · مصروف ${fmt(c.spent)}</small></div>${money(c.budget-c.spent,c.budget-c.spent<0?'bad':'pos')}</div>`).join(''),'العودة',()=>closeModal());
 if(kind==='history')return renderModal('سجل الإجراءات',state.history.length?state.history.slice().reverse().map(z=>`<div class="transaction-line">${icon('check')} <span>${esc(z)}</span></div>`).join(''):'<div class="empty-light">لا توجد إجراءات حتى الآن.</div>','إغلاق السجل',()=>closeModal());
 if(kind==='help')return renderModal('حول مراجعة الدورة',`<div class="help-mini">تُراجع السيولة يوم 25، وتستمر المصروفات حتى يوم 27. التوزيع والتمويل لا ينشئان نقدًا جديدًا. أي قرار مالي يحتاج موافقتك.</div>`, 'فهمت',()=>closeModal());
 if(kind==='welcome')return renderModal('مراجعة ما قبل الراتب',`<div class="info good">${icon('calendar')} تاريخ التجربة هو 25 نوفمبر. بقي يومان على موعد الراتب التالي يوم 27.</div><p class="note">الدورة الحالية مفتوحة لتسجيل المصروفات. افتح المراجعة المبكرة الآن لمعالجة العجز أو توجيه الفائض قبل الإغلاق النهائي.</p><div class="flow-step"><div class="circle">${icon('shield')}</div><div><b>مراجعة نقد الحسابات والمستحقات</b><p>لا يُعتمد أي قرض أو استثمار من التنبيه وحده.</p></div></div><div class="flow-step"><div class="circle">${icon('calendar')}</div><div><b>الاستمرار في الإنفاق حتى يوم 27</b><p>تتحدث النتائج فورًا إذا سجلت مصروفًا جديدًا.</p></div></div>`, 'فتح المراجعة',()=>{state.tab='review';closeModal()});
if(kind==='settings')return renderModal('مراجعة أرقام الحماية',`<div class="fields"><div class="field"><label>النقد الحقيقي في الحسابات</label><input id="s-cash" type="number" min="0" step="0.01" value="${fmt(state.data.cash)}"></div><div class="field"><label>المستحق قبل 27 نوفمبر</label><input id="s-dues" type="number" min="0" step="0.01" value="${fmt(state.data.dues)}"></div><div class="field"><label>احتياجات معيشية متبقية</label><input id="s-needs" type="number" min="0" step="0.01" value="${fmt(state.data.needs)}"></div><div class="field"><label>هامش الحماية المطلوب</label><input id="s-reserve" type="number" min="0" step="0.01" value="${fmt(state.data.reserve)}"></div><div class="field"><label>حوالات لم تُطابق بعد</label><input id="s-pending" type="number" min="0" step="0.01" value="${fmt(state.data.pending)}"></div><div class="field"><label>محجوزات أخرى</label><input id="s-blocked" type="number" min="0" step="0.01" value="${fmt(state.data.blocked)}"></div></div>`, 'تحديث الحساب',()=>{try{for(const k of ['cash','dues','needs','reserve','pending','blocked'])state.data[k]=toCents($('#s-'+k).value);state.surplusPlan=null;state.reconciled=false;state.closed=false;state.history.push('مراجعة بيانات حماية الدورة');closeModal()}catch(e){err(e)}});
if(kind==='expense')return renderModal('تسجيل مصروف قبل الراتب',`<div class="fields"><div class="field"><label>البند</label><select id="exp-category">${state.data.cats.map((v,i)=>`<option value="${i}">${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>المبلغ المخصوم (ريال)</label><input id="exp-amount" type="number" step="0.01" min="0.01" placeholder="0.00"></div></div>`, 'تسجيل المصروف',()=>{try{const c=toCents($('#exp-amount').value),i=Number($('#exp-category').value);if(!c||!state.data.cats[i]||c>state.data.cash)throw Error('المبلغ غير صالح أو يتجاوز النقد المتاح.');state.data.cats[i].spent+=c;state.data.cash-=c;state.entries.push({category:i,amount:c,date:sampleDate()});state.surplusPlan=null;state.reconciled=false;state.closed=false;state.history.push(`سجل مصروف ${fmt(c)} ريال من ${state.data.cats[i].name}`);closeModal()}catch(e){err(e)}});
if(kind==='rebalance')return renderModal('معالجة تجاوز بند',`<div class="info">تعديل مخصصات فقط، دون حوالة بنكية.</div><div class="fields"><div class="field"><label>البند المصدر</label><select id="rb-from">${state.data.cats.map((v,i)=>`<option value="${i}">${esc(v.name)} — متبقٍ ${fmt(Math.max(0,v.budget-v.spent))}</option>`).join('')}</select></div><div class="field"><label>البند المستفيد</label><select id="rb-to">${state.data.cats.map((v,i)=>`<option value="${i}">${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>نقل مخصص (ريال)</label><input id="rb-amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div></div>`, 'اعتماد إعادة التخصيص',()=>{try{const a=Number($('#rb-from').value),b=Number($('#rb-to').value),n=toCents($('#rb-amount').value);if(a===b||!n||!state.data.cats[a]||!state.data.cats[b]||n>Math.max(0,state.data.cats[a].budget-state.data.cats[a].spent))throw Error('اختر بندين مختلفين ولا تنقل أكثر من المتبقي في البند المصدر.');state.data.cats[a].budget-=n;state.data.cats[b].budget+=n;state.history.push(`نقل مخصص ${fmt(n)} ريال من ${state.data.cats[a].name} إلى ${state.data.cats[b].name}`);closeModal()}catch(e){err(e)}});
if(kind==='loan')return renderModal('طلب تمويل عبر بنك الهلال',`<div class="info warning">${icon('alert')} طلب دراسة فقط، دون إضافة نقد.</div><div class="summary-line"><span>العجز النقدي المحسوب</span>${money(x.deficit,'bad')}</div><div class="fields"><div class="field"><label>الجهة المقرضة الداخلية</label><select id="ln-source"><option value="ملاءة">بنك ملاءة</option><option value="الأصول">بنك الأصول</option></select></div><div class="field"><label>المبلغ المطلوب بالريال</label><input id="ln-amount" type="number" min="0.01" step="0.01" value="${fmt(x.deficit)}"></div><div class="field"><label>طريقة السداد</label><select id="ln-method"><option value="حسب القدرة المالية">حسب القدرة المالية</option><option value="أقساط شهرية">أقساط شهرية</option></select></div></div><label class="checkrow"><input id="ln-agree" type="checkbox"> أقر أن هذا طلب دراسة تمويل وليس صرفًا أو تحويلًا.</label>`, 'تسجيل طلب التمويل',()=>{try{const n=toCents($('#ln-amount').value),source=$('#ln-source').value,method=$('#ln-method').value;if(!n||!$('#ln-agree').checked)throw Error('حدد مبلغًا وأكد أن الطلب لا ينفذ تمويلًا.');state.loanRequests.push({n,source,method});state.history.push(`طلب تمويل لدى الهلال من ${source} بقيمة ${fmt(n)} ريال — قيد الدراسة`);closeModal()}catch(e){err(e)}});
if(kind==='surplus')return startSurplusWizard();
if(kind==='close')return renderModal('إغلاق الدورة والمراجعة النهائية',`<div class="info">${icon('calendar')} راجع مطابقة الحسابات قبل الإغلاق.</div><div class="summary-line"><span>الحالة عند الإغلاق</span><b>${captions[x.type][0]}</b></div><div class="summary-line"><span>النقد المؤكد</span>${money(x.cash,'pos')}</div><div class="summary-line"><span>الالتزامات القريبة</span>${money(x.due,'bad')}</div><label class="checkrow"><input id="cl-agree" type="checkbox"> أقر بمراجعة جميع العمليات وحالة التحويلات والسداد.</label>`, 'تأكيد إغلاق الدورة',()=>{try{if(state.day<27||!state.reconciled||!$('#cl-agree').checked)throw Error('لا يمكن الإغلاق قبل 27 والمطابقة النهائية والاعتماد.');const final=capture();if(final.deficit>0)throw Error('العجز النقدي لم يُحل؛ طلب التمويل وحده لا يعد توفيرًا للنقد.');if(final.type==='surplus'&&(!state.surplusPlan||Object.values(state.surplusPlan).reduce((a,b)=>a+b,0)!==final.free))throw Error('يلزم اعتماد خطة للفائض أو ترحيله كاملًا قبل إغلاق الدورة.');state.closed=true;state.history.push('توثيق إغلاق الدورة التجريبية — دون إنشاء راتب جديد');closeModal()}catch(e){err(e)}});
}
document.addEventListener('input', surplusInput, true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalName){e.preventDefault();closeModal()}});
render();if(state.day>=25&&!state.modalSeen){state.modalSeen=true;openReview()}
</script>
</body></html>
