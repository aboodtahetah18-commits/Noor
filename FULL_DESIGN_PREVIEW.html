<!doctype html>

<head>
<meta charset="utf-8">

<title>مستقبلي — المعاينة الكاملة للتصميم</title>
<style>
:root{--navy:#0B2D5B;--teal:#0EA5A2;--sky:#36B9ED;--green:#22C55E;--orange:#F59E0B;--red:#EF4444;--ink:#334155;--muted:#94A3B8;--line:#E2E8F0;--canvas:#F4F8FC;--card:#fff;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--canvas);font-family:Tajawal,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 248px;min-height:100vh}.side{grid-column:2;background:linear-gradient(180deg,#0B2D5B,#081f3e);color:#fff;position:sticky;top:0;height:100vh;padding:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:center;height:72px;border-bottom:1px solid #ffffff24}.brand img{width:168px;max-height:54px;object-fit:contain}
.nav{display:grid;gap:4px;overflow:auto}.nav button{height:46px;border:0;border-radius:11px;background:transparent;color:#d8e4f2;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:right}.nav button.active{background:#174f86;color:#fff;border-right:4px solid var(--sky)}
.ico{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{margin-top:auto;display:grid;gap:6px}.promo{background:linear-gradient(180deg,#eaf7ff,#ddecfa);color:var(--navy);border-radius:14px;padding:16px 10px;text-align:center;font-weight:800}
.main{grid-column:1;min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(240px,560px) 1fr;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}
.user{display:flex;align-items:center;gap:8px}.avatar{width:42px;height:42px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;color:var(--navy)}
.search{height:42px;border:1px solid var(--line);background:#f8fbff;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px}.search input{border:0;outline:0;background:transparent;width:100%}
.tools{display:flex;gap:6px}.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);display:grid;place-items:center}
.content{max-width:1440px;margin:auto;padding:20px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:12px}.pagehead h1{margin:0;font-size:28px;color:var(--navy)}.pagehead p{margin:5px 0 0;color:#64748b;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:nowrap}.btn{height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;font-weight:700;white-space:nowrap}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.teal{background:var(--teal);color:white;border-color:var(--teal)}.btn.icononly{width:42px;padding:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 20px #0b2d5b0a}.kpi{padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:104px}.kpi small{color:#64748b}.kpi strong{font-size:25px;color:var(--navy);display:flex;align-items:center;gap:5px;margin-top:5px}.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:#edf7ff;color:#0f6ec4}.badge.green{background:#eafbf5;color:#0f9f73}.badge.orange{background:#fff6e8;color:#d97706}.badge.red{background:#fff0f0;color:#d9363e}
.riyal{width:16px;height:16px;object-fit:contain}.grid2{display:grid;grid-template-columns:1.35fr .85fr;gap:10px}.section{padding:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.sectionhead h2{margin:0;color:var(--navy);font-size:18px}
.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border:1px solid #eef2f7;border-radius:12px;background:#fff}.row .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#eef7ff;color:#0f6ec4}.row strong{color:var(--navy)}.row small{display:block;color:#94a3b8;margin-top:2px}.pill{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700;background:#eafbf5;color:#0f8d68}.pill.warn{background:#fff6df;color:#b46d00}.pill.red{background:#fff0f0;color:#c53939}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}.table th{color:#64748b;font-weight:700;background:#f8fbff}.bar{height:8px;border-radius:99px;background:#e8eef5;overflow:hidden}.bar>span{display:block;height:100%;background:var(--teal);border-radius:99px}
.chart{height:210px;display:flex;align-items:flex-end;gap:10px;padding:18px 8px 5px}.chart b{flex:1;background:linear-gradient(180deg,#36B9ED,#0B74C9);border-radius:8px 8px 2px 2px;min-width:18px;position:relative}.chart b:after{content:attr(data-m);position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#64748b}
.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;font-size:12px;color:#64748b}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink)}.field input,.field select{height:42px}.field textarea{min-height:84px;padding-top:9px;resize:vertical}
.formfoot{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.view{display:none}.view.active{display:block}.mobiletop,.bottom{display:none}.tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.tab{height:38px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#64748b;padding:0 11px;white-space:nowrap}.tab.active{background:#eff8ff;color:var(--navy);border-color:#cde8ff}
@media(max-width:1050px){.app{grid-template-columns:1fr 82px}.side{width:82px;padding:10px 7px}.brand img{width:58px}.nav button{justify-content:center;padding:0}.nav button span,.promo{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:767px){
 body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}.app{display:block}.side,.top{display:none}.mobiletop{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:20}.mobiletop img{width:132px;max-height:42px;object-fit:contain}
 .content{padding:12px}.pagehead{display:block}.pagehead h1{font-size:22px}.actions{margin-top:10px;overflow:auto}.actions .btn{height:40px;padding:0 9px;font-size:12px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kpi{min-height:90px;padding:10px}.kpi strong{font-size:20px}.badge{width:42px;height:42px}.grid2{grid-template-columns:1fr;gap:7px}.section{padding:10px}.tablewrap{overflow:auto}.table{min-width:650px}
 .form{grid-template-columns:1fr 1fr;gap:7px}.field.full{grid-column:1/-1}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);z-index:30}.bottom button{border:0;background:transparent;color:#64748b;display:grid;place-items:center;align-content:center;gap:2px;font-size:9px}.bottom button.active{color:var(--navy);font-weight:800}.bottom svg{width:24px;height:24px}
}
</style>

<style id="mobile-fix-v2">
@media(max-width:767px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .main,.content,.view,.card,.section{width:100%;max-width:100%;min-width:0}
  .content{padding:10px 10px calc(78px + env(safe-area-inset-bottom))}
  .pagehead{width:100%;display:grid;grid-template-columns:1fr;gap:8px;align-items:start}
  .pagehead>div:first-child{width:100%;min-width:0}
  .pagehead h1,.pagehead p{max-width:100%;overflow-wrap:anywhere}
  .actions{
    width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
    gap:6px;overflow:visible
  }
  .actions .btn{width:100%;min-width:0;padding-inline:6px;font-size:11px}
  .kpis{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{width:100%;min-width:0}
  .grid2{width:100%;grid-template-columns:1fr}
  .section{overflow:hidden}
  .tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table{min-width:620px}
  .form{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
  .field,.field input,.field select,.field textarea{min-width:0;width:100%}
  .field.full{grid-column:1/-1}
  .formfoot{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
  .mobiletop{width:100%;padding-inline:10px;gap:8px}
  .mobiletop img{width:128px;max-width:42vw;height:auto;object-fit:contain}
  .mobiletop .tools{margin-inline-start:auto}
  .bottom{
    left:0!important;right:0!important;width:100%!important;max-width:100%!important;
    grid-template-columns:repeat(5,minmax(0,1fr));overflow:hidden
  }
  .bottom button{
    min-width:0;width:100%;padding:4px 0 2px;overflow:hidden
  }
  .bottom button span{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottom svg{width:23px;height:23px}
  .tabs{width:100%;max-width:100%;overflow-x:auto;padding-bottom:3px}
  .tab{flex:0 0 auto}
  .settings-nav{
    display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px!important;
    overflow:visible!important;width:100%
  }
  .settings-nav .tab{width:100%;min-width:0;padding:0 5px;font-size:10px}
  .modal{align-items:end;padding:0}
  .modal-panel{
    width:100%;max-width:100%;max-height:92vh;border-radius:18px 18px 0 0;
    margin:0;overflow:auto
  }
}
@media(max-width:390px){
  .actions{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions .btn.icononly{width:100%}
}
.modal{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}
.modal-panel{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 28px 70px #0f172a35}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;color:var(--navy)}
.modal-body{padding:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:12px 16px;border-top:1px solid var(--line)}
.settings-nav{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.settings-pane{display:none}.settings-pane.active{display:block}
</style>

<style id="v3-polish">
:root{
  --soft-blue:#eef7ff;
  --soft-teal:#edfbf9;
  --soft-gold:#fff8ea;
  --soft-red:#fff1f2;
}
.card,.modal-panel{
  background:
    linear-gradient(180deg,rgba(255,255,255,.98),rgba(250,253,255,.98));
}
.card{box-shadow:0 10px 28px rgba(11,45,91,.07)}
.sectionhead{padding-bottom:8px;border-bottom:1px solid #eef3f8}
.row{transition:.18s ease;cursor:pointer}
.row:hover{border-color:#cfe6f7;transform:translateY(-1px);box-shadow:0 6px 16px rgba(11,45,91,.05)}
.modal{backdrop-filter:blur(7px)}
.modal-panel{overflow:hidden;border:1px solid #d8e7f3}
.modal-head{
  position:relative;padding:18px 18px 16px;
  background:linear-gradient(135deg,#f0f9ff 0%,#ffffff 55%,#edfbf9 100%);
  border-bottom:1px solid #dcebf5
}
.modal-head:before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--teal),var(--sky))
}
.modal-title-wrap{display:flex;align-items:center;gap:11px}
.modal-title-icon{
  width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0B2D5B,#0EA5A2);
  color:white;display:grid;place-items:center;box-shadow:0 7px 16px rgba(14,165,162,.16)
}
.modal-title-icon svg{width:22px;height:22px}
.modal-subtitle{font-size:11px;color:#64748b;margin-top:2px}
.modal-body{
  background:
    radial-gradient(circle at 90% 0%,rgba(54,185,237,.06),transparent 28%),
    #fbfdff;
}
.form .field{
  padding:9px;border:1px solid #e7eef5;border-radius:12px;background:#fff;
}
.field input,.field select,.field textarea{border-color:#dce6ef!important;background:#fbfdff!important}
.modal-foot{background:#f8fbfe;border-top:1px solid #e5edf4}
.bank-chip{
  display:flex;align-items:center;gap:8px;min-width:0
}
.bank-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:10px;font-weight:900;color:#fff;flex:0 0 34px;letter-spacing:-.5px
}
.bank-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bank-option{
  min-width:0;border:1px solid #e1e9f1;border-radius:12px;background:#fff;padding:9px;
  display:flex;align-items:center;gap:8px;text-align:right
}
.bank-option span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-group{display:grid;gap:8px}
.data-title{font-weight:800;color:var(--navy);margin:6px 0 2px}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.category-card{
  border:1px solid #e7eef5;background:#fff;border-radius:12px;padding:10px;min-width:0
}
.category-card strong{color:var(--navy)}
.category-card small{display:block;color:#94a3b8;margin-top:4px;line-height:1.7}
.linklike{color:#0b74c9;text-decoration:underline;text-decoration-color:#cfe8fa;text-underline-offset:3px}
.settings-nav{margin-bottom:12px}
@media(max-width:767px){
  .pagehead .actions{
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    grid-auto-flow:initial!important;
    gap:6px!important;
    overflow:visible!important;
    width:100%!important
  }
  .pagehead .actions .btn{
    width:100%!important;min-width:0!important;height:40px!important;padding:0 5px!important;
    font-size:10.5px!important;gap:4px!important
  }
  .pagehead .actions .btn svg{width:18px;height:18px}
  .pagehead .actions .btn.icononly{width:100%!important}
  .bank-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-body{padding:12px}
}
@media(max-width:360px){
  .pagehead .actions .btn{font-size:9.5px!important}
}
</style>
</head>

function bankMark(b){
  return `<span class="bank-mark" style="background:${b.color}">${b.id.slice(0,4)}</span>`;
}
function bankSelectOptions(){
  return BANKS.map(b=>`<option value="${b.id}">${b.name} — ${b.group}</option>`).join('');
}
function bankDirectoryHTML(){
  const groups=['محلي','رقمي','أجنبي'];
  return groups.map(g=>`<div class="data-group"><div class="data-title">${g==='محلي'?'البنوك المحلية':g==='رقمي'?'البنوك الرقمية':'فروع البنوك الأجنبية'}</div><div class="bank-grid">${
    BANKS.filter(b=>b.group===g).map(b=>`<button class="bank-option js-bank" data-bank="${b.id}">${bankMark(b)}<span>${b.name}</span></button>`).join('')
  }</div></div>`).join('');
}
function categoriesHTML(){
  return Object.entries(CATEGORY_GROUPS).map(([g,items])=>`<div class="data-group"><div class="data-title">${g}</div><div class="category-grid">${
    items.map(([n,d])=>`<div class="category-card"><strong>${n}</strong><small>${d}</small></div>`).join('')
  }</div></div>`).join('');
}

document.addEventListener('click',e=>{
  const save=e.target.closest('.js-save'); if(save){save.textContent='تم الحفظ ✓';setTimeout(()=>save.textContent='حفظ',900)}
  const reset=e.target.closest('.js-reset'); if(reset){reset.textContent='تم الإلغاء';setTimeout(()=>reset.textContent='إلغاء',700)}
  const open=e.target.closest('.js-open'); if(open) openModal(open.dataset.modal||'generic');
  const setTab=e.target.closest('[data-setting]');
  if(setTab){
    document.querySelectorAll('[data-setting]').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('[data-pane]').forEach(x=>x.classList.remove('active'));
    setTab.classList.add('active');
    const pane=document.querySelector(`[data-pane="${setTab.dataset.setting}"]`);
    if(pane)pane.classList.add('active');
  }
  const action=e.target.closest('.actions .btn');
  if(action && !action.classList.contains('js-open')){
    const txt=action.textContent.trim();
    if(txt.includes('مصروف')) openModal('expense');
    else if(txt.includes('رسالة بنك')) openModal('bank');
    else if(txt.includes('تمويل')) openModal('funding');
    else if(txt.includes('هدف')) openModal('goal');
    else if(txt.includes('التزام')) openModal('obligation');
    else if(txt.includes('حساب')) openModal('account');
    else if(txt.includes('جدول السداد')) openModal('funding');
    else if(txt.includes('التصنيفات')) view('settings');
    else if(txt.includes('الإعدادات')) view('settings');
    else openModal('generic');
  }
  const plus=e.target.closest('.sectionhead .btn.icononly');
  if(plus && !plus.classList.contains('js-open')) openModal('generic');
  const bankRow=e.target.closest('.js-bank-row');
  if(bankRow){ openModal('account'); return; }
  const bankBtn=e.target.closest('.js-bank');
  if(bankBtn){ openModal('account'); return; }

  const row=e.target.closest('.row');
  if(row && !e.target.closest('button')){
    const txt=row.textContent;
    if(txt.includes('هدف') || txt.includes('شراء سيارة')) view('goals');
    else if(txt.includes('كشف حساب') || txt.includes('الراجحي') || txt.includes('الأهلي')) view('banks');
    else if(txt.includes('التزام') || txt.includes('قسط')) view('obligations');
    else openModal('generic');
  }

  // Context actions link pages together.
  const txt=e.target.closest('button')?.textContent?.trim()||'';
  if(txt.includes('إدارة البنوك')) view('settings');
  if(txt.includes('حساب الطوارئ')) view('funding');
  if(txt.includes('التقويم')) view('obligations');
  if(txt.includes('تحليل') && currentPage==='goals') view('reports');
});
