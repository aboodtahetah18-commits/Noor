name: Verify Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: namaa-ci-build-only-secret-20260917
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://namaa_build:namaa_build@127.0.0.1:5432/namaa_build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify deployment authority
        run: npm run verify:deployment-authority

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
