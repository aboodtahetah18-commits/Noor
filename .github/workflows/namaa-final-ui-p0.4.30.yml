name: Namaa Final UI P0.4.30

on:
  push:
    branches:
      - namaa-final-ui-p0.4.30-runtime
  pull_request:
    paths:
      - '.github/workflows/namaa-final-ui-p0.4.30.yml'
      - 'scripts/materialize-namaa-final-ui.sh'
      - 'scripts/patch-namaa-final-ui-compat.mjs'
      - 'scripts/preserve-noor-financial-backend.sh'
      - 'package.json'
      - 'vercel.json'

jobs:
  verify-final-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Materialize exact sanitized artifact
        run: bash scripts/materialize-namaa-final-ui.sh
      - name: Apply compatibility patch
        run: node scripts/patch-namaa-final-ui-compat.mjs
      - name: Preserve governed Noor financial backend
        run: bash scripts/preserve-noor-financial-backend.sh
      - name: Install runtime dependencies
        working-directory: apps/namaa-final-ui
        run: npm install --legacy-peer-deps --no-audit --no-fund && npm install --no-save --legacy-peer-deps --no-audit --no-fund drizzle-orm@0.44.5
      - name: Typecheck
        working-directory: apps/namaa-final-ui
        run: npm run typecheck
      - name: UI QA
        working-directory: apps/namaa-final-ui
        run: npm run qa:ui-all
      - name: Build
        working-directory: apps/namaa-final-ui
        env:
          DATABASE_URL: postgresql://namaa_build:namaa_build@127.0.0.1:5432/namaa_build
          BETTER_AUTH_SECRET: namaa-build-only-secret-not-for-runtime-20260916
          BETTER_AUTH_URL: http://127.0.0.1:3000
        run: npm run build
